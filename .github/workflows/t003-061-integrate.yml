name: t003-061-integrate
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Integrate protected egress permit lifecycle
        shell: python
        run: |
          import base64
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: replacement count {count} for {old!r}')
              path.write_text(text.replace(old, new, 1))

          lib = Path('crates/golam-ledger/src/lib.rs')
          replace_once(lib, 'pub mod effects;\n', 'pub mod effects;\npub mod egress_permit;\n')

          storage = Path('crates/golam-ledger/src/storage.rs')
          replace_once(storage, 'pub const AUTHORITY_SCHEMA_VERSION: i64 = 3;', 'pub const AUTHORITY_SCHEMA_VERSION: i64 = 4;')
          replace_once(
              storage,
              '    if version == 2 {\n        migrate_v3(connection)?;\n        version = 3;\n    }\n    debug_assert_eq!(version, AUTHORITY_SCHEMA_VERSION);',
              '    if version == 2 {\n        migrate_v3(connection)?;\n        version = 3;\n    }\n    if version == 3 {\n        migrate_v4(connection)?;\n        version = 4;\n    }\n    debug_assert_eq!(version, AUTHORITY_SCHEMA_VERSION);',
          )
          migrate_v4 = base64.b64decode('').decode()
          replace_once(storage, 'fn verify_quick_check(connection: &Connection) -> Result<(), StorageError> {', migrate_v4 + 'fn verify_quick_check(connection: &Connection) -> Result<(), StorageError> {')
          replace_once(
              storage,
              '        store.verify_integrity().unwrap();\n    }',
              '        assert!(has_column(&store.connection, "egress_permits", "uses_consumed"));\n        store.verify_integrity().unwrap();\n    }',
          )

          security = Path('crates/golam-ledger/src/authority_security_v2.rs')
          replace_once(
              security,
              'query: "SELECT permit_id, principal_or_process, action, purpose, destination_scope, protocol_port_scope, taint_digest, secret_handle_id, parent_lease_id, issued_at, expires_at, usage_limit, status FROM egress_permits ORDER BY permit_id",',
              'query: "SELECT permit_id, principal_or_process, action, purpose, destination_scope, protocol_port_scope, taint_digest, secret_handle_id, parent_lease_id, issued_at, expires_at, usage_limit, status, uses_consumed FROM egress_permits ORDER BY permit_id",',
          )

          writer = Path('crates/golam-ledger/src/authority_security_write.rs')
          replace_once(writer, '    SecretUseRecord,\n    #[cfg(test)]', '    SecretUseRecord,\n    EgressPermit,\n    #[cfg(test)]')
          replace_once(writer, '            Self::SecretUseRecord => "secret_use_record",\n            #[cfg(test)]', '            Self::SecretUseRecord => "secret_use_record",\n            Self::EgressPermit => "egress_permit",\n            #[cfg(test)]')
          writer_fn = base64.b64decode('').decode()
          replace_once(writer, '#[cfg(test)]\npub(crate) fn append_sandbox_profile_snapshot(', writer_fn + '#[cfg(test)]\npub(crate) fn append_sandbox_profile_snapshot(')

          egress = Path('crates/golam-ledger/src/egress_permit.rs')
          replace_once(egress, '    reason_code: String,\n    intent_digest:', '    intent_digest:')
          replace_once(egress, '        reason_code: reason_code.to_owned(),\n        intent_digest,', '        intent_digest,')
          replace_once(egress, '            None,\n        ),\n    )\n}\n\nfn verify_lease_chain(', '            Some(observed_at),\n        ),\n    )\n}\n\nfn verify_lease_chain(')
          replace_once(egress, '            } else if permit_expires_at.is_none() && depth == 0 {', '            } else if permit_expires_at.is_none() {')
          replace_once(egress, '        if row.8 >= *expires_at {', '        if row.8.as_str() >= expires_at {')
          replace_once(
              egress,
              '    require_latest_global_seq(transaction, global_seq, EgressPermitError::StaleAuthorityDecision)?;',
              '    if latest_global_seq(transaction)? != global_seq {\n        return Err(EgressPermitError::StaleAuthorityDecision);\n    }',
          )
          replace_once(
              egress,
              '    require_latest_global_seq(transaction, global_seq, EgressPermitError::UseDecisionStale)?;',
              '    if latest_global_seq(transaction)? != global_seq {\n        return Err(EgressPermitError::UseDecisionStale);\n    }',
          )
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          replace_once(egress, old, new)
      - name: Format and run focused T003-061 qualification
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p golam-ledger egress_permit::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger storage::tests::migration_creates_required_authority_tables -- --nocapture
          cargo +1.98.0 clippy -p golam-ledger --all-targets -- -D warnings
      - name: Commit clean implementation delta
        run: |
          git rm .github/workflows/t003-061-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/lib.rs
          git add crates/golam-ledger/src/storage.rs
          git add crates/golam-ledger/src/authority_security_v2.rs
          git add crates/golam-ledger/src/authority_security_write.rs
          git add crates/golam-ledger/src/egress_permit.rs
          git commit -m 'feat: implement protected egress permit lifecycle'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
