name: t003-082-hostile-adapter-qualification

on:
  push:
    branches:
      - qualify/t003-082-hostile-adapter

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.98.0 fmt --all -- --check
      - name: Hostile adapter qualification
        run: cargo +1.98.0 test --locked -p golam-kernel --test hostile_adapter -- --nocapture
      - name: Kernel lint qualification
        run: cargo +1.98.0 clippy --locked -p golam-kernel --all-targets -- -D warnings
