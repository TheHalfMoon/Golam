name: spec006-phase-d-format-materialize

on:
  push:
    branches: [impl/006-desktop-computer-control]
    paths:
      - .github/workflows/spec006-phase-d-format-materialize.yml

permissions:
  contents: write

jobs:
  format-native-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/006-desktop-computer-control
          fetch-depth: 0

      - name: Bind exact trigger head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --porcelain)" = ""

      - name: Install pinned Rust formatter
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Materialize canonical formatting only
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            crates/golamd/src/desktop_observation.rs
            crates/golamd/tests/desktop_observation_adapter.rs
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Self-remove helper and commit bounded result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/spec006-phase-d-format-materialize.yml
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/spec006-phase-d-format-materialize.yml
            crates/golamd/src/desktop_observation.rs
            crates/golamd/tests/desktop_observation_adapter.rs
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/spec006-phase-d-format-materialize.yml \
            crates/golamd/src/desktop_observation.rs \
            crates/golamd/tests/desktop_observation_adapter.rs
          git commit -m "style(006): format native observation adapter"
          git push origin HEAD:impl/006-desktop-computer-control
