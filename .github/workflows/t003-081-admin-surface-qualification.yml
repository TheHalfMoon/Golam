name: T003-081 Admin Surface Qualification

on:
  push:
    branches:
      - qualify/t003-081-admin-surface

permissions:
  contents: read

concurrency:
  group: t003-081-admin-surface
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Prepare bounded implementation
        run: python scripts/qualification/prepare-t003-081.py
      - name: Format implementation
        run: cargo +1.98.0 fmt --all
      - name: Verify formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Focused ledger canary qualification
        run: cargo +1.98.0 test --locked -p golam-ledger admin_qualification::tests::
      - name: Focused IPC command qualification
        run: cargo +1.98.0 test --locked -p golam-ipc command::tests::
      - name: Focused kernel admin qualification
        run: cargo +1.98.0 test --locked -p golam-kernel admin_qualification::tests::
      - name: Runtime bootstrap regression
        run: cargo +1.98.0 test --locked -p golam-kernel runtime_policy::tests::bootstrap_is_local_owner_administration_only
      - name: CLI parser qualification
        run: cargo +1.98.0 test --locked -p golam --lib
      - name: Daemon router qualification
        run: cargo +1.98.0 test --locked -p golamd --lib
      - name: Focused clippy
        run: cargo +1.98.0 clippy --locked -p golam-ledger -p golam-ipc -p golam-kernel -p golam -p golamd --all-targets -- -D warnings
      - name: Package prepared source
        uses: actions/upload-artifact@v4
        with:
          name: t003-081-prepared-source
          path: |
            crates/golam-ledger/src/admin_qualification.rs
            crates/golam-ledger/src/lib.rs
            crates/golam-kernel/src/admin_qualification.rs
            crates/golam-kernel/src/lib.rs
            crates/golam-kernel/src/authorization.rs
            crates/golam-kernel/src/runtime_policy.rs
            crates/golam-ipc/src/command.rs
            crates/golam/src/lib.rs
            crates/golamd/src/lib.rs
            specs/003-identity-policy-secrets-sandbox/quickstart.md
          if-no-files-found: error
