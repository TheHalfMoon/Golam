name: T003-081 Admin Surface Qualification

on: [push]

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - run: python scripts/qualification/prepare-t003-081.py
      - run: cargo +1.98.0 fmt --all -- --check
      - run: cargo +1.98.0 test --locked -p golam-ledger admin_qualification::tests::
      - run: cargo +1.98.0 test --locked -p golam-ipc command::tests::
      - run: cargo +1.98.0 test --locked -p golam-kernel admin_qualification::tests::
      - run: cargo +1.98.0 test --locked -p golam-kernel runtime_policy::tests::bootstrap_is_local_owner_administration_only
      - run: cargo +1.98.0 test --locked -p golam --lib
      - run: cargo +1.98.0 test --locked -p golamd --lib
      - run: cargo +1.98.0 clippy --locked -p golam-ledger -p golam-ipc -p golam-kernel -p golam -p golamd --all-targets -- -D warnings
