name: t003-081-admin-surface-handoff

on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Repair bounded test lint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/qualification/prepare-t003-081.py')
          text = path.read_text()
          old = 'decision_id.as_bytes().chunks_exact(2).enumerate()'
          new = 'decision_id.as_bytes().as_chunks::<2>().0.iter().enumerate()'
          if text.count(old) != 1:
              raise SystemExit('expected one T003-081 chunks_exact test anchor')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply qualified T003-081 implementation
        run: python3 scripts/qualification/prepare-t003-081.py
      - name: Format
        run: cargo +1.98.0 fmt --all
      - name: Verify focused qualification
        run: |
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked -p golam-ledger admin_qualification::tests:: -- --nocapture
          cargo +1.98.0 test --locked -p golam-ipc command::tests:: -- --nocapture
          cargo +1.98.0 test --locked -p golam-kernel admin_qualification::tests:: -- --nocapture
          cargo +1.98.0 test --locked -p golam-kernel runtime_policy::tests::bootstrap_is_local_owner_administration_only -- --nocapture
          cargo +1.98.0 test --locked -p golam --lib -- --nocapture
          cargo +1.98.0 test --locked -p golamd --lib -- --nocapture
          cargo +1.98.0 clippy --locked -p golam-ledger -p golam-ipc -p golam-kernel -p golam -p golamd --all-targets -- -D warnings
      - name: Commit clean T003-081 implementation
        run: |
          git rm .github/workflows/t003-081-admin-surface-qualification.yml
          git rm scripts/qualification/prepare-t003-081.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/admin_qualification.rs
          git add crates/golam-ledger/src/lib.rs
          git add crates/golam-kernel/src/admin_qualification.rs
          git add crates/golam-kernel/src/lib.rs
          git add crates/golam-kernel/src/authorization.rs
          git add crates/golam-kernel/src/runtime_policy.rs
          git add crates/golam-ipc/src/command.rs
          git add crates/golam/src/lib.rs
          git add crates/golamd/src/lib.rs
          git add specs/003-identity-policy-secrets-sandbox/quickstart.md
          git commit -m 'feat: add authenticated Spec 003 admin qualification surface'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
