name: spec005-h-mcp-local-relay

on:
  push:
    branches:
      - impl/005-local-tools-context-memory
    paths:
      - .github/workflows/spec005-h-mcp-local-relay.yml

permissions:
  contents: write

jobs:
  qualify-and-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Restore qualified library and qualify local MCP bridge
        shell: bash
        run: |
          set -euo pipefail
          git show 8bc2f6b14710435995a7f0a8131de8c123755743:crates/golamd/src/lib.rs > crates/golamd/src/lib.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/golamd/src/lib.rs')
          text = path.read_text()
          anchor = 'pub mod local_fs;\n'
          replacement = 'pub mod local_fs;\npub mod mcp_local_process_v2;\n'
          if text.count(anchor) != 1:
              raise SystemExit('expected exact qualified local_fs module anchor')
          path.write_text(text.replace(anchor, replacement, 1))
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golam-core -p golamd --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golamd mcp_local_process_v2::
          cargo +1.98.0 test --locked -p golamd mcp_protocol::
          cargo +1.98.0 test --locked -p golamd --lib
      - name: Commit exact qualified T005-090 unit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin impl/005-local-tools-context-memory
          test "$(git rev-parse origin/impl/005-local-tools-context-memory)" = "$GITHUB_SHA"
          git rm .github/workflows/spec005-h-mcp-local-relay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golamd/src/lib.rs crates/golamd/src/mcp_local_process_v2.rs
          git commit -m 'feat(005): govern local MCP process launch'
          git push origin HEAD:impl/005-local-tools-context-memory
