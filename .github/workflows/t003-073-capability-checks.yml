name: t003-072-qualification-recorder
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Record exact T003-072 qualification
        shell: python
        run: |
          from pathlib import Path

          qualified_head = '241f36a6fbbaad93d46aed1970353a9270b05431'
          qualified_tree = '37d65e8dc72f0c9ed4935ac997d2de06e653b101'
          ci_run = '33237725527'

          tasks = Path('specs/003-identity-policy-secrets-sandbox/tasks.md')
          text = tasks.read_text()
          old_task = '- [ ] **T003-072** Enforce cleared environment and explicit FS/network/spawn/resource/device/IPC/handle inheritance rules.'
          new_task = '- [x] **T003-072** Enforce cleared environment and explicit FS/network/spawn/resource/device/IPC/handle inheritance rules. Exact-head qualification: CI #565 (`33237725527`) SUCCESS at `241f36a6fbbaad93d46aed1970353a9270b05431`, tree `37d65e8dc72f0c9ed4935ac997d2de06e653b101`, on Windows/macOS/Ubuntu. Evidence: `implementation/sandbox-enforcement-qualification.md`.'
          if text.count(old_task) != 1:
              raise SystemExit(f'T003-072 task anchor count {text.count(old_task)}')
          text = text.replace(old_task, new_task, 1)
          text = text.replace('PHASE_G_ACTIVE=YES\n', '', 1)
          old_gate = 'T003_071_CI_RUN=33237313243\nNEXT_TASK=T003-072'
          new_gate = '\n'.join([
              'T003_071_CI_RUN=33237313243',
              'T003_072=PASS',
              f'T003_072_QUALIFIED_HEAD={qualified_head}',
              f'T003_072_QUALIFIED_TREE={qualified_tree}',
              f'T003_072_CI_RUN={ci_run}',
              'NEXT_TASK=T003-073',
          ])
          if text.count(old_gate) != 1:
              raise SystemExit(f'T003-072 task gate anchor count {text.count(old_gate)}')
          tasks.write_text(text.replace(old_gate, new_gate, 1))

          plan = Path('specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md')
          text = plan.read_text()
          if text.count('**Current task**: `T003-071`') != 1:
              raise SystemExit('current-task anchor mismatch')
          text = text.replace('**Current task**: `T003-071`', '**Current task**: `T003-073`', 1)
          text = text.replace('Phase H is active at T003-070.', 'Phase H is active at T003-073.', 1)
          old_section = '\n'.join([
              '### T003-072 — ACTIVE',
              '',
              'Enforce cleared environment and explicit FS/network/spawn/resource/device/IPC/handle inheritance rules without claiming platform containment before T003-073/T003-074.',
          ])
          new_section = '\n'.join([
              '### T003-072 — COMPLETE',
              '',
              'Qualified at exact implementation head `241f36a6fbbaad93d46aed1970353a9270b05431`, tree `37d65e8dc72f0c9ed4935ac997d2de06e653b101`, by CI #565 / run `33237725527`, SUCCESS on Windows/macOS/Ubuntu.',
              '',
              'Evidence: `implementation/sandbox-enforcement-qualification.md`.',
              '',
              'The qualified boundary starts from a cleared environment, rejects filesystem/environment/device/IPC/inherited-handle widening, preserves strict-local network dominance, prevents spawn widening, intersects resource limits to the stricter bound, and explicitly does not claim OS/platform containment or launch a process.',
              '',
              '### T003-073 — ACTIVE',
              '',
              'Resolve every profile and rights-derived containment requirement against a trusted current-platform executor capability manifest and fail closed before launch when any required control is unsupported. No native process launch is authorized by this task.',
          ])
          if text.count(old_section) != 1:
              raise SystemExit(f'T003-072 execution section anchor count {text.count(old_section)}')
          text = text.replace(old_section, new_section, 1)
          text = text.replace('- Remaining Phase H: T003-070..T003-076.', '- Remaining Phase H: T003-073..T003-076.', 1)
          if text.count(old_gate) != 1:
              raise SystemExit(f'T003-072 execution gate anchor count {text.count(old_gate)}')
          plan.write_text(text.replace(old_gate, new_gate, 1))

          evidence = Path('specs/003-identity-policy-secrets-sandbox/implementation/sandbox-enforcement-qualification.md')
          if evidence.exists():
              raise SystemExit('sandbox-enforcement qualification already exists')
          lines = [
              '# T003-072 Sandbox Enforcement Qualification',
              '',
              '## Scope',
              '',
              'T003-072 enforces the bounded rights represented by a qualified `SandboxLaunchPlan` without claiming operating-system containment or launching a process.',
              '',
              '## Exact qualification',
              '',
              '- Qualified implementation head: `241f36a6fbbaad93d46aed1970353a9270b05431`',
              '- Qualified tree: `37d65e8dc72f0c9ed4935ac997d2de06e653b101`',
              '- Official CI: #565 / run `33237725527`',
              '- Windows: SUCCESS',
              '- macOS: SUCCESS',
              '- Ubuntu: SUCCESS',
              '',
              'The official run completed `fmt`, `clippy`, workspace tests, property qualification, bounded fuzz smoke, authenticated IPC qualification, adversarial authority qualification, and the platform-appropriate external strict-local observation on the exact qualified head.',
              '',
              '## Security properties',
              '',
              '- Launch rights are resolved only as a subset of the already qualified launch plan.',
              '- The environment starts cleared and only explicitly allowlisted variable names may be requested.',
              '- Filesystem read/write roots cannot widen beyond profile bounds.',
              '- External network rights require the pre-existing non-strict permit-bound plan; strict-local remains dominant.',
              '- Spawn rights can only narrow the profile rule.',
              '- CPU, memory, time, and output limits resolve to the stricter bound.',
              '- Device, IPC, and inherited-handle requests must be explicitly declared.',
              '- The descriptor carries no ambient authority inheritance.',
              '- The descriptor does not claim OS/platform containment.',
              '- No Golam-managed native child process was launched by this task.',
              '',
              '```text',
              'T003_072=PASS',
              'ENVIRONMENT_CLEARED_BY_CONTRACT=YES',
              'AMBIENT_ENV_INHERITANCE=NO',
              'FS_RIGHTS_WIDENING_POSSIBLE=NO',
              'NETWORK_RIGHTS_WIDENING_POSSIBLE=NO',
              'SPAWN_RIGHTS_WIDENING_POSSIBLE=NO',
              'DEVICE_IPC_HANDLE_WIDENING_POSSIBLE=NO',
              'PLATFORM_CONTAINMENT_CLAIMED=NO',
              'NETWORK_CAPABLE_MANAGED_CHILD_LAUNCHED=NO',
              'NEXT_TASK=T003-073',
              '```',
          ]
          evidence.write_text('\n'.join(lines) + '\n')
      - name: Validate recorder mutation
        run: |
          git diff --check
          grep -q '^T003_072=PASS$' specs/003-identity-policy-secrets-sandbox/tasks.md
          grep -q '^NEXT_TASK=T003-073$' specs/003-identity-policy-secrets-sandbox/tasks.md
          grep -q '^T003_072=PASS$' specs/003-identity-policy-secrets-sandbox/implementation/sandbox-enforcement-qualification.md
      - name: Commit repository evidence
        run: |
          git rm .github/workflows/t003-073-capability-checks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/003-identity-policy-secrets-sandbox/tasks.md
          git add specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md
          git add specs/003-identity-policy-secrets-sandbox/implementation/sandbox-enforcement-qualification.md
          git commit -m 'docs: record T003-072 sandbox enforcement qualification'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox