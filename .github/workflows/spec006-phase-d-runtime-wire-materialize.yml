name: spec006-phase-d-runtime-wire-materialize

on:
  push:
    branches:
      - impl/006-desktop-computer-control
    paths:
      - .github/workflows/spec006-phase-d-runtime-wire-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact helper-only arm commit
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="e4c5b8b58870b8ecd7b2de500cc0d7815e381100"
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "${actual_parent}" != "${expected_parent}" ]]; then
            echo "expected parent ${expected_parent}, got ${actual_parent}" >&2
            exit 1
          fi
          helper=".github/workflows/spec006-phase-d-runtime-wire-materialize.yml"
          actual="$(git diff --name-only HEAD^ HEAD)"
          if [[ "${actual}" != "${helper}" ]]; then
            echo "arm commit is not helper-only: ${actual}" >&2
            exit 1
          fi
          echo 'PHASE_D_RUNTIME_WIRE_ARM_EXACT=YES'

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev build-essential libxdo-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Apply runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lib = Path("crates/golamd/src/lib.rs")
          text = lib.read_text()
          old = "pub mod acp_adapter;\npub mod local_fs;"
          new = "pub mod acp_adapter;\npub mod desktop_observation;\npub mod local_fs;"
          if text.count(old) != 1:
              raise SystemExit("golamd module insertion point changed")
          lib.write_text(text.replace(old, new, 1))

          test = Path("crates/golamd/tests/desktop_observation_adapter.rs")
          text = test.read_text()
          old_module = "#[path = \"../src/desktop_observation.rs\"]\npub mod desktop_observation;\n\nuse desktop_observation::{NativeObservationRequest, observe_native_desktop};\n"
          if text.count(old_module) != 1:
              raise SystemExit("observation integration-test module block changed")
          text = text.replace(old_module, "", 1)
          anchor = "use golam_core::tool_request::{BindingDigest, ToolRequestId};\n"
          import_line = "use golamd::desktop_observation::{self, NativeObservationRequest, observe_native_desktop};\n"
          if text.count(anchor) != 1:
              raise SystemExit("observation integration-test import anchor changed")
          test.write_text(text.replace(anchor, anchor + import_line, 1))
          PY

      - name: Verify exact product diff
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' crates/golamd/src/lib.rs crates/golamd/tests/desktop_observation_adapter.rs | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "unexpected product diff" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "${expected}" "${actual}" >&2
            exit 1
          fi
          grep -q '^pub mod desktop_observation;$' crates/golamd/src/lib.rs
          grep -q 'golamd::desktop_observation' crates/golamd/tests/desktop_observation_adapter.rs
          if grep -q '^#\[path = "../src/desktop_observation.rs"\]' crates/golamd/tests/desktop_observation_adapter.rs; then
            echo "integration test still compiles a path-local implementation copy" >&2
            exit 1
          fi

      - name: Qualify runtime wiring
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golamd --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golamd --test desktop_observation_adapter
          echo 'PHASE_D_RUNTIME_MODULE_WIRING_LINUX_QUALIFIED=YES'

      - name: Commit exact qualified product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golamd/src/lib.rs crates/golamd/tests/desktop_observation_adapter.rs
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' crates/golamd/src/lib.rs crates/golamd/tests/desktop_observation_adapter.rs | sort)"
          if [[ "${staged}" != "${expected}" ]]; then
            echo "unexpected staged product diff" >&2
            exit 1
          fi
          git commit -m 'fix(006): wire native observation into golamd runtime'

          git fetch origin impl/006-desktop-computer-control
          remote_head="$(git rev-parse origin/impl/006-desktop-computer-control)"
          parent="$(git rev-parse HEAD^)"
          if [[ "${remote_head}" != "${parent}" ]]; then
            echo "branch moved during qualification: remote=${remote_head} parent=${parent}" >&2
            exit 1
          fi
          git push origin HEAD:impl/006-desktop-computer-control
