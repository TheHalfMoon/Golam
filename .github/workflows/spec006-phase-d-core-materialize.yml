name: spec006-phase-d-core-materialize

on:
  push:
    branches: [impl/006-desktop-computer-control]
    paths:
      - .github/workflows/spec006-phase-d-core-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/006-desktop-computer-control
          fetch-depth: 3

      - name: Guard exact product base and helper-only chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "773f79cbbe58d9784e4a1b43351fca4b91d275c3"
          test "$(git diff --name-only 773f79cbbe58d9784e4a1b43351fca4b91d275c3 HEAD)" = ".github/workflows/spec006-phase-d-core-materialize.yml"
          echo 'PHASE_D_CORE_EXPECTED_PRODUCT_BASE=YES'

      - name: Apply bounded observation and focus readback hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          control = Path('crates/golam-core/src/desktop_control.rs')
          text = control.read_text()

          replacements = [
              (
                  '    pub max_semantic_nodes: u32,\n    pub max_string_bytes: u32,\n',
                  '    pub max_semantic_nodes: u32,\n    pub max_semantic_depth: u16,\n    pub max_string_bytes: u32,\n    pub max_observation_duration_ms: u64,\n',
              ),
              (
                  '            max_semantic_nodes: 2_048,\n            max_string_bytes: 16 * 1024,\n',
                  '            max_semantic_nodes: 2_048,\n            max_semantic_depth: 32,\n            max_string_bytes: 16 * 1024,\n            max_observation_duration_ms: 5_000,\n',
              ),
              (
                  '            || self.max_semantic_nodes > 65_536\n            || self.max_string_bytes == 0\n',
                  '            || self.max_semantic_nodes > 65_536\n            || self.max_semantic_depth == 0\n            || self.max_semantic_depth > 256\n            || self.max_string_bytes == 0\n',
              ),
              (
                  '            || self.max_string_bytes > 1024 * 1024\n            || self.max_capture_width == 0\n',
                  '            || self.max_string_bytes > 1024 * 1024\n            || self.max_observation_duration_ms == 0\n            || self.max_observation_duration_ms > 30_000\n            || self.max_capture_width == 0\n',
              ),
              (
                  '        encoder.push_u64(u64::from(self.max_semantic_nodes));\n        encoder.push_u64(u64::from(self.max_string_bytes));\n',
                  '        encoder.push_u64(u64::from(self.max_semantic_nodes));\n        encoder.push_u16(self.max_semantic_depth);\n        encoder.push_u64(u64::from(self.max_string_bytes));\n        encoder.push_u64(self.max_observation_duration_ms);\n',
              ),
              (
                  '    fn work_surface_identity_changes_when_incarnation_changes() {\n',
                  '    fn semantic_observation_limits_are_explicit_and_bounded() {\n        let limits = DesktopLimits {\n            max_semantic_depth: 0,\n            ..DesktopLimits::default()\n        };\n        assert_eq!(limits.validate(), Err(DesktopControlError::InvalidLimits));\n\n        let limits = DesktopLimits {\n            max_semantic_depth: 257,\n            ..DesktopLimits::default()\n        };\n        assert_eq!(limits.validate(), Err(DesktopControlError::InvalidLimits));\n\n        let limits = DesktopLimits {\n            max_observation_duration_ms: 0,\n            ..DesktopLimits::default()\n        };\n        assert_eq!(limits.validate(), Err(DesktopControlError::InvalidLimits));\n\n        let limits = DesktopLimits {\n            max_observation_duration_ms: 30_001,\n            ..DesktopLimits::default()\n        };\n        assert_eq!(limits.validate(), Err(DesktopControlError::InvalidLimits));\n    }\n\n    #[test]\n    fn work_surface_identity_changes_when_incarnation_changes() {\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'CONTROL_REPLACEMENT_COUNT={text.count(old)} expected=1 snippet={old!r}')
              text = text.replace(old, new, 1)
          control.write_text(text)

          dispatch = Path('crates/golam-kernel/src/desktop_dispatch.rs')
          text = dispatch.read_text()
          old = '        let receipt = match input.backend.dispatch_action(validated) {\n'
          new = '        let mut receipt = match input.backend.dispatch_action(validated) {\n'
          if text.count(old) != 1:
              raise SystemExit(f'DISPATCH_MUTABLE_RECEIPT_COUNT={text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = '''        let receipt_bytes = action_receipt_bytes(&receipt)?;\n        let completion = classify_action_receipt(input.prepared, &receipt);\n'''
          hardened = '''        if input.prepared.intent().operation_kind == DesktopActionKind::Focus\n            && receipt.status == DesktopBackendTerminalStatus::Committed\n        {\n            receipt.post_observation_digest = match input.backend.observe(input.observation_limits) {\n                Ok(post_observation)\n                    if post_observation.capability_session_evidence\n                        == input\n                            .prepared\n                            .intent()\n                            .prepared_permission_session_evidence_ref\n                        && post_observation.focused_surface_digest\n                            == Some(input.prepared.intent().exact_target_identity_digest) =>\n                {\n                    post_observation.binding_digest().ok()\n                }\n                Ok(_) | Err(_) => None,\n            };\n        }\n\n        let receipt_bytes = action_receipt_bytes(&receipt)?;\n        let completion = classify_action_receipt(input.prepared, &receipt);\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'DISPATCH_READBACK_ANCHOR_COUNT={text.count(anchor)}')
          text = text.replace(anchor, hardened, 1)
          dispatch.write_text(text)
          PY

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Format and qualify core hardening
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 clippy --locked -p golam-core -p golam-kernel --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golam-core -p golam-kernel --all-targets

      - name: Prove bounded diff and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/spec006-phase-d-core-materialize.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/spec006-phase-d-core-materialize.yml',
              'crates/golam-core/src/desktop_control.rs',
              'crates/golam-kernel/src/desktop_dispatch.rs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'PHASE_D_CORE_DIFF_MISMATCH={sorted(changed)}')
          print('PHASE_D_CORE_DIFF_BOUNDED=YES')
          PY

      - name: Commit qualified Phase D core hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/spec006-phase-d-core-materialize.yml crates/golam-core/src/desktop_control.rs crates/golam-kernel/src/desktop_dispatch.rs
          git commit -m 'feat(006): harden semantic bounds and focus readback'
          git push origin HEAD:impl/006-desktop-computer-control
