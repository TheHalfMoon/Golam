name: t003-062-effective-destination
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Implement effective destination reauthorization boundary
        shell: python
        run: |
          import base64
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: replacement count {count} for {old!r}")
              path.write_text(text.replace(old, new, 1))

          Path('crates/golam-ledger/src/egress_destination.rs').write_text(
              base64.b64decode(''+' ').decode()
          )

          lib = Path('crates/golam-ledger/src/lib.rs')
          replace_once(
              lib,
              'pub mod egress_permit;\n',
              'pub mod egress_destination;\npub mod egress_permit;\n',
          )

          egress = Path('crates/golam-ledger/src/egress_permit.rs')
          replace_once(
              egress,
              'use crate::storage::{AuthorityStore, StorageError};\n',
              'use crate::egress_destination::EffectiveDestination;\nuse crate::storage::{AuthorityStore, StorageError};\n',
          )

          method = base64.b64decode('').decode()
          replace_once(
              egress,
              '        Ok(EgressPermitUseReceipt {\n            permit_id,\n            decision_id,\n            uses_consumed: new_uses,\n            status: new_status.to_owned(),\n        })\n    }\n}\n\nstruct AuthorityEvidence',
              '        Ok(EgressPermitUseReceipt {\n            permit_id,\n            decision_id,\n            uses_consumed: new_uses,\n            status: new_status.to_owned(),\n        })\n    }\n' + method + '}\n\nstruct AuthorityEvidence',
          )

          helper = base64.b64decode('').decode()
          replace_once(
              egress,
              'fn verify_active_policy(\n',
              helper + 'fn verify_active_policy(\n',
          )

          replace_once(
              egress,
              '        let transaction = connection\n            .transaction_with_behavior(TransactionBehavior::Immediate)\n            .unwrap();\n        transaction\n            .execute(\n                "INSERT INTO policy_bundles',
              '        let transaction = connection\n            .transaction_with_behavior(TransactionBehavior::Immediate)\n            .unwrap();\n        let resources_scope = format!("{DESTINATION}\\nhttps://203.0.113.10:443\\nhttps://203.0.113.11:443\\nhttps://10.0.0.7:443");\n        transaction\n            .execute(\n                "INSERT INTO policy_bundles',
          )
          replace_once(
              egress,
              'params![&LEASE_ID[..], PRINCIPAL, ACTION.as_bytes(), DESTINATION.as_bytes(), &LEASE_DIGEST[..]],',
              'params![&LEASE_ID[..], PRINCIPAL, ACTION.as_bytes(), resources_scope.as_bytes(), &LEASE_DIGEST[..]],',
          )

          test_helper = base64.b64decode('').decode()
          replace_once(
              egress,
              '    fn prepared(limit: Option<u64>) -> PreparedEgressPermitIssue {',
              test_helper + '    fn prepared(limit: Option<u64>) -> PreparedEgressPermitIssue {',
          )

          test = base64.b64decode('').decode()
          replace_once(
              egress,
              '    #[test]\n    fn bounded_use_limit_exhausts_without_scope_widening() {',
              test + '    #[test]\n    fn bounded_use_limit_exhausts_without_scope_widening() {',
          )
      - name: Format and run focused T003-062 qualification
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p golam-ledger egress_destination::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger egress_permit::tests::effective_destination_changes_require_exact_current_reauthorization -- --nocapture
          cargo +1.98.0 test -p golam-ledger egress_permit::tests:: -- --nocapture
          cargo +1.98.0 clippy -p golam-ledger --all-targets -- -D warnings
      - name: Commit clean T003-062 implementation
        run: |
          git rm .github/workflows/t003-062-effective-destination.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/lib.rs
          git add crates/golam-ledger/src/egress_destination.rs
          git add crates/golam-ledger/src/egress_permit.rs
          git commit -m 'feat: enforce effective destination reauthorization'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
