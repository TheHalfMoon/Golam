name: t003-062-effective-destination
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Expose bounded crate-internal egress authority helpers
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/golam-ledger/src/egress_permit.rs')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement count {count} for {old!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'pub struct EgressPermitStore {\n    connection: Connection,\n}',
              'pub struct EgressPermitStore {\n    pub(crate) connection: Connection,\n}',
          )
          replace_once(
              'struct UseDecisionEvidence {\n    lease_generation: u64,\n    policy_bundle_id: [u8; 16],\n    policy_bundle_hash: [u8; 32],\n}',
              'pub(crate) struct UseDecisionEvidence {\n    pub(crate) lease_generation: u64,\n    pub(crate) policy_bundle_id: [u8; 16],\n    pub(crate) policy_bundle_hash: [u8; 32],\n}',
          )
          replace_once('fn verify_lease_chain_for_use(', 'pub(crate) fn verify_lease_chain_for_use(')
          replace_once('fn load_permit(', 'pub(crate) fn load_permit(')
          replace_once('fn verify_active_policy(', 'pub(crate) fn verify_active_policy(')
          replace_once('fn latest_global_seq(', 'pub(crate) fn latest_global_seq(')
          replace_once('#[cfg(test)]\nmod tests {', '#[cfg(test)]\npub(crate) mod tests {')
          replace_once('    const PRINCIPAL: &str = "owner:owner";', '    pub(crate) const PRINCIPAL: &str = "owner:owner";')
          replace_once('    const ACTION: &str = "network.egress.connect";', '    pub(crate) const ACTION: &str = "network.egress.connect";')
          replace_once('    const PURPOSE: &str = "fixture-fetch";', '    pub(crate) const PURPOSE: &str = "fixture-fetch";')
          replace_once('    const POLICY_ID: [u8; 16] = [31; 16];', '    pub(crate) const POLICY_ID: [u8; 16] = [31; 16];')
          replace_once('    const POLICY_HASH: [u8; 32] = [32; 32];', '    pub(crate) const POLICY_HASH: [u8; 32] = [32; 32];')
          replace_once('    const LEASE_ID: [u8; 16] = [41; 16];', '    pub(crate) const LEASE_ID: [u8; 16] = [41; 16];')
          replace_once('    fn authority() -> (RuntimeLayout, AuthorityLayout) {', '    pub(crate) fn authority() -> (RuntimeLayout, AuthorityLayout) {')
          replace_once('    fn install_policy_and_parent_lease(connection: &mut Connection) {', '    pub(crate) fn install_policy_and_parent_lease(connection: &mut Connection) {')
          replace_once(
              '        let transaction = connection\n            .transaction_with_behavior(TransactionBehavior::Immediate)\n            .unwrap();\n        transaction\n            .execute(\n                "INSERT INTO policy_bundles',
              '        let transaction = connection\n            .transaction_with_behavior(TransactionBehavior::Immediate)\n            .unwrap();\n        let resources_scope = format!("{DESTINATION}\\nhttps://203.0.113.10:443\\nhttps://203.0.113.11:443\\nhttps://10.0.0.7:443");\n        transaction\n            .execute(\n                "INSERT INTO policy_bundles',
          )
          replace_once(
              'params![&LEASE_ID[..], PRINCIPAL, ACTION.as_bytes(), DESTINATION.as_bytes(), &LEASE_DIGEST[..]],',
              'params![&LEASE_ID[..], PRINCIPAL, ACTION.as_bytes(), resources_scope.as_bytes(), &LEASE_DIGEST[..]],',
          )
          replace_once(
              '    struct WorkIds {\n        effect: EffectId,\n        decision: [u8; 16],\n        approval: [u8; 16],\n    }',
              '    pub(crate) struct WorkIds {\n        pub(crate) effect: EffectId,\n        pub(crate) decision: [u8; 16],\n        pub(crate) approval: [u8; 16],\n    }',
          )
          replace_once('    fn install_mutation_work(', '    pub(crate) fn install_mutation_work(')
          replace_once('    fn prepared(limit: Option<u64>) -> PreparedEgressPermitIssue {', '    pub(crate) fn prepared(limit: Option<u64>) -> PreparedEgressPermitIssue {')
          path.write_text(text)

          effective_path = Path('crates/golam-ledger/src/egress_effective_use.rs')
          effective_text = effective_path.read_text()
          count = effective_text.count('.connection_mut()')
          if count != 2:
              raise SystemExit(f'expected 2 connection_mut calls, found {count}')
          effective_path.write_text(effective_text.replace('.connection_mut()', '.connection'))
      - name: Format and run focused T003-062 qualification
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p golam-ledger egress_destination::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger egress_effective_use::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger egress_permit::tests:: -- --nocapture
          cargo +1.98.0 clippy -p golam-ledger --all-targets -- -D warnings
      - name: Commit clean T003-062 implementation
        run: |
          git rm .github/workflows/t003-062-effective-destination.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/lib.rs
          git add crates/golam-ledger/src/egress_destination.rs
          git add crates/golam-ledger/src/egress_effective_use.rs
          git add crates/golam-ledger/src/egress_permit.rs
          git commit -m 'feat: enforce effective destination reauthorization'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
