name: t003-060-record-qualification
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Advance T003-060 ledger to T003-061
        shell: python
        run: |
          from pathlib import Path

          tasks_path = Path('specs/003-identity-policy-secrets-sandbox/tasks.md')
          tasks = tasks_path.read_text()
          replacements = {
              '- [ ] **T003-060** Keep strict-local external egress as an unconditional hard guard before policy/permit evaluation.': '- [x] **T003-060** Keep strict-local external egress as an unconditional hard guard before policy/permit evaluation. Exact-head qualification: CI #502 (`33196075286`) SUCCESS at `50941a6d68a7920aca3666eb786f05d8b2c145b2` on Windows/macOS/Ubuntu. Evidence: `implementation/strict-local-hard-guard-qualification.md`.',
              'T003_057_CI_RUN=33195054055\nCEDAR_POLICY_ADMITTED_EXACT=4.12.0': 'T003_057_CI_RUN=33195054055\nT003_060=PASS\nT003_060_QUALIFIED_HEAD=50941a6d68a7920aca3666eb786f05d8b2c145b2\nT003_060_CI_RUN=33196075286\nCEDAR_POLICY_ADMITTED_EXACT=4.12.0',
              'NEXT_TASK=T003-060': 'NEXT_TASK=T003-061',
          }
          for old, new in replacements.items():
              if tasks.count(old) != 1:
                  raise SystemExit(f'tasks replacement count for {old!r}: {tasks.count(old)}')
              tasks = tasks.replace(old, new, 1)
          tasks_path.write_text(tasks)

          plan_path = Path('specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md')
          plan = plan_path.read_text()
          replacements = {
              '**Current task**: `T003-060`': '**Current task**: `T003-061`',
              'Phase F is closed at the task-qualified head above. Phase G is active at T003-060.': 'Phase F is closed at the task-qualified head above. Phase G is active at T003-061.',
              '## Later phases\n\n- Phase G: T003-060..T003-064, strict-local hard denial remains dominant.': '## Phase G — Egress permits\n\n`ACTIVE`\n\n### T003-060 — COMPLETE\n\nQualified at exact implementation head `50941a6d68a7920aca3666eb786f05d8b2c145b2` by CI #502 / run `33196075286`, SUCCESS on Windows/macOS/Ubuntu.\n\nEvidence: `implementation/strict-local-hard-guard-qualification.md`.\n\nThe qualified regression proves strict-local external egress denies before downstream policy/permit evaluation, produces no grant, and records no policy evidence because the downstream permit-like policy is never invoked.\n\n### T003-061 — ACTIVE\n\nImplement non-strict `EgressPermit` scope plus protected issuance, revocation, and bounded use accounting while preserving T003-060 hard-guard dominance.\n\n## Later phases\n\n- Remaining Phase G: T003-061..T003-064, strict-local hard denial remains dominant.',
              'T003_057_CI_RUN=33195054055\nNEXT_TASK=T003-060': 'T003_057_CI_RUN=33195054055\nT003_060=PASS\nT003_060_QUALIFIED_HEAD=50941a6d68a7920aca3666eb786f05d8b2c145b2\nT003_060_CI_RUN=33196075286\nNEXT_TASK=T003-061',
          }
          for old, new in replacements.items():
              if plan.count(old) != 1:
                  raise SystemExit(f'plan replacement count for {old!r}: {plan.count(old)}')
              plan = plan.replace(old, new, 1)
          plan_path.write_text(plan)
      - name: Commit qualification record
        run: |
          git rm .github/workflows/t003-060-record-qualification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/003-identity-policy-secrets-sandbox/tasks.md
          git add specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md
          git commit -m 'docs: activate T003-061 egress permit implementation'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
