name: t003-074-linux-executor-probe
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  probe:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install Ubuntu bubblewrap executor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
          /usr/bin/setpriv --version
      - name: Build fixed x86_64 seccomp network-deny filter
        shell: python
        run: |
          import struct
          from pathlib import Path

          BPF_LD_W_ABS = 0x20
          BPF_JMP_JEQ_K = 0x15
          BPF_RET_K = 0x06
          AUDIT_ARCH_X86_64 = 0xC000003E
          SECCOMP_RET_KILL_PROCESS = 0x80000000
          SECCOMP_RET_ERRNO_EPERM = 0x00050001
          SECCOMP_RET_ALLOW = 0x7FFF0000
          blocked = [41, 42, 43, 49, 50, 53, 288]
          insns = [
              (BPF_LD_W_ABS, 0, 0, 4),
              (BPF_JMP_JEQ_K, 1, 0, AUDIT_ARCH_X86_64),
              (BPF_RET_K, 0, 0, SECCOMP_RET_KILL_PROCESS),
              (BPF_LD_W_ABS, 0, 0, 0),
          ]
          for syscall in blocked:
              insns.append((BPF_JMP_JEQ_K, 0, 1, syscall))
              insns.append((BPF_RET_K, 0, 0, SECCOMP_RET_ERRNO_EPERM))
          insns.append((BPF_RET_K, 0, 0, SECCOMP_RET_ALLOW))
          Path('/tmp/golam-network-deny.bpf').write_bytes(
              b''.join(struct.pack('<HBBI', *insn) for insn in insns)
          )
          print(f'SECCOMP_FILTER_INSTRUCTIONS={len(insns)}')
      - name: Prove bounded Linux qualification primitive
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$RUNNER_TEMP/golam-t003-074-forbidden"
          printf 'host-only\n' > "$forbidden"
          export GOLAM_AMBIENT_SECRET='must-not-cross-boundary'
          exec 3</tmp/golam-network-deny.bpf
          sudo -C 4 --preserve-env=GOLAM_AMBIENT_SECRET bwrap \
            --unshare-all \
            --share-net \
            --die-with-parent \
            --new-session \
            --clearenv \
            --ro-bind /usr /usr \
            --ro-bind /bin /bin \
            --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            --tmpfs /tmp \
            --seccomp 3 \
            --chdir /tmp \
            /usr/bin/setpriv \
              --reuid=65534 \
              --regid=65534 \
              --clear-groups \
              --bounding-set=-all \
              --inh-caps=-all \
              --ambient-caps=-all \
              --no-new-privs \
              /bin/bash -ceu '
                test "$(id -u)" = 65534
                test "$(id -g)" = 65534
                test -z "${GOLAM_AMBIENT_SECRET+x}"
                test ! -e "$1"
                test -z "$(/usr/bin/setpriv --dump | sed -n "s/^Bounding set: //p" | tr -d " ")"
                /bin/bash -c "exit 0"
                if /usr/bin/timeout 2 /bin/bash -c "exec 4<>/dev/tcp/1.1.1.1/53" 2>/dev/null; then
                  echo "external network unexpectedly succeeded" >&2
                  exit 32
                fi
              ' golam-probe "$forbidden"
          echo 'BWRAP_EXECUTOR_PROBE=PASS'
          echo 'QUALIFICATION_LAUNCHER_PRIVILEGED=YES'
          echo 'PAYLOAD_UID_GID_UNPRIVILEGED=YES'
          echo 'ENVIRONMENT_CLEARED=YES'
          echo 'FORBIDDEN_HOST_FS_VISIBLE=NO'
          echo 'NETWORK_SOCKET_SYSCALL_DENIED=YES'
          echo 'PAYLOAD_CAPABILITIES_DROPPED=YES'
          echo 'MANAGED_DESCENDANT_EXECUTED=YES'
      - name: Record bounded executor research
        shell: python
        run: |
          from pathlib import Path
          evidence = Path('specs/003-identity-policy-secrets-sandbox/implementation/t003-074-linux-executor-research.md')
          if evidence.exists():
              raise SystemExit('T003-074 Linux executor research already exists')
          lines = [
              '# T003-074 Linux Executor Primitive Research',
              '',
              '## Disposition',
              '',
              'Ubuntu-hosted qualification proved a privileged setup / unprivileged payload Bubblewrap plus seccomp primitive suitable only for the minimum native untrusted-process test executor required by T003-074.',
              '',
              'Unprivileged Bubblewrap namespace setup is not supported by the GitHub-hosted runner (`RTM_NEWADDR: Operation not permitted` and `setting up uid map: Permission denied`). The qualified test primitive therefore uses the runner trust boundary only to create namespaces and install the seccomp filter, then executes the payload as uid/gid 65534 with an empty capability set and `no_new_privs`.',
              '',
              'The network namespace is deliberately shared because hosted-runner network-namespace setup is unavailable; a fixed x86_64 seccomp filter returns EPERM for socket/connect/listen/bind/accept/socketpair syscalls before payload execution.',
              '',
              'This record does not admit Bubblewrap or sudo as a product sandbox dependency, does not claim macOS/Windows parity, and does not alter the production `native:unqualified` capability baseline.',
              '',
              '## Qualified primitive properties',
              '',
              '- Bubblewrap and setpriv versions are captured in the run log.',
              '- Namespace/mount/seccomp setup occurs in the trusted qualification launcher.',
              '- The child payload runs as uid/gid 65534 with cleared environment, empty capability sets, and `no_new_privs`.',
              '- A host-only forbidden file outside explicit read-only runtime mounts is not visible.',
              '- Socket creation is denied before payload use despite sharing the host network namespace.',
              '- A descendant process executes within the managed PID/session boundary and the parent-death boundary remains active.',
              '',
              '## Boundaries',
              '',
              '- Linux x86_64 qualification only; this is not a product executor admission.',
              '- macOS, Windows, non-x86_64 Linux, external-network profiles, arbitrary requester executable paths, and universal native isolation remain unsupported.',
              '- No network-capable Golam-managed native child was launched.',
              '',
              '```text',
              'T003_074_LINUX_PRIMITIVE_RESEARCH=PASS',
              'EXECUTOR_PRIMITIVE=PRIVILEGED_SETUP_BWRAP_SECCOMP_TEST_ONLY',
              'QUALIFICATION_LAUNCHER_PRIVILEGED=YES',
              'PAYLOAD_UID_GID_UNPRIVILEGED=YES',
              'ENVIRONMENT_CLEARED=YES',
              'FORBIDDEN_HOST_FS_VISIBLE=NO',
              'NETWORK_SOCKET_SYSCALL_DENIED=YES',
              'PAYLOAD_CAPABILITIES_DROPPED=YES',
              'MANAGED_DESCENDANT_EXECUTED=YES',
              'PRODUCTION_NATIVE_EXECUTOR_ADMITTED=NO',
              'MACOS_EXECUTOR_SUPPORTED=NO',
              'WINDOWS_EXECUTOR_SUPPORTED=NO',
              'UNIVERSAL_NATIVE_SANDBOX_CLAIMED=NO',
              'NETWORK_CAPABLE_MANAGED_CHILD_LAUNCHED=NO',
              '```',
          ]
          evidence.write_text('\n'.join(lines) + '\n')
      - name: Commit research and self-delete
        run: |
          git rm .github/workflows/t003-074-linux-executor-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/003-identity-policy-secrets-sandbox/implementation/t003-074-linux-executor-research.md
          git commit -m 'docs: qualify T003-074 Linux executor primitive'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox