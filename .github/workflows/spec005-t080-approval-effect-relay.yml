name: spec005-t080-approval-effect-relay

on:
  push:
    branches:
      - impl/005-local-tools-context-memory
    paths:
      - .github/workflows/spec005-t080-approval-effect-relay.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Repair approval issuance effect lifecycle
        shell: bash
        run: |
          set -euo pipefail
