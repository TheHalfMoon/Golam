        authorized_transition_id: EffectTransitionId,
        authorization_scope: &str,
    ) -> Result<(), CapabilityLeaseEffectError> {
        let approval_scope = ApprovalScope::once(
            lease_issue_effect_id,
            CAPABILITY_LEASE_ISSUE_ACTION,
