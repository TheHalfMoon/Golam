name: spec005-h-acp-relay

on:
  push:
    branches:
      - impl/005-local-tools-context-memory
    paths:
      - .github/workflows/spec005-h-acp-relay.yml

permissions:
  contents: write

jobs:
  qualify-and-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Wire authenticated ACP boundary and qualify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lifecycle = Path('crates/golam-ipc/src/lifecycle.rs')
          text = lifecycle.read_text()
          enum_anchor = '#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub enum ShutdownReason {'
          token = (
              '#[derive(Clone, Copy, Debug, Eq, PartialEq)]\n'
              'pub struct AuthenticatedLocalClient {\n'
              '    client_id: ClientId,\n'
              '    connection_id: ConnectionId,\n'
              '    server_epoch: u64,\n'
              '    limits: ResourceLimits,\n'
              '}\n\n'
              'impl AuthenticatedLocalClient {\n'
              '    pub const fn client_id(self) -> ClientId {\n'
              '        self.client_id\n'
              '    }\n\n'
              '    pub const fn connection_id(self) -> ConnectionId {\n'
              '        self.connection_id\n'
              '    }\n\n'
              '    pub const fn server_epoch(self) -> u64 {\n'
              '        self.server_epoch\n'
              '    }\n\n'
              '    pub const fn limits(self) -> ResourceLimits {\n'
              '        self.limits\n'
              '    }\n'
              '}\n\n'
          )
          if text.count(enum_anchor) != 1:
              raise SystemExit('expected exact ShutdownReason anchor')
          if 'pub struct AuthenticatedLocalClient' in text:
              raise SystemExit('authenticated local client token already exists')
          text = text.replace(enum_anchor, token + enum_anchor, 1)
          method_anchor = (
              '    pub const fn authenticated_client(&self) -> Option<ClientId> {\n'
              '        self.authenticated_client\n'
              '    }\n'
          )
          method = method_anchor + (
              '\n'
              '    pub fn authenticated_local_client(&self) -> Option<AuthenticatedLocalClient> {\n'
              '        if self.phase != LifecyclePhase::Ready {\n'
              '            return None;\n'
              '        }\n'
              '        let client_id = self.authenticated_client?;\n'
              '        Some(AuthenticatedLocalClient {\n'
              '            client_id,\n'
              '            connection_id: self.connection_id,\n'
              '            server_epoch: self.server_epoch,\n'
              '            limits: self.limits,\n'
              '        })\n'
              '    }\n'
          )
          if text.count(method_anchor) != 1:
              raise SystemExit('expected exact authenticated_client anchor')
          text = text.replace(method_anchor, method, 1)
          lifecycle.write_text(text)
          lib = Path('crates/golamd/src/lib.rs')
          lib_text = lib.read_text()
          lib_anchor = 'pub mod local_fs;\n'
          if lib_text.count(lib_anchor) != 1:
              raise SystemExit('expected exact local_fs module anchor')
          if 'pub mod acp_adapter;' in lib_text:
              raise SystemExit('ACP adapter already wired')
          lib.write_text(lib_text.replace(lib_anchor, 'pub mod acp_adapter;\n' + lib_anchor, 1))
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golam-ipc -p golamd --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golam-ipc lifecycle::tests::
          cargo +1.98.0 test --locked -p golamd acp_adapter::
          cargo +1.98.0 test --locked -p golam-ipc --lib
          cargo +1.98.0 test --locked -p golamd --lib
      - name: Commit exact qualified T005-093 unit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin impl/005-local-tools-context-memory
          test "$(git rev-parse origin/impl/005-local-tools-context-memory)" = "$GITHUB_SHA"
          git rm .github/workflows/spec005-h-acp-relay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ipc/src/lifecycle.rs crates/golamd/src/acp_adapter.rs crates/golamd/src/lib.rs
          git commit -m 'feat(005): preserve authenticated ACP client boundary'
          git push origin HEAD:impl/005-local-tools-context-memory
