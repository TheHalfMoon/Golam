name: t003-080-runtime-policy-qualification

on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Apply T003-080 runtime policy candidate
        run: python3 scripts/qualification/prepare-t003-080.py
      - name: Format
        run: cargo +1.98.0 fmt --all
      - name: Run focused T003-080 qualification
        run: |
          cargo +1.98.0 test -p golam-ledger active_policy_integrity::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-kernel runtime_policy::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-kernel authorization::tests:: -- --nocapture
          cargo +1.98.0 test -p golamd -- --nocapture
          cargo +1.98.0 clippy -p golam-ledger -p golam-kernel -p golamd --all-targets -- -D warnings
      - name: Commit clean T003-080 implementation candidate
        run: |
          git rm .github/workflows/t003-080-runtime-policy-qualification.yml
          git rm scripts/qualification/prepare-t003-080.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/active_policy_integrity.rs
          git add crates/golam-kernel/src/runtime_policy.rs
          git add crates/golam-kernel/src/lib.rs
          git add crates/golam-kernel/src/authorization.rs
          git add crates/golamd/src/main.rs
          git add crates/golamd/src/connection.rs
          git commit -m 'feat: activate Cedar policy in normal authority path'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
