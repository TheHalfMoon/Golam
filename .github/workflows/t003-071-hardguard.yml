name: t003-071-hardguard
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Wire compiler and bind locality outside request
        shell: python
        run: |
          from pathlib import Path

          def ensure_replace(path, old, new, label):
              text = path.read_text()
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{label}: old replacement count {text.count(old)}')
                  path.write_text(text.replace(old, new, 1))
                  return
              if new not in text:
                  raise SystemExit(f'{label}: neither old nor new form present')

          lib = Path('crates/golam-ledger/src/lib.rs')
          ensure_replace(
              lib,
              'pub mod sandbox_profile;\n',
              'pub mod sandbox_plan;\npub mod sandbox_profile;\n',
              'sandbox plan module export',
          )

          profile = Path('crates/golam-ledger/src/sandbox_profile.rs')
          ensure_replace(
              profile,
              'fn load_profile(\n    connection: &Connection,',
              'pub(crate) fn load_profile(\n    connection: &Connection,',
              'transactional profile reader visibility',
          )

          plan = Path('crates/golam-ledger/src/sandbox_plan.rs')
          ensure_replace(
              plan,
              'pub const SANDBOX_LAUNCH_ACTION: &str = "sandbox.launch";\n\nconst PLAN_DOMAIN:',
              '''pub const SANDBOX_LAUNCH_ACTION: &str = "sandbox.launch";\n\n#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub enum SandboxLocality {\n    StrictLocal,\n    NonStrict,\n}\n\nimpl SandboxLocality {\n    const fn code(self) -> u8 {\n        match self {\n            Self::StrictLocal => 1,\n            Self::NonStrict => 2,\n        }\n    }\n}\n\nconst PLAN_DOMAIN:''',
              'trusted locality enum',
          )
          ensure_replace(
              plan,
              '    pub observed_at: &\'a str,\n    pub strict_local: bool,\n}',
              '    pub observed_at: &\'a str,\n}',
              'remove caller locality',
          )
          ensure_replace(
              plan,
              '    pub egress: Option<SandboxEgressBinding>,\n    pub strict_local: bool,\n    pub observed_at: String,',
              '    pub egress: Option<SandboxEgressBinding>,\n    pub locality: SandboxLocality,\n    pub observed_at: String,',
              'plan locality evidence',
          )
          ensure_replace(
              plan,
              'pub struct SandboxPlanCompiler {\n    connection: Connection,\n}\n\nimpl SandboxPlanCompiler {\n    pub fn open(layout: &AuthorityLayout) -> Result<Self, SandboxPlanError> {',
              'pub struct SandboxPlanCompiler {\n    connection: Connection,\n    locality: SandboxLocality,\n}\n\nimpl SandboxPlanCompiler {\n    /// The trusted kernel boundary selects locality; plan requesters cannot downgrade it.\n    pub fn open(\n        layout: &AuthorityLayout,\n        locality: SandboxLocality,\n    ) -> Result<Self, SandboxPlanError> {',
              'compiler locality ownership',
          )
          ensure_replace(
              plan,
              '        Ok(Self { connection })\n',
              '        Ok(Self { connection, locality })\n',
              'compiler locality initialization',
          )
          ensure_replace(
              plan,
              '            request.observed_at,\n            request.strict_local,\n        )?;\n        let plan_hash = plan_hash(&profile, &request, &authority, egress.as_ref())?;',
              '            request.observed_at,\n            self.locality,\n        )?;\n        let plan_hash = plan_hash(&profile, &request, &authority, self.locality, egress.as_ref())?;',
              'compile trusted locality',
          )
          ensure_replace(
              plan,
              '            egress,\n            strict_local: request.strict_local,\n            observed_at:',
              '            egress,\n            locality: self.locality,\n            observed_at:',
              'plan locality field',
          )
          ensure_replace(
              plan,
              '    observed_at: &str,\n    strict_local: bool,\n) -> Result<Option<SandboxEgressBinding>, SandboxPlanError> {\n    if strict_local && profile.network_rule == SandboxNetworkRule::PermitRequired {',
              '    observed_at: &str,\n    locality: SandboxLocality,\n) -> Result<Option<SandboxEgressBinding>, SandboxPlanError> {\n    if locality == SandboxLocality::StrictLocal\n        && profile.network_rule == SandboxNetworkRule::PermitRequired\n    {',
              'trusted strict-local gate',
          )
          ensure_replace(
              plan,
              '    authority: &LaunchAuthority,\n    egress: Option<&SandboxEgressBinding>,',
              '    authority: &LaunchAuthority,\n    locality: SandboxLocality,\n    egress: Option<&SandboxEgressBinding>,',
              'plan hash locality argument',
          )
          ensure_replace(
              plan,
              '    encoder.push_bytes(&authority.policy_bundle_hash)?;\n    encoder.push_u8(u8::from(request.strict_local));\n    encoder.push_bytes(request.observed_at.as_bytes())?;',
              '    encoder.push_bytes(&authority.policy_bundle_hash)?;\n    encoder.push_u8(locality.code());\n    encoder.push_bytes(request.observed_at.as_bytes())?;',
              'plan hash trusted locality',
          )
          ensure_replace(
              plan,
              '    fn install_base_authority(authority: &AuthorityLayout) {\n        let mut connection = Connection::open(authority.authority_db_path()).unwrap();',
              '    fn install_base_authority(authority: &AuthorityLayout) {\n        let store = AuthorityStore::open(authority.authority_db_path()).unwrap();\n        drop(store);\n        let mut connection = Connection::open(authority.authority_db_path()).unwrap();',
              'test authority initialization',
          )

          text = plan.read_text()
          text = text.replace(
              'let mut compiler = SandboxPlanCompiler::open(&authority).unwrap();',
              'let mut compiler = SandboxPlanCompiler::open(&authority, SandboxLocality::NonStrict).unwrap();',
          )
          text = text.replace('            strict_local: false,\n', '')
          old = '''        let mut compiler = SandboxPlanCompiler::open(&authority, SandboxLocality::NonStrict).unwrap();\n\n        assert!(matches!(\n            compiler.compile(request(DECISION_ID)),\n            Err(SandboxPlanError::EgressPermitRequired)\n        ));\n        let mut strict = request(DECISION_ID);\n        strict.egress_permit_id = Some(PERMIT_ID);\n        strict.strict_local = true;\n        assert!(matches!(\n            compiler.compile(strict),\n            Err(SandboxPlanError::StrictLocalExternalEgressDenied)\n        ));\n        let mut permitted = request(DECISION_ID);'''
          new = '''        let mut compiler = SandboxPlanCompiler::open(&authority, SandboxLocality::NonStrict).unwrap();\n\n        assert!(matches!(\n            compiler.compile(request(DECISION_ID)),\n            Err(SandboxPlanError::EgressPermitRequired)\n        ));\n        let mut strict_compiler =\n            SandboxPlanCompiler::open(&authority, SandboxLocality::StrictLocal).unwrap();\n        let mut strict = request(DECISION_ID);\n        strict.egress_permit_id = Some(PERMIT_ID);\n        assert!(matches!(\n            strict_compiler.compile(strict),\n            Err(SandboxPlanError::StrictLocalExternalEgressDenied)\n        ));\n        drop(strict_compiler);\n        let mut permitted = request(DECISION_ID);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('strict-local regression block did not match either form')
          plan.write_text(text)
      - name: Focused hardened T003-071 qualification
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p golam-ledger sandbox_plan::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger sandbox_profile::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger egress_effective_use::tests:: -- --nocapture
          cargo +1.98.0 clippy -p golam-ledger --all-targets -- -D warnings
      - name: Commit clean hardened T003-071 implementation
        run: |
          git rm -f .github/workflows/t003-071-hardguard.yml
          if [ -f .github/workflows/t003-071-sandbox-plan.yml ]; then git rm -f .github/workflows/t003-071-sandbox-plan.yml; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/lib.rs
          git add crates/golam-ledger/src/sandbox_profile.rs
          git add crates/golam-ledger/src/sandbox_plan.rs
          git commit -m 'feat: compile trusted-locality sandbox launch plans'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
