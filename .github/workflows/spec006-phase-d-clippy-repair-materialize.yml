name: spec006-phase-d-clippy-repair-materialize

on:
  push:
    branches: [impl/006-desktop-computer-control]
    paths:
      - .github/workflows/spec006-phase-d-clippy-repair-materialize.yml

permissions:
  contents: write

jobs:
  repair-native-observation-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/006-desktop-computer-control
          fetch-depth: 0

      - name: Bind exact helper-only chain
        shell: bash
        run: |
          set -euo pipefail
          BASE=8c8e7bce31807cf2ec53d08b637e11634f13379e
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/spec006-phase-d-clippy-repair-materialize.yml"
          test -z "$(git status --porcelain)"

      - name: Apply exact evidence-driven source corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/golamd/src/desktop_observation.rs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '            request.capability_session_evidence.bytes(),',
                  '            &request.capability_session_evidence.bytes(),',
                  1,
              ),
              (
                  '            parent_work_surface_digest.bytes(),',
                  '            &parent_work_surface_digest.bytes(),',
                  1,
              ),
              (
                  '    use xa11y_core::{App, Element, Provider};',
                  '    use xa11y_core::{App, Provider};',
                  1,
              ),
              (
                  '    use atspi::proxy::accessible::ObjectRefExt;\n    use golam_bounded_linux_async::{BoundedAsyncError, run_bounded};',
                  '    use golam_bounded_linux_async::{BoundedAsyncError, run_bounded};',
                  1,
              ),
              (
                  '.path_as_str().unwrap_or("/unknown")',
                  '.path_as_str()',
                  2,
              ),
              (
                  '        let mut limits = DesktopLimits::default();\n        limits.max_string_bytes = 4;',
                  '        let limits = DesktopLimits {\n            max_string_bytes: 4,\n            ..DesktopLimits::default()\n        };',
                  1,
              ),
              (
                  '        let mut limits = DesktopLimits::default();\n        limits.max_semantic_nodes = 1;',
                  '        let limits = DesktopLimits {\n            max_semantic_nodes: 1,\n            ..DesktopLimits::default()\n        };',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f'REPLACEMENT_COUNT_MISMATCH expected={expected} actual={actual} pattern={old!r}'
                  )
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/golamd/src/desktop_observation.rs"

      - name: Install Linux prerequisites and pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libpipewire-0.3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Qualify corrected adapter on Linux
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golamd --tests -- -D warnings
          cargo +1.98.0 test --locked -p golamd --test desktop_observation_adapter

      - name: Prove bounded diff, self-remove helper, and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t product_changed < <(git diff --name-only | sort)
          test "${#product_changed[@]}" -eq 1
          test "${product_changed[0]}" = "crates/golamd/src/desktop_observation.rs"

          rm .github/workflows/spec006-phase-d-clippy-repair-materialize.yml
          mapfile -t final_changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/spec006-phase-d-clippy-repair-materialize.yml
            crates/golamd/src/desktop_observation.rs
          )
          test "${#final_changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${final_changed[$i]}" = "${expected[$i]}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/spec006-phase-d-clippy-repair-materialize.yml \
            crates/golamd/src/desktop_observation.rs
          git commit -m "fix(006): correct native observation adapter compile errors"
          git push origin HEAD:impl/006-desktop-computer-control
