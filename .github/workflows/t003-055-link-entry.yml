name: t003-055-link-entry
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Link explicit entry and promote protected handle snapshot writer
        shell: python
        run: |
          from pathlib import Path

          lib = Path('crates/golam-ledger/src/lib.rs')
          s = lib.read_text()
          anchor = '''#[allow(dead_code)]\npub(crate) mod secret_fallback;\n#[allow(dead_code)]\nmod secret_vault;'''
          repl = '''#[allow(dead_code)]\npub(crate) mod secret_fallback;\n#[allow(dead_code)]\npub(crate) mod secret_entry;\n#[allow(dead_code)]\nmod secret_vault;'''
          if anchor not in s:
              raise SystemExit('lib module anchor missing')
          s = s.replace(anchor, repl, 1)
          s = s.replace('''    SessionForked,\n}''', '''    SessionForked,\n    SecretEntryRedacted,\n}''', 1)
          s = s.replace('''            Self::SessionForked => 6,\n''', '''            Self::SessionForked => 6,\n            Self::SecretEntryRedacted => 7,\n''', 1)
          s = s.replace('''            6 => Some(Self::SessionForked),\n            _ => None,''', '''            6 => Some(Self::SessionForked),\n            7 => Some(Self::SecretEntryRedacted),\n            _ => None,''', 1)
          lib.write_text(s)

          writer = Path('crates/golam-ledger/src/authority_security_write.rs')
          w = writer.read_text()
          w = w.replace('''    #[cfg(test)]\n    SecretHandle,\n''', '''    SecretHandle,\n''', 1)
          w = w.replace('''            #[cfg(test)]\n            Self::SecretHandle => "secret_handle",\n''', '''            Self::SecretHandle => "secret_handle",\n''', 1)
          w = w.replace('''#[cfg(test)]\npub(crate) fn append_secret_handle_snapshot(''', '''pub(crate) fn append_secret_handle_snapshot(''', 1)
          writer.write_text(w)

          mutation = Path('crates/golam-ledger/src/secret_mutation.rs')
          m = mutation.read_text()
          old = '''    #[cfg(test)]\n    fn create_with_protector<P: KeyProtector>('''
          new = '''    #[cfg(test)]\n    pub(crate) fn create_with_protector<P: KeyProtector>('''
          if old not in m:
              raise SystemExit('secret mutation test helper anchor missing')
          m = m.replace(old, new, 1)
          mutation.write_text(m)
      - name: Format and commit
        run: |
          cargo +1.98.0 fmt --all
          git rm .github/workflows/t003-055-link-entry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/lib.rs crates/golam-ledger/src/authority_security_write.rs crates/golam-ledger/src/secret_mutation.rs crates/golam-ledger/src/secret_entry.rs
          git commit -m 'feat: link protected designated secret entry path'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
