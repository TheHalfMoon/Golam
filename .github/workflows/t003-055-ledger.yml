name: t003-055-ledger

on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
    paths:
      - .github/workflows/t003-055-ledger.yml

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Advance T003-055 to T003-056
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tasks = Path('specs/003-identity-policy-secrets-sandbox/tasks.md')
          text = tasks.read_text()
          old = '- [ ] **T003-055** ACTIVE — Implement an explicit user-designated secret-entry boundary that treats the entire submitted value as secret independent of format detection; before any model-visible canonical append persist only an opaque handle, tombstone/redaction marker and non-secret metadata. Keep recognized-format detection only as defense in depth for ordinary free text.\n- [ ] **T003-056** Add canary tests covering both recognized and deliberately unknown-format deterministic values through the explicit secret-entry path, proving no plaintext in durable vault bytes, event/audit/log/error/prompt paths or unauthorized subprocess output; separately test free-text detectors as defense in depth.'
          new = '- [x] **T003-055** Implement an explicit user-designated secret-entry boundary that treats the entire submitted value as secret independent of format detection; before any model-visible canonical append persist only an opaque handle, tombstone/redaction marker and non-secret metadata. Keep recognized-format detection only as defense in depth for ordinary free text. Exact-head qualification: CI #473 (`33167705734`) SUCCESS at `b434da7c675fecf41d3f3aed2104559f959e8310` on Windows/macOS/Ubuntu. Evidence: `implementation/secret-entry-qualification.md`.\n- [ ] **T003-056** ACTIVE — Add canary tests covering both recognized and deliberately unknown-format deterministic values through the explicit secret-entry path, proving no plaintext in durable vault bytes, event/audit/log/error/prompt paths or unauthorized subprocess output; separately test free-text detectors as defense in depth.'
          if old not in text:
              raise SystemExit('tasks marker not found')
          text = text.replace(old, new, 1)
          gate = 'T003_054=PASS\nT003_054_QUALIFIED_HEAD=f2cef061f4a6847a2eedf7b867b8b94e4ccadd8f\nT003_054_CI_RUN=33166659638\nT003_055=ACTIVE\nNEXT_TASK=T003-055'
          gate_new = 'T003_054=PASS\nT003_054_QUALIFIED_HEAD=f2cef061f4a6847a2eedf7b867b8b94e4ccadd8f\nT003_054_CI_RUN=33166659638\nT003_055=PASS\nT003_055_QUALIFIED_HEAD=b434da7c675fecf41d3f3aed2104559f959e8310\nT003_055_CI_RUN=33167705734\nT003_056=ACTIVE\nNEXT_TASK=T003-056'
          if gate not in text:
              raise SystemExit('tasks gate marker not found')
          tasks.write_text(text.replace(gate, gate_new, 1))

          plan = Path('specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md')
          p = plan.read_text()
          p = p.replace('**Current task**: `T003-055`', '**Current task**: `T003-056`', 1)
          old_section = '''### T003-055 — ACTIVE

Implement the explicit user-designated secret-entry boundary.

Required boundaries:

- treat the complete submitted value as secret independent of syntax or detector recognition;
- raw submitted bytes may enter only the qualified protected vault mutation path and must never become canonical/model-visible plaintext;
- before any model-visible canonical append, persist only an opaque handle, tombstone/redaction marker and bounded non-secret metadata;
- recognized-format/free-text detection remains defense in depth and is not the source of the explicit-entry guarantee;
- keep generic plaintext/ciphertext reads unavailable and preserve exact protected-mutation authority requirements;
- use deterministic canaries only in tests.

After exact-head T003-055 qualification, continue directly to T003-056.
'''
          new_section = '''### T003-055 — COMPLETE

Qualified at exact implementation head `b434da7c675fecf41d3f3aed2104559f959e8310` by CI #473 / run `33167705734`, SUCCESS on Windows/macOS/Ubuntu.

Evidence: `implementation/secret-entry-qualification.md`.

The qualified boundary treats the entire explicit submitted value as secret without detector dependence, routes raw bytes only into protected vault mutation, creates an authenticated opaque `SecretHandle`, and emits only a dedicated redacted canonical projection with bounded non-secret metadata before model-visible history.

### T003-056 — ACTIVE

Add deterministic recognized- and unknown-format canary leakage qualification for the explicit secret-entry path.

Required boundaries:

- prove raw canaries are absent from durable vault bytes outside ciphertext, canonical event/audit/log/error/prompt paths, and unauthorized subprocess output;
- exercise both recognized and deliberately unknown-format deterministic values through the same explicit-entry guarantee;
- keep free-text detector tests separate and explicitly defense in depth rather than the source of secrecy;
- use deterministic canaries only and no real secrets;
- preserve the no-generic-plaintext-read boundary and existing protected mutation authority requirements.

After exact-head T003-056 qualification, continue directly to T003-057.
'''
          if old_section not in p:
              raise SystemExit('plan section marker not found')
          p = p.replace(old_section, new_section, 1)
          gate = 'T003_054=PASS\nT003_054_QUALIFIED_HEAD=f2cef061f4a6847a2eedf7b867b8b94e4ccadd8f\nT003_054_CI_RUN=33166659638\nT003_055=ACTIVE\nNEXT_TASK=T003-055'
          gate_new = 'T003_054=PASS\nT003_054_QUALIFIED_HEAD=f2cef061f4a6847a2eedf7b867b8b94e4ccadd8f\nT003_054_CI_RUN=33166659638\nT003_055=PASS\nT003_055_QUALIFIED_HEAD=b434da7c675fecf41d3f3aed2104559f959e8310\nT003_055_CI_RUN=33167705734\nT003_056=ACTIVE\nNEXT_TASK=T003-056'
          if gate not in p:
              raise SystemExit('plan gate marker not found')
          plan.write_text(p.replace(gate, gate_new, 1))

          Path('.github/workflows/t003-055-ledger.yml').unlink()
          PY
      - name: Commit ledger advance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: advance Spec 003 to T003-056"
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
