name: spec006-native-product-lock

on:
  push:
    branches: [impl/006-desktop-computer-control]
    paths:
      - .github/workflows/spec006-native-product-lock.yml

permissions:
  contents: read

jobs:
  generate:
    name: generate-${{ matrix.platform }}-product-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native qualification prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev \
            libclang-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxtst-dev \
            pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Generate exact admitted workspace lock in temporary archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/golam-spec006-native-product-lock"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          git archive HEAD | tar -x -C "$ROOT"
          cd "$ROOT"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/golamd/Cargo.toml')
          text = path.read_text(encoding='utf-8')

          linux = '''[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
          landlock.workspace = true
          libc.workspace = true
          nix.workspace = true
          seccompiler.workspace = true
          atspi = { version = "=0.30.0", default-features = false, features = ["proxies", "connection", "tokio"] }
          ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
          pipewire = { version = "=0.9.2" }
          enigo = { version = "=0.6.1", default-features = false, features = ["x11rb"] }
          x11-clipboard = { version = "=0.9.3" }
          '''
          current_linux = '''[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
          landlock.workspace = true
          libc.workspace = true
          nix.workspace = true
          seccompiler.workspace = true
          '''
          if text.count(current_linux) != 1:
              raise SystemExit('EXACT_LINUX_TARGET_BLOCK_NOT_FOUND_ONCE')
          text = text.replace(current_linux, linux, 1)

          platform_targets = '''
          [target.'cfg(target_os = "windows")'.dependencies]
          xa11y-core = { version = "=0.13.0", default-features = false }
          xa11y-windows = { version = "=0.13.0", default-features = false }
          wgc = { version = "=1.0.7", default-features = false }
          enigo = { version = "=0.6.1", default-features = false }
          arboard = { version = "=3.6.1", default-features = false }

          [target.'cfg(target_os = "macos")'.dependencies]
          axuielement = { version = "=0.9.1", default-features = false }
          screencapturekit = { version = "=10.0.3", default-features = false }
          enigo = { version = "=0.6.1", default-features = false }
          arboard = { version = "=3.6.1", default-features = false }
          '''
          marker = '\n[lints]\n'
          if text.count(marker) != 1:
              raise SystemExit('LINTS_MARKER_NOT_FOUND_ONCE')
          text = text.replace(marker, platform_targets + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

          echo '=== EXACT_TEMP_PRODUCT_MANIFEST ==='
          cat crates/golamd/Cargo.toml
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 metadata --locked --format-version 1 >/dev/null
          cargo +1.98.0 check --locked -p golamd

          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          data = Path('Cargo.lock').read_bytes()
          print('=== PRODUCT_LOCK_EVIDENCE ===')
          print(f'PRODUCT_LOCK_BYTES={len(data)}')
          print(f'PRODUCT_LOCK_SHA256={hashlib.sha256(data).hexdigest()}')
          packed = gzip.compress(data, compresslevel=9, mtime=0)
          print(f'PRODUCT_LOCK_GZIP_BYTES={len(packed)}')
          print('PRODUCT_LOCK_GZIP_B64=' + base64.b64encode(packed).decode('ascii'))
          print('PRODUCT_MANIFEST_SOURCE=TEMP_GIT_ARCHIVE_ONLY')
          print('PRODUCT_DEPENDENCY_SET=EXACT_ADMITTED_T006_016_T006_033')
          PY

      - name: Prove checked-out product remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.toml Cargo.lock crates/golamd/Cargo.toml
          echo 'CHECKED_OUT_PRODUCT_MANIFEST_MUTATION=NO'
          echo 'CHECKED_OUT_PRODUCT_LOCK_MUTATION=NO'
