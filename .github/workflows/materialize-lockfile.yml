name: materialize-lockfile

on:
  pull_request:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Persist Cargo.lock for bounded dependency update
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 generate-lockfile
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: materialize qualified secret dependency lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
