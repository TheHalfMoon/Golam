name: t003-061-record
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Record qualification and activate T003-062
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: replacement count {count} for {old!r}')
              path.write_text(text.replace(old, new, 1))

          tasks = Path('specs/003-identity-policy-secrets-sandbox/tasks.md')
          replace_once(tasks, '- [ ] **T003-061** Implement non-strict EgressPermit scope and protected issuance/revocation/use accounting.', '- [x] **T003-061** Implement non-strict EgressPermit scope and protected issuance/revocation/use accounting. Exact-head qualification: CI #514 (`33198112325`) SUCCESS at `94d1482f8963ea4d5630a1ba4d2bdaba0e12e7ef` on Windows/macOS/Ubuntu. Evidence: `implementation/egress-permit-qualification.md`.')
          replace_once(tasks, 'T003_060_CI_RUN=33196075286\nCEDAR_POLICY_ADMITTED_EXACT=4.12.0', 'T003_060_CI_RUN=33196075286\nT003_061=PASS\nT003_061_QUALIFIED_HEAD=94d1482f8963ea4d5630a1ba4d2bdaba0e12e7ef\nT003_061_CI_RUN=33198112325\nCEDAR_POLICY_ADMITTED_EXACT=4.12.0')
          replace_once(tasks, 'NEXT_TASK=T003-061', 'NEXT_TASK=T003-062')

          plan = Path('specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md')
          replace_once(plan, '**Current task**: `T003-061`', '**Current task**: `T003-062`')
          replace_once(plan, 'Phase F is closed at the task-qualified head above. Phase G is active at T003-061.', 'Phase F is closed at the task-qualified head above. Phase G is active at T003-062.')
          replace_once(plan, '### T003-061 — ACTIVE\n\nImplement non-strict `EgressPermit` scope plus protected issuance, revocation, and bounded use accounting while preserving T003-060 hard-guard dominance.', '### T003-061 — COMPLETE\n\nQualified at exact implementation head `94d1482f8963ea4d5630a1ba4d2bdaba0e12e7ef` by CI #514 / run `33198112325`, SUCCESS on Windows/macOS/Ubuntu.\n\nEvidence: `implementation/egress-permit-qualification.md`.\n\nThe qualified boundary implements protected permit issuance/revocation, exact scope and lifetime checks, active-policy and parent-lease validation, atomic bounded use accounting, schema-v4 `uses_consumed`, and `authority-security-v2` snapshots while preserving strict-local dominance.\n\n### T003-062 — ACTIVE\n\nImplement mandatory reauthorization of every changed effective destination before connect/follow for DNS resolution, redirect, rebinding, protocol/port, and private/link-local/loopback transitions.')
          replace_once(plan, '- Remaining Phase G: T003-061..T003-064, strict-local hard denial remains dominant.', '- Remaining Phase G: T003-062..T003-064, strict-local hard denial remains dominant.')
          replace_once(plan, 'T003_060_CI_RUN=33196075286\nNEXT_TASK=T003-061', 'T003_060_CI_RUN=33196075286\nT003_061=PASS\nT003_061_QUALIFIED_HEAD=94d1482f8963ea4d5630a1ba4d2bdaba0e12e7ef\nT003_061_CI_RUN=33198112325\nNEXT_TASK=T003-062')
      - name: Commit qualification record
        run: |
          git rm .github/workflows/t003-061-record.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/003-identity-policy-secrets-sandbox/tasks.md
          git add specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md
          git commit -m 'docs: activate T003-062 destination reauthorization'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
