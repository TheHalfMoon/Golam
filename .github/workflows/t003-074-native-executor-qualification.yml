name: t003-074-native-executor-qualification
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned qualification dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Wire test-only native qualification profile
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/golam-ledger/src/lib.rs')
          text = path.read_text()
          marker = '#[cfg(test)]\nmod sandbox_native_qualification;'
          if marker in text:
              raise SystemExit('T003-074 qualification module already wired')
          anchor = 'pub mod sandbox_enforcement;\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'sandbox enforcement module anchor count {text.count(anchor)}')
          path.write_text(text.replace(anchor, anchor + marker + '\n', 1))
      - name: Apply pinned formatting
        run: cargo +1.98.0 fmt --all
      - name: Focused Rust qualification
        run: |
          cargo +1.98.0 test -p golam-ledger sandbox_native_qualification:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger sandbox_executor::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger sandbox_enforcement::tests:: -- --nocapture
          cargo +1.98.0 clippy -p golam-ledger --all-targets -- -D warnings
      - name: Execute bounded native sandbox qualification
        run: bash scripts/qualification/t003-074-native-executor.sh
      - name: Commit clean T003-074 candidate
        run: |
          git rm .github/workflows/t003-074-native-executor-qualification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/lib.rs crates/golam-ledger/src/sandbox_native_qualification.rs scripts/qualification/t003-074-native-executor.sh
          git commit -m 'test: qualify minimum native sandbox executor'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox