name: t003-073-focused-qualification
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Repair trusted fail-closed capability baseline
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/golam-ledger/src/sandbox_executor.rs')
          text = path.read_text()
          old = '    pub(crate) fn from_trusted_manifest(\n'
          if text.count(old) != 1:
              raise SystemExit(f'trusted constructor anchor count {text.count(old)}')
          text = text.replace(old, '    fn from_trusted_manifest(\n', 1)

          anchor = '#[derive(Clone, Debug, Eq, PartialEq)]\npub struct SandboxExecutorCapabilityResolution {'
          insertion = '''/// Return the only production capability manifest admitted by T003-073.\n///\n/// No native executor containment control is qualified yet, so the trusted baseline\n/// deliberately advertises zero controls. Any profile that requires containment therefore\n/// fails closed until a later ordered task implements and qualifies concrete enforcement.\npub fn current_platform_executor_capabilities(\n) -> Result<PlatformExecutorCapabilities, SandboxExecutorError> {\n    PlatformExecutorCapabilities::from_trusted_manifest("native:unqualified", &[])\n}\n\n#[derive(Clone, Debug, Eq, PartialEq)]\npub struct SandboxExecutorCapabilityResolution {'''
          if text.count(anchor) != 1:
              raise SystemExit(f'resolution anchor count {text.count(anchor)}')
          text = text.replace(anchor, insertion, 1)

          test_anchor = '    #[test]\n    fn capability_manifest_is_canonical_and_duplicate_free() {'
          test_insert = '''    #[test]\n    fn production_baseline_advertises_no_unqualified_containment() {\n        let plan = plan();\n        let descriptor = descriptor(&plan);\n        let capabilities = current_platform_executor_capabilities().expect("baseline manifest");\n        assert_eq!(capabilities.executor_id(), "native:unqualified");\n        assert_eq!(capabilities.platform(), SandboxPlatform::current());\n        assert!(matches!(\n            resolve_platform_executor_capabilities(&plan, &descriptor, &capabilities),\n            Err(SandboxExecutorError::UnsupportedRequiredControl(_))\n        ));\n    }\n\n    #[test]\n    fn capability_manifest_is_canonical_and_duplicate_free() {'''
          if text.count(test_anchor) != 1:
              raise SystemExit(f'baseline test anchor count {text.count(test_anchor)}')
          path.write_text(text.replace(test_anchor, test_insert, 1))
      - name: Apply pinned formatting
        run: cargo +1.98.0 fmt --all
      - name: Focused T003-073 qualification
        run: |
          cargo +1.98.0 test -p golam-ledger sandbox_executor::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger sandbox_enforcement::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger sandbox_plan::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger sandbox_profile::tests:: -- --nocapture
          cargo +1.98.0 clippy -p golam-ledger --all-targets -- -D warnings
      - name: Commit clean T003-073 candidate
        run: |
          git rm .github/workflows/t003-073-focused-qualification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/sandbox_executor.rs
          git commit -m 'fix: expose fail-closed sandbox capability baseline'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox