name: spec006-product-locks

on:
  push:
    branches: [impl/006-desktop-computer-control]
    paths:
      - .github/workflows/spec006-product-locks.yml

permissions:
  contents: write

jobs:
  generate-exact-product-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/006-desktop-computer-control
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Generate exact Cargo product lock
        run: cargo +1.98.0 generate-lockfile
      - name: Generate exact npm product lock without lifecycle scripts
        working-directory: apps/golam-desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify admitted direct dependency versions
        working-directory: apps/golam-desktop
        shell: bash
        run: |
          node <<'NODE'
          const manifest = require('./package.json');
          const expected = {
            dependencies: {
              '@tauri-apps/api': '2.11.1',
              react: '19.2.8',
              'react-dom': '19.2.8',
            },
            devDependencies: {
              '@tauri-apps/cli': '2.11.4',
              '@vitejs/plugin-react': '6.1.1',
              typescript: '6.0.3',
              vite: '8.2.2',
            },
          };
          for (const [section, entries] of Object.entries(expected)) {
            for (const [name, version] of Object.entries(entries)) {
              if (manifest[section]?.[name] !== version) {
                throw new Error(`unexpected direct dependency ${section}.${name}=${manifest[section]?.[name]}`);
              }
            }
          }
          NODE
      - name: Commit generated product locks only
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock apps/golam-desktop/package-lock.json
          if git diff --cached --quiet; then
            echo 'PRODUCT_LOCKS_ALREADY_RECONCILED=YES'
            exit 0
          fi
          changed="$(git diff --cached --name-only)"
          expected=$'Cargo.lock\napps/golam-desktop/package-lock.json'
          if [[ "$changed" != "$expected" ]]; then
            echo "unexpected staged paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(006): reconcile desktop product locks'
          git push origin HEAD:impl/006-desktop-computer-control
