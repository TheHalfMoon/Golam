name: t003-056-ledger
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Advance task ledger
        shell: python
        run: |
          from pathlib import Path

          tasks = Path('specs/003-identity-policy-secrets-sandbox/tasks.md')
          t = tasks.read_text()
          old = '''- [ ] **T003-056** ACTIVE — Add canary tests covering both recognized and deliberately unknown-format deterministic values through the explicit secret-entry path, proving no plaintext in durable vault bytes, event/audit/log/error/prompt paths or unauthorized subprocess output; separately test free-text detectors as defense in depth.\n- [ ] **T003-057** Add crash/disk-full/rotation/revocation tests and prove no acknowledged half-transition exposes stale secret authority.'''
          new = '''- [x] **T003-056** Add canary tests covering both recognized and deliberately unknown-format deterministic values through the explicit secret-entry path, proving no plaintext in durable vault bytes, event/audit/log/error/prompt paths or unauthorized subprocess output; separately test free-text detectors as defense in depth. Exact-head qualification: CI #484 (`33169107060`) SUCCESS at `b1a47898515dc06237a0d71cea00e81b19cddd0a` on Windows/macOS/Ubuntu. Evidence: `implementation/secret-canary-qualification.md`.\n- [ ] **T003-057** ACTIVE — Add crash/disk-full/rotation/revocation tests and prove no acknowledged half-transition exposes stale secret authority.'''
          if old not in t:
              raise SystemExit('tasks T003-056 marker missing')
          t = t.replace(old, new, 1)
          gate = '''T003_055_CI_RUN=33167705734\nT003_056=ACTIVE\nCEDAR_POLICY_ADMITTED_EXACT=4.12.0'''
          gate_new = '''T003_055_CI_RUN=33167705734\nT003_056=PASS\nT003_056_QUALIFIED_HEAD=b1a47898515dc06237a0d71cea00e81b19cddd0a\nT003_056_CI_RUN=33169107060\nT003_057=ACTIVE\nCEDAR_POLICY_ADMITTED_EXACT=4.12.0'''
          if gate not in t:
              raise SystemExit('tasks gate marker missing')
          t = t.replace(gate, gate_new, 1)
          t = t.replace('NEXT_TASK=T003-056', 'NEXT_TASK=T003-057', 1)
          tasks.write_text(t)

          plan = Path('specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md')
          p = plan.read_text()
          p = p.replace('**Current task**: `T003-056`', '**Current task**: `T003-057`', 1)
          old_section = '''### T003-056 — ACTIVE\n\nAdd deterministic recognized- and unknown-format canary leakage qualification for the explicit secret-entry path.\n\nRequired boundaries:\n\n- prove raw canaries are absent from durable vault bytes outside ciphertext, canonical event/audit/log/error/prompt paths, and unauthorized subprocess output;\n- exercise both recognized and deliberately unknown-format deterministic values through the same explicit-entry guarantee;\n- keep free-text detector tests separate and explicitly defense in depth rather than the source of secrecy;\n- use deterministic canaries only and no real secrets;\n- preserve the no-generic-plaintext-read boundary and existing protected mutation authority requirements.\n\nAfter exact-head T003-056 qualification, continue directly to T003-057.\n'''
          new_section = '''### T003-056 — COMPLETE\n\nQualified at exact implementation head `b1a47898515dc06237a0d71cea00e81b19cddd0a` by CI #484 / run `33169107060`, SUCCESS on Windows/macOS/Ubuntu.\n\nEvidence: `implementation/secret-canary-qualification.md`.\n\nThe qualified suite exercises recognized and deliberately unknown-format deterministic canaries through the same explicit-entry path, scans durable authority files and canonical model-visible event payloads, checks rendered errors, and proves an environment-cleared unauthorized subprocess cannot recover the plaintext from durable authority bytes. Free-text recognition remains bounded defense in depth only.\n\n### T003-057 — ACTIVE\n\nAdd crash/disk-full/rotation/revocation qualification and prove no acknowledged half-transition exposes stale secret authority.\n\nRequired boundaries:\n\n- injected pre-commit failures must roll back secret record/version/handle and approval-consumption state atomically;\n- crash/restart evidence must show only fully committed protected transitions survive;\n- rotation must leave exactly one active current version while retired versions remain immutable and stale handles deny;\n- revocation must immediately block broker/fallback use without deleting prior encrypted versions or weakening audit integrity;\n- no failure mode may acknowledge success while leaving old secret authority usable as current.\n\nAfter exact-head T003-057 qualification, close Phase F and continue directly to T003-060.\n'''
          if old_section not in p:
              raise SystemExit('plan T003-056 section missing')
          p = p.replace(old_section, new_section, 1)
          gate = '''T003_055_CI_RUN=33167705734\nT003_056=ACTIVE\nNEXT_TASK=T003-056'''
          gate_new = '''T003_055_CI_RUN=33167705734\nT003_056=PASS\nT003_056_QUALIFIED_HEAD=b1a47898515dc06237a0d71cea00e81b19cddd0a\nT003_056_CI_RUN=33169107060\nT003_057=ACTIVE\nNEXT_TASK=T003-057'''
          if gate not in p:
              raise SystemExit('plan gate marker missing')
          plan.write_text(p.replace(gate, gate_new, 1))
      - name: Commit and self-delete
        run: |
          git rm .github/workflows/t003-056-ledger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/003-identity-policy-secrets-sandbox/tasks.md specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md
          git commit -m 'docs: activate T003-057 secret fault qualification'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
