name: t003-053-link-broker

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/t003-053-link-broker.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'impl/003-identity-policy-secrets-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Integrate T003-053 protected broker source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/golam-ledger/src/lib.rs')
          text = lib.read_text()
          needle = '#[allow(dead_code)]\nmod secret_vault;\n'
          replacement = '#[allow(dead_code)]\nmod secret_vault;\n#[allow(dead_code)]\npub(crate) mod secret_broker;\n'
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('lib.rs integration anchor missing')
              text = text.replace(needle, replacement, 1)
          lib.write_text(text)

          path = Path('crates/golam-ledger/src/authority_security_write.rs')
          text = path.read_text()
          enum_old = '    SecretRecord,\n    SecretVersion,\n    #[cfg(test)]\n    SecretHandle,\n'
          enum_new = '    SecretRecord,\n    SecretVersion,\n    SecretUseRecord,\n    #[cfg(test)]\n    SecretHandle,\n'
          if enum_new not in text:
              if enum_old not in text:
                  raise SystemExit('protected mutation enum anchor missing')
              text = text.replace(enum_old, enum_new, 1)
          match_old = '            Self::SecretRecord => "secret_record",\n            Self::SecretVersion => "secret_version",\n            #[cfg(test)]\n            Self::SecretHandle => "secret_handle",\n'
          match_new = '            Self::SecretRecord => "secret_record",\n            Self::SecretVersion => "secret_version",\n            Self::SecretUseRecord => "secret_use_record",\n            #[cfg(test)]\n            Self::SecretHandle => "secret_handle",\n'
          if match_new not in text:
              if match_old not in text:
                  raise SystemExit('protected mutation name anchor missing')
              text = text.replace(match_old, match_new, 1)
          function = '''\npub(crate) fn append_secret_use_record_snapshot(\n    transaction: &Transaction<'_>,\n    use_id: &[u8],\n) -> Result<(), AuthoritySecurityWriteError> {\n    let values = query_values(\n        transaction,\n        "SELECT use_id, handle_id, principal, purpose, destination_or_process, mode, approval_id, decision_id, created_global_seq FROM secret_use_records WHERE use_id = ?1",\n        params![use_id],\n    )?;\n    append_snapshot(\n        transaction,\n        ProtectedMutationKind::SecretUseRecord,\n        1,\n        &values,\n    )\n}\n'''
          anchor = '''\n#[cfg(test)]\npub(crate) fn append_secret_handle_snapshot(\n'''
          if 'pub(crate) fn append_secret_use_record_snapshot(' not in text:
              if anchor not in text:
                  raise SystemExit('secret handle writer anchor missing')
              text = text.replace(anchor, function + anchor, 1)
          path.write_text(text)
          PY
          cargo +1.98.0 fmt --all
          git rm .github/workflows/t003-053-link-broker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/lib.rs crates/golam-ledger/src/authority_security_write.rs
          git commit -m 'impl: integrate protected secret broker source'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox