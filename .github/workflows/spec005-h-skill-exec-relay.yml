name: spec005-h-skill-exec-relay

on:
  push:
    branches:
      - impl/005-local-tools-context-memory
    paths:
      - .github/workflows/spec005-h-skill-exec-relay.yml

permissions:
  contents: write

jobs:
  qualify-and-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Apply and qualify executable skill bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qualification/spec005_h_skill_exec_repair.py
          python3 scripts/qualification/spec005_h_skill_exec_repair_v2.py
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golamd --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golamd skill_packages::
          cargo +1.98.0 test --locked -p golamd --lib
      - name: Commit exact qualified T005-087 unit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin impl/005-local-tools-context-memory
          test "$(git rev-parse origin/impl/005-local-tools-context-memory)" = "$GITHUB_SHA"
          git rm .github/workflows/spec005-h-skill-exec-relay.yml scripts/qualification/spec005_h_skill_exec_repair.py scripts/qualification/spec005_h_skill_exec_repair_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golamd/src/lib.rs crates/golamd/src/local_fs.rs crates/golamd/src/skill_packages.rs crates/golamd/src/skill_process_v2.rs
          git commit -m 'feat(005): route executable skills through process gate'
          git push origin HEAD:impl/005-local-tools-context-memory
