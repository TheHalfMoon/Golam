name: t003-073-qualification-recorder
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Record exact T003-073 qualification
        shell: python
        run: |
          from pathlib import Path

          head = '39b5989b18457785f0a02a952c1f6d69bb123e60'
          tree = '7b70ae25afcf6a601b376d76ea5dd99ba9f6cce4'
          run = '33246660545'

          tasks = Path('specs/003-identity-policy-secrets-sandbox/tasks.md')
          text = tasks.read_text()
          old = '- [ ] **T003-073** Implement platform-executor capability checks and fail closed when a required containment control is unsupported.'
          new = '- [x] **T003-073** Implement platform-executor capability checks and fail closed when a required containment control is unsupported. Exact-head qualification: CI #574 (`33246660545`) SUCCESS at `39b5989b18457785f0a02a952c1f6d69bb123e60`, tree `7b70ae25afcf6a601b376d76ea5dd99ba9f6cce4`, on Windows/macOS/Ubuntu. Evidence: `implementation/sandbox-executor-capability-qualification.md`.'
          if text.count(old) != 1:
              raise SystemExit(f'T003-073 task anchor count {text.count(old)}')
          text = text.replace(old, new, 1)
          old_gate = 'T003_072_CI_RUN=33237725527\nNEXT_TASK=T003-073'
          new_gate = '\n'.join([
              'T003_072_CI_RUN=33237725527',
              'T003_073=PASS',
              f'T003_073_QUALIFIED_HEAD={head}',
              f'T003_073_QUALIFIED_TREE={tree}',
              f'T003_073_CI_RUN={run}',
              'NEXT_TASK=T003-074',
          ])
          if text.count(old_gate) != 1:
              raise SystemExit(f'T003-073 task gate anchor count {text.count(old_gate)}')
          tasks.write_text(text.replace(old_gate, new_gate, 1))

          plan = Path('specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md')
          text = plan.read_text()
          if text.count('**Current task**: `T003-073`') != 1:
              raise SystemExit('current task anchor mismatch')
          text = text.replace('**Current task**: `T003-073`', '**Current task**: `T003-074`', 1)
          old_section = '\n'.join([
              '### T003-073 — ACTIVE',
              '',
              'Resolve every profile and rights-derived containment requirement against a trusted current-platform executor capability manifest and fail closed before launch when any required control is unsupported. No native process launch is authorized by this task.',
          ])
          new_section = '\n'.join([
              '### T003-073 — COMPLETE',
              '',
              'Qualified at exact implementation head `39b5989b18457785f0a02a952c1f6d69bb123e60`, tree `7b70ae25afcf6a601b376d76ea5dd99ba9f6cce4`, by CI #574 / run `33246660545`, SUCCESS on Windows/macOS/Ubuntu.',
              '',
              'Evidence: `implementation/sandbox-executor-capability-qualification.md`.',
              '',
              'The qualified boundary resolves every rights-derived and exact profile platform requirement against a trusted current-platform capability manifest and fails closed before launch if any required control is unsupported. The production T003-073 baseline advertises zero native containment controls (`native:unqualified`), preventing capability self-assertion and preserving honest fail-closed behavior until T003-074 qualifies concrete native execution. No process is launched and no platform containment is claimed.',
              '',
              '### T003-074 — ACTIVE',
              '',
              'Reuse the already-qualified descendant-aware strict-local observer, then implement the minimum native untrusted-process test executor/profile necessary to prove the contract without claiming unsupported universal isolation. Any network-capable managed child remains forbidden until complete managed-process-tree external observation is active.',
          ])
          if text.count(old_section) != 1:
              raise SystemExit(f'T003-073 execution section anchor count {text.count(old_section)}')
          text = text.replace(old_section, new_section, 1)
          text = text.replace('- Remaining Phase H: T003-073..T003-076.', '- Remaining Phase H: T003-074..T003-076.', 1)
          if text.count(old_gate) != 1:
              raise SystemExit(f'T003-073 execution gate anchor count {text.count(old_gate)}')
          plan.write_text(text.replace(old_gate, new_gate, 1))

          evidence = Path('specs/003-identity-policy-secrets-sandbox/implementation/sandbox-executor-capability-qualification.md')
          if evidence.exists():
              raise SystemExit('T003-073 evidence already exists')
          lines = [
              '# T003-073 Sandbox Executor Capability Qualification',
              '',
              '## Scope',
              '',
              'T003-073 resolves required sandbox controls against a trusted current-platform capability manifest before any native process launch. It does not implement or claim operating-system containment.',
              '',
              '## Exact qualification',
              '',
              '- Qualified implementation head: `39b5989b18457785f0a02a952c1f6d69bb123e60`',
              '- Qualified tree: `7b70ae25afcf6a601b376d76ea5dd99ba9f6cce4`',
              '- Official CI: #574 / run `33246660545`',
              '- Windows: SUCCESS',
              '- macOS: SUCCESS',
              '- Ubuntu: SUCCESS',
              '',
              'The exact-head run completed pinned format, clippy, workspace tests, property qualification, bounded fuzz smoke, IPC qualification, adversarial authority qualification, daemon build, and platform-appropriate descendant-aware strict-local external observation.',
              '',
              '## Security properties',
              '',
              '- A requester cannot construct or widen the production capability manifest.',
              '- Every rights-derived containment control and every exact `platform_requirements` token is required before resolution succeeds.',
              '- A missing control fails closed with `UnsupportedRequiredControl` before launch.',
              '- A manifest for a non-current platform fails closed.',
              '- `WasmWasiExtension` remains rejected because Wasmtime is not admitted.',
              '- The production baseline is `native:unqualified` with zero supported containment controls until concrete enforcement is implemented and qualified.',
              '- Capability resolution is deterministic and binds the launch plan, enforcement descriptor, executor manifest, platform, and required controls.',
              '- No process was launched by T003-073 and no operating-system containment is claimed.',
              '',
              '```text',
              'T003_073=PASS',
              'CAPABILITY_MANIFEST_BOUNDARY=TRUSTED_FIXED',
              'UNQUALIFIED_BASELINE_CONTROLS=NONE',
              'UNSUPPORTED_REQUIRED_CONTROL_DENIES=YES',
              'PROFILE_REQUIREMENTS_RESOLVED_EXACTLY=YES',
              'RIGHTS_DERIVED_CONTROLS_REQUIRED=YES',
              'PLATFORM_MISMATCH_DENIES=YES',
              'WASMTIME_DISPOSITION=NOT_ADMITTED_NOT_NEEDED',
              'PLATFORM_CONTAINMENT_CLAIMED=NO',
              'NETWORK_CAPABLE_MANAGED_CHILD_LAUNCHED=NO',
              'NEXT_TASK=T003-074',
              '```',
          ]
          evidence.write_text('\n'.join(lines) + '\n')
      - name: Validate recorder mutation
        run: |
          git diff --check
          grep -q '^T003_073=PASS$' specs/003-identity-policy-secrets-sandbox/tasks.md
          grep -q '^NEXT_TASK=T003-074$' specs/003-identity-policy-secrets-sandbox/tasks.md
          grep -q '^T003_073=PASS$' specs/003-identity-policy-secrets-sandbox/implementation/sandbox-executor-capability-qualification.md
      - name: Commit repository evidence
        run: |
          git rm .github/workflows/t003-073-qualification-recorder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/003-identity-policy-secrets-sandbox/tasks.md
          git add specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md
          git add specs/003-identity-policy-secrets-sandbox/implementation/sandbox-executor-capability-qualification.md
          git commit -m 'docs: record T003-073 sandbox capability qualification'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox