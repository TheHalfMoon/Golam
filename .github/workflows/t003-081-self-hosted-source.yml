name: T003-081 Self-Hosted Runner Probe

on:
  push:
    branches:
      - qualify/t003-081-self-hosted-source

permissions:
  contents: read

jobs:
  runner-probe:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify candidate source identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a6420da22d97f3ca68177f4ea9fe8c1f9b9023eb HEAD
          changed="$(git diff --name-only a6420da22d97f3ca68177f4ea9fe8c1f9b9023eb HEAD)"
          test "$changed" = ".github/workflows/t003-081-self-hosted-source.yml"

      - name: Show runner identity
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          rustc --version || true
          cargo --version || true
