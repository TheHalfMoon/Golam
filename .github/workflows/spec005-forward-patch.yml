name: spec005-forward-patch

on:
  push:
    branches:
      - impl/005-local-tools-context-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
          fetch-depth: 1
      - name: Install pinned formatter
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply exact cross-platform cfg repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          linux_cfg = '#[cfg(all(target_os = "linux", target_arch = "x86_64"))]'

          lib = Path('crates/golamd/src/lib.rs')
          text = lib.read_text()
          old = '#[cfg(unix)]\nmod fcntl {'
          new = linux_cfg + '\nmod fcntl {'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one Unix fcntl gate')
          text = text.replace(old, new, 1)
          old = '#[cfg(unix)]\nmod sys {'
          new = linux_cfg + '\nmod sys {'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one Unix sys gate')
          text = text.replace(old, new, 1)
          lib.write_text(text)

          process = Path('crates/golamd/src/process_execution_v2.rs')
          text = process.read_text()
          replacements = [
              ('use std::fs;\n', linux_cfg + '\nuse std::fs;\n'),
              ('use golam_core::target_identity::ObservedFileKind;\n', linux_cfg + '\nuse golam_core::target_identity::ObservedFileKind;\n'),
              ('use golam_core::tool_request::{BindingDigest, PreparedToolRequest, RequestedOperationId};\n',
               'use golam_core::tool_request::{BindingDigest, PreparedToolRequest};\n' + linux_cfg + '\nuse golam_core::tool_request::RequestedOperationId;\n'),
              ('use golam_kernel::{\n    AuthorizationPolicy, CompleteToolEffect, KernelApi, PrepareToolEffect, Principal,\n    ProtectedResourceError, ToolEffectError, ToolExecutionCompletion,\n};\n',
               'use golam_kernel::{\n    AuthorizationPolicy, KernelApi, Principal, ProtectedResourceError, ToolEffectError,\n};\n' + linux_cfg + '\nuse golam_kernel::{CompleteToolEffect, PrepareToolEffect, ToolExecutionCompletion};\n'),
              ('use crate::static_elf_v2::{MAX_STATIC_EXECUTABLE_BYTES, StaticElfV2Error, validate_static_elf_v2};\n',
               'use crate::static_elf_v2::StaticElfV2Error;\n' + linux_cfg + '\nuse crate::static_elf_v2::{MAX_STATIC_EXECUTABLE_BYTES, validate_static_elf_v2};\n'),
              ('const PROCESS_STAGE_HANDLER_ID: &str = "golam-native-stage-linux-x86_64";\n',
               linux_cfg + '\nconst PROCESS_STAGE_HANDLER_ID: &str = "golam-native-stage-linux-x86_64";\n'),
              ('const PROCESS_STAGE_HANDLER_VERSION: &str = "2";\n',
               linux_cfg + '\nconst PROCESS_STAGE_HANDLER_VERSION: &str = "2";\n'),
              ('const STAGING_PARENT_PERMISSION_BITS: u32 = 0o700;\n',
               linux_cfg + '\nconst STAGING_PARENT_PERMISSION_BITS: u32 = 0o700;\n'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one process staging pattern: {old!r}')
              text = text.replace(old, new, 1)
          process.write_text(text)

          local_fs = Path('crates/golamd/src/local_fs.rs')
          text = local_fs.read_text()
          old = 'pub(crate) fn metadata_matches_resolved_identity(\n'
          new = linux_cfg + '\n' + old
          if text.count(old) != 1:
              raise SystemExit('expected exactly one metadata identity helper')
          text = text.replace(old, new, 1)
          local_fs.write_text(text)
          PY
          cargo +1.98.0 fmt --all
          rm .github/workflows/spec005-forward-patch.yml
          git diff --check
      - name: Commit guarded forward-only repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/lib.rs crates/golamd/src/process_execution_v2.rs crates/golamd/src/local_fs.rs .github/workflows/spec005-forward-patch.yml
          git commit -m "fix(005): gate Linux process staging symbols"
          git push origin HEAD:impl/005-local-tools-context-memory
