name: t003-070-sandbox-profile
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Wire protected sandbox profile authority
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: replacement count {count} for {old!r}')
              path.write_text(text.replace(old, new, 1))

          lib = Path('crates/golam-ledger/src/lib.rs')
          replace_once(
              lib,
              'pub mod run_preauthorization;\n',
              'pub mod run_preauthorization;\npub mod sandbox_profile;\n',
              'sandbox profile module export',
          )

          authority = Path('crates/golam-ledger/src/authority_security_write.rs')
          replace_once(
              authority,
              '    EgressPermit,\n    #[cfg(test)]\n    SandboxProfile,\n    #[cfg(test)]\n    SandboxAdmission,',
              '    EgressPermit,\n    SandboxProfile,\n    #[cfg(test)]\n    SandboxAdmission,',
              'protected mutation enum',
          )
          replace_once(
              authority,
              '            Self::EgressPermit => "egress_permit",\n            #[cfg(test)]\n            Self::SandboxProfile => "sandbox_profile",\n            #[cfg(test)]\n            Self::SandboxAdmission => "sandbox_admission",',
              '            Self::EgressPermit => "egress_permit",\n            Self::SandboxProfile => "sandbox_profile",\n            #[cfg(test)]\n            Self::SandboxAdmission => "sandbox_admission",',
              'protected mutation string mapping',
          )
          replace_once(
              authority,
              '#[cfg(test)]\npub(crate) fn append_sandbox_profile_snapshot(',
              'pub(crate) fn append_sandbox_profile_snapshot(',
              'sandbox profile snapshot visibility',
          )
      - name: Focused T003-070 qualification
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p golam-ledger sandbox_profile::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger authority_security_v2::tests:: -- --nocapture
          cargo +1.98.0 clippy -p golam-ledger --all-targets -- -D warnings
      - name: Commit clean T003-070 implementation
        run: |
          git rm .github/workflows/t003-070-sandbox-profile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/lib.rs
          git add crates/golam-ledger/src/sandbox_profile.rs
          git add crates/golam-ledger/src/authority_security_write.rs
          git commit -m 'feat: protect deterministic sandbox profile records'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
