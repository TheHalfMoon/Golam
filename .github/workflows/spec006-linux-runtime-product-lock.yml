name: spec006-linux-runtime-product-lock

on:
  push:
    branches: [impl/006-desktop-computer-control]
    paths:
      - .github/workflows/spec006-linux-runtime-product-lock.yml

permissions:
  contents: write

jobs:
  materialize:
    name: materialize-admitted-bounded-runtime-facade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact admitted parent and helper-only head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_ADMISSION_HEAD='a44836244670a03f56b8411aa4330e628b28eb84'
          ACTUAL_PARENT="$(git rev-parse HEAD^)"
          if [ "$ACTUAL_PARENT" != "$EXPECTED_ADMISSION_HEAD" ]; then
            echo "EXPECTED_ADMISSION_HEAD=$EXPECTED_ADMISSION_HEAD" >&2
            echo "ACTUAL_PARENT=$ACTUAL_PARENT" >&2
            exit 1
          fi
          python3 - <<'PY'
          import subprocess

          expected = {'.github/workflows/spec006-linux-runtime-product-lock.yml'}
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', 'a44836244670a03f56b8411aa4330e628b28eb84..HEAD'],
                  text=True,
              ).splitlines()
          )
          print('HELPER_HEAD_DELTA=' + ','.join(sorted(actual)))
          if actual != expected:
              raise SystemExit(f'UNEXPECTED_HELPER_HEAD_DELTA={sorted(actual)}')
          PY
          git diff --exit-code a44836244670a03f56b8411aa4330e628b28eb84..HEAD -- Cargo.toml Cargo.lock crates/golamd/Cargo.toml
          test ! -e crates/golam-bounded-linux-async
          echo 'ADMITTED_PRODUCT_BASE_UNCHANGED=YES'

      - name: Install Linux native qualification prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev \
            libclang-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxtst-dev \
            pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Materialize exact reviewed facade topology and Cargo lock
        shell: bash
        run: |
          set -euo pipefail
          export ORIGINAL_LOCK="${RUNNER_TEMP}/spec006-before-bounded-facade-Cargo.lock"
          cp Cargo.lock "$ORIGINAL_LOCK"

          python3 - <<'PY'
          from pathlib import Path

          root = Path('Cargo.toml')
          root_text = root.read_text(encoding='utf-8')
          old_members = '  "crates/golam-kernel",\n  "crates/golamd",\n'
          new_members = '  "crates/golam-kernel",\n  "crates/golam-bounded-linux-async",\n  "crates/golamd",\n'
          if root_text.count(old_members) != 1:
              raise SystemExit('EXACT_WORKSPACE_MEMBER_INSERTION_POINT_NOT_FOUND_ONCE')
          if 'crates/golam-bounded-linux-async' in root_text:
              raise SystemExit('BOUNDED_FACADE_WORKSPACE_MEMBER_ALREADY_PRESENT')
          root.write_text(root_text.replace(old_members, new_members, 1), encoding='utf-8')

          golamd = Path('crates/golamd/Cargo.toml')
          golamd_text = golamd.read_text(encoding='utf-8')
          linux_header = '[target.\'cfg(all(target_os = "linux", target_arch = "x86_64"))\'.dependencies]\n'
          if golamd_text.count(linux_header) != 1:
              raise SystemExit('EXACT_LINUX_TARGET_HEADER_NOT_FOUND_ONCE')
          if 'golam-bounded-linux-async' in golamd_text:
              raise SystemExit('BOUNDED_FACADE_DEPENDENCY_ALREADY_PRESENT')
          golamd_text = golamd_text.replace(
              linux_header,
              linux_header + 'golam-bounded-linux-async = { path = "../golam-bounded-linux-async" }\n',
              1,
          )
          if 'tokio' in '\n'.join(
              line for line in golamd_text.splitlines()
              if not line.lstrip().startswith(('atspi =', 'ashpd ='))
          ).lower():
              raise SystemExit('GOLAMD_DIRECT_TOKIO_REFERENCE_DETECTED')
          golamd.write_text(golamd_text, encoding='utf-8')
          PY

          mkdir -p crates/golam-bounded-linux-async/src
          cat > crates/golam-bounded-linux-async/Cargo.toml <<'EOF'
          [package]
          name = "golam-bounded-linux-async"
          version.workspace = true
          edition.workspace = true
          rust-version.workspace = true
          publish = false

          [dependencies]
          tokio = { version = "=1.53.1", default-features = false, features = ["rt", "time"] }

          [lints]
          workspace = true
          EOF

          cat > crates/golam-bounded-linux-async/src/lib.rs <<'EOF'
          #![forbid(unsafe_code)]

          use std::future::Future;
          use std::time::Duration;

          pub const MAX_BOUNDED_ASYNC_MILLIS: u64 = 30_000;

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub enum BoundedAsyncError {
              InvalidTimeout,
              RuntimeUnavailable,
              TimedOut,
          }

          pub fn run_bounded<F, T>(timeout: Duration, future: F) -> Result<T, BoundedAsyncError>
          where
              F: Future<Output = T>,
          {
              let timeout_millis = u64::try_from(timeout.as_millis())
                  .map_err(|_| BoundedAsyncError::InvalidTimeout)?;
              if timeout_millis == 0 || timeout_millis > MAX_BOUNDED_ASYNC_MILLIS {
                  return Err(BoundedAsyncError::InvalidTimeout);
              }

              let runtime = tokio::runtime::Builder::new_current_thread()
                  .enable_time()
                  .build()
                  .map_err(|_| BoundedAsyncError::RuntimeUnavailable)?;
              runtime.block_on(async move {
                  tokio::time::timeout(timeout, future)
                      .await
                      .map_err(|_| BoundedAsyncError::TimedOut)
              })
          }
          EOF

          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 metadata --locked --format-version 1 >/dev/null
          cargo +1.98.0 check --locked -p golam-bounded-linux-async
          cargo +1.98.0 check --locked -p golamd

          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          old_lock = tomllib.loads(Path(os.environ['ORIGINAL_LOCK']).read_text(encoding='utf-8'))
          new_lock = tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8'))

          def packages(lock):
              return lock.get('package', [])

          def normalized_external(lock):
              records = [p for p in packages(lock) if p.get('source')]
              return sorted(
                  (json.dumps(p, sort_keys=True, separators=(',', ':')) for p in records)
              )

          old_external = normalized_external(old_lock)
          new_external = normalized_external(new_lock)
          if old_external != new_external:
              raise SystemExit('BOUNDED_FACADE_EXTERNAL_LOCK_CLOSURE_CHANGED')

          def local_by_name(lock):
              return {p['name']: p for p in packages(lock) if not p.get('source')}

          old_local = local_by_name(old_lock)
          new_local = local_by_name(new_lock)
          added_local = set(new_local) - set(old_local)
          removed_local = set(old_local) - set(new_local)
          if added_local != {'golam-bounded-linux-async'} or removed_local:
              raise SystemExit(
                  f'UNEXPECTED_LOCAL_PACKAGE_DELTA=added:{sorted(added_local)},removed:{sorted(removed_local)}'
              )

          for name, old_record in old_local.items():
              if name == 'golamd':
                  continue
              if new_local.get(name) != old_record:
                  raise SystemExit(f'UNEXPECTED_EXISTING_LOCAL_LOCK_RECORD_CHANGE={name}')

          old_golamd = old_local['golamd']
          new_golamd = new_local['golamd']
          for key in set(old_golamd) | set(new_golamd):
              if key == 'dependencies':
                  continue
              if old_golamd.get(key) != new_golamd.get(key):
                  raise SystemExit(f'UNEXPECTED_GOLAMD_LOCK_FIELD_CHANGE={key}')
          old_deps = set(old_golamd.get('dependencies', []))
          new_deps = set(new_golamd.get('dependencies', []))
          if old_deps - new_deps:
              raise SystemExit(f'GOLAMD_LOCK_DEPENDENCY_REMOVED={sorted(old_deps - new_deps)}')
          if new_deps - old_deps != {'golam-bounded-linux-async'}:
              raise SystemExit(f'UNEXPECTED_GOLAMD_LOCK_DEPENDENCY_ADDITION={sorted(new_deps - old_deps)}')

          facade = new_local['golam-bounded-linux-async']
          if facade.get('version') != '0.1.0':
              raise SystemExit(f'UNEXPECTED_FACADE_VERSION={facade.get("version")}')
          if set(facade.get('dependencies', [])) != {'tokio'}:
              raise SystemExit(f'UNEXPECTED_FACADE_LOCK_DEPENDENCIES={facade.get("dependencies", [])}')

          tokio = [
              p for p in packages(new_lock)
              if p.get('name') == 'tokio' and p.get('version') == '1.53.1'
          ]
          if len(tokio) != 1:
              raise SystemExit(f'EXACT_TOKIO_1_53_1_RECORD_COUNT={len(tokio)}')
          expected_checksum = '202caea871b69668250d242070849eb495be178ed697a3e98aebce5bc81a0bed'
          if tokio[0].get('checksum') != expected_checksum:
              raise SystemExit(f'TOKIO_CHECKSUM_MISMATCH={tokio[0].get("checksum")}')

          print(f'BOUNDED_FACADE_EXTERNAL_LOCK_RECORD_COUNT={len(new_external)}')
          print('BOUNDED_FACADE_EXTERNAL_LOCK_CLOSURE_CHANGED=NO')
          print('BOUNDED_FACADE_LOCAL_PACKAGE_ADDED=golam-bounded-linux-async')
          print('GOLAMD_LOCAL_DEPENDENCY_ADDED=golam-bounded-linux-async')
          print('TOKIO_DIRECT_OWNER=GOLAM_BOUNDED_LINUX_ASYNC_FACADE_ONLY')
          print('TOKIO_DIRECT_VERSION=1.53.1')
          print('GOLAMD_DIRECT_TOKIO_DEPENDENCY=NO')
          PY

          python3 - <<'PY'
          from pathlib import Path

          source = Path('crates/golam-bounded-linux-async/src/lib.rs').read_text(encoding='utf-8')
          references = [line.strip() for line in source.splitlines() if 'tokio::' in line]
          allowed = (
              'tokio::runtime::Builder::new_current_thread()',
              'tokio::time::timeout(timeout, future)',
          )
          if len(references) != 2:
              raise SystemExit(f'UNEXPECTED_TOKIO_REFERENCE_COUNT={len(references)}')
          for reference in references:
              if not any(token in reference for token in allowed):
                  raise SystemExit(f'UNQUALIFIED_TOKIO_REFERENCE={reference}')
          denied = (
              'pub use tokio', 'pub type', 'tokio::net', 'tokio::process', 'tokio::spawn',
              'tokio::task', 'tokio::signal', 'tokio::fs', 'tokio::io', 'tokio::sync',
              'new_multi_thread', 'enable_all',
          )
          for token in denied:
              if token in source:
                  raise SystemExit(f'DENIED_FACADE_TOKEN={token}')
          print('FACADE_PUBLIC_TOKIO_REEXPORT=NO')
          print('FACADE_ALLOWED_TOKIO_REFERENCES=NEW_CURRENT_THREAD_AND_TIMEOUT_ONLY')
          print('DIRECT_PRODUCT_TOKIO_API_SURFACE_STRUCTURALLY_RESTRICTED_TO_BOUNDED_DRIVER=YES')
          PY

      - name: Commit only exact admitted product mutation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/spec006-linux-runtime-product-lock.yml
          git add \
            .github/workflows/spec006-linux-runtime-product-lock.yml \
            Cargo.toml \
            Cargo.lock \
            crates/golamd/Cargo.toml \
            crates/golam-bounded-linux-async/Cargo.toml \
            crates/golam-bounded-linux-async/src/lib.rs

          python3 - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/spec006-linux-runtime-product-lock.yml',
              'Cargo.toml',
              'Cargo.lock',
              'crates/golamd/Cargo.toml',
              'crates/golam-bounded-linux-async/Cargo.toml',
              'crates/golam-bounded-linux-async/src/lib.rs',
          }
          actual = set(
              subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          )
          print('PRODUCT_MUTATION_PATHS=' + ','.join(sorted(actual)))
          if actual != expected:
              raise SystemExit(f'UNEXPECTED_PRODUCT_MUTATION_PATHS={sorted(actual)}')
          PY

          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(006): admit bounded Linux async facade'
          git push origin "HEAD:${GITHUB_REF_NAME}"
