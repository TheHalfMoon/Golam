name: rustfmt-fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Persist rustfmt-only repair
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          if git diff --quiet; then
            echo "No rustfmt changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golam-ledger/src/secret_vault.rs
          git commit -m "style: apply rustfmt to secret vault core"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
