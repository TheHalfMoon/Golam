name: t003-063-egress-context
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Bind runtime information-flow context to effective egress authority
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: replacement count {count} for {old!r}')
              return text.replace(old, new, 1)

          lib_path = Path('crates/golam-ledger/src/lib.rs')
          lib = lib_path.read_text()
          lib = replace_once(
              lib,
              'pub mod egress_permit;\n',
              'pub mod egress_permit;\npub mod egress_use_context;\n',
              'lib module export',
          )
          lib_path.write_text(lib)

          path = Path('crates/golam-ledger/src/egress_effective_use.rs')
          text = path.read_text()
          text = replace_once(
              text,
              'use crate::egress_destination::EffectiveDestination;\n',
              'use crate::egress_destination::EffectiveDestination;\nuse crate::egress_use_context::EgressUseContext;\n',
              'context import',
          )
          text = replace_once(
              text,
              '    purpose: &str,\n    effective: &EffectiveDestination,\n',
              '    purpose: &str,\n    use_context: EgressUseContext,\n    effective: &EffectiveDestination,\n',
              'public use signature',
          )
          text = replace_once(
              text,
              '    if permit.principal_or_process != principal_or_process\n        || permit.action != action\n        || permit.purpose != purpose\n    {\n        return Err(EgressPermitError::PermitScopeMismatch);\n    }\n    if permit.protocol_port_scope != effective.protocol_port() {',
              '    if permit.principal_or_process != principal_or_process\n        || permit.action != action\n        || permit.purpose != purpose\n    {\n        return Err(EgressPermitError::PermitScopeMismatch);\n    }\n    if !use_context.matches_permit(&permit) {\n        return Err(EgressPermitError::PermitScopeMismatch);\n    }\n    if permit.protocol_port_scope != effective.protocol_port() {',
              'runtime context exact-match gate',
          )
          text = replace_once(
              text,
              '        action,\n        &permit,\n        effective,\n',
              '        action,\n        &permit,\n        use_context,\n        effective,\n',
              'decision loader call',
          )
          text = replace_once(
              text,
              '    permit: &crate::egress_permit::EgressPermitRecord,\n    effective: &EffectiveDestination,\n) -> Result<UseDecisionEvidence, EgressPermitError> {',
              '    permit: &crate::egress_permit::EgressPermitRecord,\n    use_context: EgressUseContext,\n    effective: &EffectiveDestination,\n) -> Result<UseDecisionEvidence, EgressPermitError> {',
              'decision loader signature',
          )
          text = replace_once(
              text,
              '    let expected_context_hash =\n        effective.decision_context_hash(permit.permit_id, &permit.destination_scope);',
              '    let expected_context_hash = use_context.decision_context_hash(\n        effective,\n        permit.permit_id,\n        &permit.destination_scope,\n    );',
              'production decision context hash',
          )
          text = replace_once(
              text,
              '        let context_hash =\n            effective.decision_context_hash(permit.permit_id, &permit.destination_scope);',
              '        let context_hash = EgressUseContext::new(permit.taint_digest, permit.secret_handle_id)\n            .decision_context_hash(effective, permit.permit_id, &permit.destination_scope);',
              'test decision context hash',
          )

          purpose_marker = 'permit_test::PURPOSE,\n'
          call_count = text.count(purpose_marker)
          if call_count != 8:
              raise SystemExit(f'expected 8 effective-use call sites, found {call_count}')
          text = text.replace(
              purpose_marker,
              purpose_marker + '                EgressUseContext::new(permit.taint_digest, permit.secret_handle_id),\n',
          )

          anchor = '        let first_decision = install_effective_use_decision(&mut store, 3, 101, &permit, &first);\n        let first_receipt = authorize_effective_use('
          replacement = '''        let first_decision = install_effective_use_decision(&mut store, 3, 101, &permit, &first);\n        assert!(matches!(\n            authorize_effective_use(\n                &mut store,\n                permit.permit_id,\n                first_decision,\n                permit_test::PRINCIPAL,\n                permit_test::ACTION,\n                permit_test::PURPOSE,\n                EgressUseContext::new([99; 32], permit.secret_handle_id),\n                &first,\n                "2026-08-28T01:58:00Z",\n            ),\n            Err(EgressPermitError::PermitScopeMismatch)\n        ));\n        assert!(matches!(\n            authorize_effective_use(\n                &mut store,\n                permit.permit_id,\n                first_decision,\n                permit_test::PRINCIPAL,\n                permit_test::ACTION,\n                permit_test::PURPOSE,\n                EgressUseContext::new(permit.taint_digest, Some([77; 16])),\n                &first,\n                "2026-08-28T01:59:00Z",\n            ),\n            Err(EgressPermitError::PermitScopeMismatch)\n        ));\n        let first_receipt = authorize_effective_use('''
          text = replace_once(text, anchor, replacement, 'mismatch regression assertions')
          path.write_text(text)
      - name: Format and run focused T003-063 qualification
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p golam-ledger egress_use_context::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger egress_effective_use::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger egress_permit::tests:: -- --nocapture
          cargo +1.98.0 clippy -p golam-ledger --all-targets -- -D warnings
      - name: Commit clean T003-063 implementation
        run: |
          git rm .github/workflows/t003-063-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/lib.rs
          git add crates/golam-ledger/src/egress_use_context.rs
          git add crates/golam-ledger/src/egress_effective_use.rs
          git commit -m 'feat: bind egress taint and secret handle context'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
