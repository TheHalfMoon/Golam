name: t003-052-advance-task-ledger

on:
  pull_request:

permissions:
  contents: write

jobs:
  advance:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'impl/003-identity-policy-secrets-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Record T003-052 qualification and activate T003-053
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tasks_path = Path('specs/003-identity-policy-secrets-sandbox/tasks.md')
          tasks = tasks_path.read_text()
          replacements = [
              (
                  '- [ ] **T003-052** ACTIVE — Implement secret create/version/rotate/revoke protected transitions with atomic security evidence.',
                  '- [x] **T003-052** Implement secret create/version/rotate/revoke protected transitions with atomic security evidence. Exact-head qualification: CI #434 (`33163396509`) SUCCESS at `b70689c1e4836f1540541f45d66cdd5a3f514dec` on Windows/macOS/Ubuntu. Evidence: `implementation/secret-mutation-qualification.md`.',
              ),
              (
                  '- [ ] **T003-053** Implement `BrokerSecretUse` authorization around handle, purpose, destination/process, lease/policy/approval and locality state.',
                  '- [ ] **T003-053** ACTIVE — Implement `BrokerSecretUse` authorization around handle, purpose, destination/process, lease/policy/approval and locality state.',
              ),
              (
                  'T003_052=ACTIVE\nCEDAR_POLICY_ADMITTED_EXACT=4.12.0',
                  'T003_052=PASS\nT003_052_QUALIFIED_HEAD=b70689c1e4836f1540541f45d66cdd5a3f514dec\nT003_052_CI_RUN=33163396509\nT003_053=ACTIVE\nCEDAR_POLICY_ADMITTED_EXACT=4.12.0',
              ),
              ('NEXT_TASK=T003-052', 'NEXT_TASK=T003-053'),
          ]
          for old, new in replacements:
              count = tasks.count(old)
              if count != 1:
                  raise SystemExit(f'tasks replacement expected once, got {count}: {old[:80]!r}')
              tasks = tasks.replace(old, new, 1)
          tasks_path.write_text(tasks)

          plan_path = Path('specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md')
          plan = plan_path.read_text()
          replacements = [
              ('**Current task**: `T003-052`', '**Current task**: `T003-053`'),
              (
                  '### T003-052 — ACTIVE\n\nImplement protected secret create/version/rotate/revoke transitions with atomic security evidence.\n\nRequired boundaries:\n\n- use the T003-050 opaque secret metadata/handle interfaces and T003-051 vault/key-protection core rather than introducing parallel authority paths;\n- every create/version/rotate/revoke transition is typed elevated work under current durable Golam authority and exact effect/approval binding where required;\n- mutation and authenticated `authority-security` evidence commit atomically in one protected SQLite transaction;\n- durable secret values are encrypted before insertion into `secret_versions`; plaintext is never written to canonical/audit/event/error payloads;\n- secret versions are immutable; rotation creates a new version and retires the prior version rather than overwriting it;\n- revocation is monotonic and blocks future protected use without deleting or rewriting historical security evidence;\n- stale authority, stale version/current-version binding, replay, duplicate transition, integrity failure, vault failure, key-protection failure, and transaction failure all fail closed;\n- use deterministic canary values only in qualification; no real secrets;\n- do not implement T003-053 broker authorization semantics early.\n\nAfter exact-head T003-052 qualification, continue directly to T003-053.',
                  '### T003-052 — COMPLETE\n\nQualified at exact implementation head `b70689c1e4836f1540541f45d66cdd5a3f514dec` by CI #434 / run `33163396509`, SUCCESS on Windows/macOS/Ubuntu.\n\nEvidence: `implementation/secret-mutation-qualification.md`.\n\nThe qualified boundary implements atomic Golam-owned create, immutable rotation/versioning, and monotonic revocation transitions with exact durable authorization/effect/ONCE-approval binding, encrypted-before-persist storage, authenticated security snapshots, stale-version/replay rejection, and rollback on vault/key-protection failure.\n\n### T003-053 — ACTIVE\n\nImplement `BrokerSecretUse` authorization around opaque handle, purpose, destination/process, lease/policy/approval and locality state.\n\nRequired boundaries:\n\n- resolve only an authenticated protected `SecretHandle`; never accept caller-constructed secret identity as authority;\n- require an active non-revoked secret/version and validate handle purpose/expiry/version constraint;\n- bind broker authorization to the authenticated principal, exact purpose, destination/process, active lease, current policy decision and required approval state;\n- strict-local and other hard denials remain dominant; broker binding cannot mint or widen egress/network authority;\n- record metadata-only `SecretUseRecord` evidence with handle/version/principal/purpose/destination/mode/approval/decision/global sequence and no plaintext;\n- keep plaintext decryption/application inside the trusted broker boundary only; do not expose a generic plaintext-return API;\n- do not implement the T003-054 unbrokerable argv/environment/process injection fallback early;\n- fail closed on stale handle, revoked/retired secret state, stale lease/policy/approval/decision, locality mismatch, integrity ambiguity or storage failure.\n\nAfter exact-head T003-053 qualification, continue directly to T003-054.'
              ),
              (
                  'T003_052=ACTIVE\nNEXT_TASK=T003-052',
                  'T003_052=PASS\nT003_052_QUALIFIED_HEAD=b70689c1e4836f1540541f45d66cdd5a3f514dec\nT003_052_CI_RUN=33163396509\nT003_053=ACTIVE\nNEXT_TASK=T003-053',
              ),
          ]
          for old, new in replacements:
              count = plan.count(old)
              if count != 1:
                  raise SystemExit(f'plan replacement expected once, got {count}: {old[:80]!r}')
              plan = plan.replace(old, new, 1)
          plan_path.write_text(plan)
          PY
          git rm .github/workflows/t003-052-advance-task-ledger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/003-identity-policy-secrets-sandbox/tasks.md specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md
          git commit -m "docs: qualify T003-052 and activate T003-053"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
