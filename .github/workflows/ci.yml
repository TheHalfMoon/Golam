name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile-evidence:
    name: lockfile-evidence-ubuntu
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Generate minimal admitted dependency lock update
        run: |
          git show d45ddcf47836f14183afd06e242c228f3d831e15:Cargo.lock > Cargo.lock
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo +1.98.0 check -p golamd
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          before = tomllib.loads(Path('/tmp/Cargo.lock.before').read_text())['package']
          after = tomllib.loads(Path('Cargo.lock').read_text())['package']

          def key(pkg):
              return (pkg['name'], pkg['version'], pkg.get('source'))

          before_map = {key(pkg): pkg for pkg in before}
          after_map = {key(pkg): pkg for pkg in after}

          expected_new = {
              ('adler2', '2.0.1', 'registry+https://github.com/rust-lang/crates.io-index'),
              ('miniz_oxide', '0.9.1', 'registry+https://github.com/rust-lang/crates.io-index'),
          }
          actual_new = set(after_map) - set(before_map)
          removed = set(before_map) - set(after_map)
          if actual_new != expected_new or removed:
              raise SystemExit(f'unexpected lock graph change: new={sorted(actual_new)} removed={sorted(removed)}')

          for package_key, old in before_map.items():
              new = after_map[package_key]
              if package_key[0] == 'golamd':
                  old_deps = set(old.get('dependencies', []))
                  new_deps = set(new.get('dependencies', []))
                  if new_deps != old_deps | {'adler2', 'miniz_oxide'}:
                      raise SystemExit(f'unexpected golamd dependency change: {sorted(new_deps - old_deps)}')
                  old_cmp = dict(old)
                  new_cmp = dict(new)
                  old_cmp['dependencies'] = sorted(old_deps)
                  new_cmp['dependencies'] = sorted(new_deps - {'adler2', 'miniz_oxide'})
                  if old_cmp != new_cmp:
                      raise SystemExit('unexpected non-dependency golamd lock change')
              elif old != new:
                  raise SystemExit(f'unexpected existing package mutation: {package_key}')

          adler = after_map[('adler2', '2.0.1', 'registry+https://github.com/rust-lang/crates.io-index')]
          if adler.get('checksum') != '320119579fcad9c21884f5c4861d16174d0e06250625266f50fe6898340abefa':
              raise SystemExit('adler2 checksum mismatch')
          if adler.get('dependencies'):
              raise SystemExit('adler2 selected closure unexpectedly has dependencies')

          miniz = after_map[('miniz_oxide', '0.9.1', 'registry+https://github.com/rust-lang/crates.io-index')]
          if miniz.get('checksum') != 'b63fbc4a50860e98e7b2aa7804ded1db5cbc3aff9193adaff57a6931bf7c4b4c':
              raise SystemExit('miniz_oxide checksum mismatch')
          if miniz.get('dependencies') != ['adler2']:
              raise SystemExit(f'unexpected miniz_oxide closure: {miniz.get("dependencies")}')

          print('MINIMAL_LOCK_CLOSURE=PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'fix(005): narrow admitted dependency lockfile'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  rust:
    name: rust-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.98.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +1.98.0 test --locked --workspace --all-targets
      - name: Property qualification
        run: |
          cargo +1.98.0 test --locked -p golam-effects --test qualification_properties
          cargo +1.98.0 test --locked -p golam-ledger --test qualification_properties
      - name: Bounded fuzz smoke
        run: |
          cargo +1.98.0 test --locked -p golam-ipc --test fuzz_smoke
          cargo +1.98.0 test --locked -p golam-ledger --test fuzz_smoke
          cargo +1.98.0 test --locked -p golam-kernel --test spec003_fuzz_smoke
      - name: IPC transport qualification (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo +1.98.0 test --locked -p golam-ipc unix_transport::
      - name: IPC transport qualification (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo +1.98.0 test --locked -p golam-ipc windows_transport::
      - name: Authenticated daemon IPC qualification
        run: |
          cargo +1.98.0 test --locked -p golamd --bin golamd connection::tests::
      - name: Adversarial authority qualification
        run: |
          cargo +1.98.0 test --locked -p golam-ipc --test adversarial
          cargo +1.98.0 test --locked -p golam-kernel --test hostile_adapter
          cargo +1.98.0 test --locked -p golam-kernel client_auth::tests::
      - name: Build daemon for external locality observation
        run: cargo +1.98.0 build --locked -p golamd --bin golamd
      - name: Strict-local external network observation (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/qualification/strict-local-no-network.sh target/debug/golamd
      - name: Strict-local external network observation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/qualification/strict-local-no-network.ps1 target/debug/golamd.exe
