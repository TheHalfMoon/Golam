name: ci

on:
  push:
    branches:
      - 'impl/005-local-tools-context-memory'

permissions:
  contents: write

jobs:
  repair-memory-commit-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Apply exact Clippy repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/golamd/src/memory_commit.rs')
          text = path.read_text()
          public = 'pub fn commit_existing_markdown(\n'
          if text.count(public) != 1:
              raise SystemExit(f'expected one public commit function, found {text.count(public)}')
          text = text.replace(
              public,
              '#[expect(clippy::too_many_arguments, reason = "commit primitive binds exact prepared target state")]\n' + public,
              1,
          )
          old = '#[allow(clippy::too_many_arguments)]\nfn commit_existing_with_hook<F>(\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one hook lint attribute, found {text.count(old)}')
          text = text.replace(
              old,
              '#[expect(clippy::too_many_arguments, reason = "test hook preserves the exact public commit binding")]\nfn commit_existing_with_hook<F>(\n',
              1,
          )
          path.write_text(text)
          PY
      - name: Format and qualify focused primitive
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golamd --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golamd --bin golamd memory_commit::tests::
      - name: Guard exact mutation and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/golamd/src/memory_commit.rs"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/memory_commit.rs
          git commit -m "fix(005): document bounded memory commit call surface"
          git push origin HEAD:impl/005-local-tools-context-memory
