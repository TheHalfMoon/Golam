name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repair-git-reader:
    name: repair-git-reader-ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Apply exact Clippy repairs and qualify before push
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/golamd/src/git_read.rs')
          text = path.read_text()
          old_import = 'use std::path::Path;\n'
          old_loop = 'for (index, pair) in value.as_bytes().chunks_exact(2).enumerate() {'
          new_loop = 'for (index, pair) in value.as_bytes().as_chunks::<2>().0.iter().enumerate() {'
          if text.count(old_import) != 1:
              raise SystemExit('expected exactly one unused Path import')
          if text.count(old_loop) != 1:
              raise SystemExit('expected exactly one chunks_exact object-id loop')
          text = text.replace(old_import, '', 1).replace(old_loop, new_loop, 1)
          path.write_text(text)
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 clippy --locked -p golamd --bin golamd -- -D warnings
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "crates/golamd/src/git_read.rs" ]; then
            printf 'unexpected repair mutation set:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/git_read.rs
          git commit -m "fix(005): satisfy pinned Clippy for Git reader"
          git push origin HEAD:impl/005-local-tools-context-memory
