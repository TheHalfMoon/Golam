name: ci

on:
  push:
    branches:
      - 'impl/005-local-tools-context-memory'

permissions:
  contents: write

jobs:
  repair-memory-unknown-outcome-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Move UNKNOWN_OUTCOME blocker before persistent dependent state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/golam-kernel/src/managed_memory_writer.rs')
          text = path.read_text()
          old = '''        validate_bindings(&self.memory, promotion, prepared, version, markdown_path)?;\n\n        let mut evidence = MemoryEvidenceStore::open(self.authority.authority_db_path())?;\n'''
          new = '''        validate_bindings(&self.memory, promotion, prepared, version, markdown_path)?;\n\n        // An unresolved prior UNKNOWN_OUTCOME blocks dependent managed-memory work\n        // before this effect can persist promotion or PREPARED state.\n        let mut operational = MemoryOperationalStore::open(&self.memory)?;\n        if operational.has_blocking_unknown_outcome()? {\n            return Err(ManagedMemoryWriterError::BlockingUnknownOutcome);\n        }\n\n        let mut evidence = MemoryEvidenceStore::open(self.authority.authority_db_path())?;\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one pre-persistence insertion point, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''        let mut operational = MemoryOperationalStore::open(&self.memory)?;\n        if operational.has_blocking_unknown_outcome()? {\n            return Err(ManagedMemoryWriterError::BlockingUnknownOutcome);\n        }\n        operational.record_prepared(prepared)?;\n'''
          new = '''        operational.record_prepared(prepared)?;\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale blocker block, found {text.count(old)}')
          path.write_text(text)
          PY
      - name: Format and qualify focused writer boundary
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golam-kernel --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golam-kernel managed_memory_writer::tests::
      - name: Guard exact source mutation and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/golam-kernel/src/managed_memory_writer.rs"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golam-kernel/src/managed_memory_writer.rs
          git commit -m "fix(005): block dependent memory writes before PREPARED"
          git push origin HEAD:impl/005-local-tools-context-memory
