name: ci

on:
  push:
    branches:
      - 'impl/005-local-tools-context-memory'

permissions:
  contents: write

jobs:
  bind-managed-memory-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Bind Markdown commit to kernel-issued prepared token
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/golamd/src/memory_commit.rs')
          text = path.read_text()
          old = 'use golam_core::{CanonicalEncoder, CoreError, EffectId};\n'
          new = '''use golam_core::{CanonicalEncoder, CoreError, EffectId};\nuse golam_kernel::{ManagedMarkdownCommitObservation, PreparedManagedMemoryWrite};\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one kernel import insertion point, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '    TargetIdentityMismatch,\n    ContentDigestMismatch,\n'
          new = '    TargetIdentityMismatch,\n    PreparedPathMismatch,\n    ContentDigestMismatch,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one error insertion point, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            Self::TargetIdentityMismatch => {\n                f.write_str("managed Markdown target identity no longer matches PREPARED authority")\n            }\n            Self::ContentDigestMismatch => {\n'''
          new = '''            Self::TargetIdentityMismatch => {\n                f.write_str("managed Markdown target identity no longer matches PREPARED authority")\n            }\n            Self::PreparedPathMismatch => {\n                f.write_str("managed Markdown target path does not match the kernel-issued prepared writer token")\n            }\n            Self::ContentDigestMismatch => {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one display insertion point, found {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = '''#[expect(\n    clippy::too_many_arguments,\n    reason = "commit primitive binds exact prepared target state"\n)]\npub fn commit_existing_markdown(\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one raw commit marker, found {text.count(marker)}')
          wrapper = '''pub fn commit_prepared_existing_markdown(\n    resolver: &LocalFsResolver,\n    requested: &RequestedTarget,\n    layout: &MemoryLayout,\n    prepared: &PreparedManagedMemoryWrite,\n    new_bytes: &[u8],\n    observed_at_unix_ms: u64,\n) -> Result<ManagedMarkdownCommitObservation, MemoryCommitError> {\n    let operation = RequestedOperationId::new("memory.write")\n        .map_err(|_| MemoryCommitError::TargetIdentityMismatch)?;\n    let resolved = resolver.resolve_read_target(requested, &operation, observed_at_unix_ms)?;\n    if Path::new(resolved.normalized_path.as_str()) != prepared.markdown_path() {\n        return Err(MemoryCommitError::PreparedPathMismatch);\n    }\n    let receipt = commit_existing_markdown(\n        resolver,\n        requested,\n        layout,\n        prepared.effect_id(),\n        prepared.expected_target_identity_ref(),\n        prepared.expected_content_digest(),\n        new_bytes,\n        observed_at_unix_ms,\n    )?;\n    Ok(ManagedMarkdownCommitObservation {\n        readback_ref: receipt.readback_ref,\n        target_identity_ref: receipt.target_identity_ref,\n        content_digest: receipt.content_digest,\n    })\n}\n\n#[expect(\n    clippy::too_many_arguments,\n    reason = "private commit primitive binds exact prepared target state"\n)]\nfn commit_existing_markdown(\n'''
          text = text.replace(marker, wrapper, 1)
          path.write_text(text)
          PY
      - name: Format and qualify
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golamd --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golamd --bin golamd memory_commit::tests::
      - name: Guard exact source mutation and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/golamd/src/memory_commit.rs"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/memory_commit.rs
          git commit -m "fix(005): bind Markdown commit to prepared writer token"
          git push origin HEAD:impl/005-local-tools-context-memory
