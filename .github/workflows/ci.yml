name: ci

on:
  push:
    branches:
      - 'impl/005-local-tools-context-memory'

permissions:
  contents: write

jobs:
  qualify-managed-memory-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Repair and register privileged managed-memory writer
        run: |
          python - <<'PY'
          from pathlib import Path

          writer = Path('crates/golam-kernel/src/managed_memory_writer.rs')
          text = writer.read_text()
          for name in ['effect_id', 'expected_target_identity_ref', 'expected_content_digest']:
              old = f'    pub const fn {name}('
              new = f'    pub fn {name}('
              if text.count(old) != 1:
                  raise SystemExit(f'expected one const accessor {name}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          writer.write_text(text)

          path = Path('crates/golam-kernel/src/lib.rs')
          text = path.read_text()
          old = 'mod effect_execution;\nmod operations;\n'
          new = 'mod effect_execution;\nmod managed_memory_writer;\nmod operations;\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one module insertion point, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = 'pub use effect_execution::PreparedEffectDispatch;\n'
          new = '''pub use effect_execution::PreparedEffectDispatch;\npub use managed_memory_writer::{\n    CommittedManagedMemoryWrite, ManagedMarkdownCommitObservation, ManagedMemoryExecutionFinish,\n    ManagedMemoryExecutionStart, ManagedMemoryWriter, ManagedMemoryWriterError,\n    PreparedManagedMemoryWrite,\n};\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one re-export insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and qualify
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golam-kernel --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golam-kernel managed_writer_identity_is_stable_and_distinct
      - name: Guard source mutation and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "crates/golam-kernel/src/lib.rs"
          test "${changed[1]}" = "crates/golam-kernel/src/managed_memory_writer.rs"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golam-kernel/src/lib.rs crates/golam-kernel/src/managed_memory_writer.rs
          git commit -m "fix(005): register privileged managed memory writer"
          git push origin HEAD:impl/005-local-tools-context-memory
