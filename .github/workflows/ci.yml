name: ci

on:
  push:
    branches:
      - 'impl/005-local-tools-context-memory'

permissions:
  contents: write

jobs:
  repair-memory-promotion-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Format with pinned toolchain
        run: cargo +1.98.0 fmt --all
      - name: Clippy validator
        run: cargo +1.98.0 clippy --locked -p golam-ledger --all-targets -- -D warnings
      - name: Focused validator tests
        run: cargo +1.98.0 test --locked -p golam-ledger --lib memory_promotion_authority::tests::
      - name: Guard exact mutation and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/golam-ledger/src/memory_promotion_authority.rs"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golam-ledger/src/memory_promotion_authority.rs
          git commit -m "style(005): format memory promotion authority validator"
          git push origin HEAD:impl/005-local-tools-context-memory
