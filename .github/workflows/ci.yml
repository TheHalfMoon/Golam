name: ci

on:
  push:
    branches:
      - 'impl/005-local-tools-context-memory'

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Reconcile lockfile from existing manifests
        run: cargo +1.98.0 check -p golamd --all-targets
      - name: Guard Cargo.lock-only mutation and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "Cargo.lock"
          git diff --check
          git diff -- Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(005): reconcile daemon memory ledger lockfile"
          git push origin HEAD:impl/005-local-tools-context-memory
