name: ci

on:
  push:
    branches:
      - 'impl/005-local-tools-context-memory'

permissions:
  contents: write

jobs:
  repair-memory-windows-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Apply exact cleanup repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          operational = Path('crates/golam-ledger/src/memory_operational_store.rs')
          text = operational.read_text()
          function = '    fn store_binds_exact_layout_identity_and_never_authority_db() {'
          start = text.find(function)
          if start < 0:
              raise SystemExit('operational test anchor missing')
          end = text.find('\n    #[test]\n', start + len(function))
          if end < 0:
              raise SystemExit('operational test end anchor missing')
          block = text[start:end]
          cleanup = '        fs::remove_dir_all(runtime.root).unwrap();\n'
          if block.count(cleanup) != 1 or '        drop(store);\n' in block:
              raise SystemExit('operational cleanup anchor mismatch')
          block = block.replace(cleanup, '        drop(store);\n' + cleanup, 1)
          operational.write_text(text[:start] + block + text[end:])

          promotion = Path('crates/golam-ledger/src/memory_promotion_operational.rs')
          text = promotion.read_text()
          cleanup = '        fs::remove_dir_all(runtime.root).unwrap();\n'
          if text.count(cleanup) != 3:
              raise SystemExit(f'promotion cleanup match count={text.count(cleanup)}')
          if '        drop(_operational);\n' in text:
              raise SystemExit('promotion cleanup already repaired unexpectedly')
          promotion.write_text(text.replace(
              cleanup,
              '        drop(store);\n        drop(_operational);\n' + cleanup,
          ))
          PY
      - name: Format
        run: cargo +1.98.0 fmt --all
      - name: Clippy
        run: cargo +1.98.0 clippy --locked -p golam-ledger --lib -- -D warnings
      - name: Focused memory tests
        run: |
          cargo +1.98.0 test --locked -p golam-ledger --lib memory_operational::tests::
          cargo +1.98.0 test --locked -p golam-ledger --lib memory_promotion_operational::tests::
      - name: Guard exact mutation and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            crates/golam-ledger/src/memory_operational_store.rs
            crates/golam-ledger/src/memory_promotion_operational.rs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!changed[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golam-ledger/src/memory_operational_store.rs crates/golam-ledger/src/memory_promotion_operational.rs
          git commit -m "test(005): close Windows SQLite handles before cleanup"
          git push origin HEAD:impl/005-local-tools-context-memory
