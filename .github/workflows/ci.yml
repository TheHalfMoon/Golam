name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repair-packed-ref-fixture:
    name: repair-packed-ref-fixture-ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply exact fixture repair and qualify before push
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/golamd/src/git_read.rs')
          text = path.read_text()
          old = '''    fn packed_ref_is_used_only_when_loose_ref_is_absent() {
              let root = fixture_root();
              fs::create_dir_all(root.join(".git/objects")).unwrap();
              fs::write(root.join(".git/HEAD"), b"ref: refs/heads/main\\n").unwrap();
          '''
          new = '''    fn packed_ref_is_used_only_when_loose_ref_is_absent() {
              let root = fixture_root();
              fs::create_dir_all(root.join(".git/objects")).unwrap();
              fs::create_dir_all(root.join(".git/refs")).unwrap();
              fs::write(root.join(".git/HEAD"), b"ref: refs/heads/main\\n").unwrap();
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one packed-ref fixture block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test --locked -p golamd --bin golamd git_read::tests::packed_ref_is_used_only_when_loose_ref_is_absent
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "crates/golamd/src/git_read.rs" ]; then
            printf 'unexpected repair mutation set:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/git_read.rs
          git commit -m "test(005): make packed-ref fallback fixture structurally valid"
          git push origin HEAD:impl/005-local-tools-context-memory
