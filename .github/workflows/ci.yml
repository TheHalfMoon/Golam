name: ci

on:
  push:
    branches:
      - 'impl/005-local-tools-context-memory'

permissions:
  contents: write

jobs:
  repair-daemon-ledger-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Gate Unix-only test import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/golamd/src/memory_commit.rs')
          text = path.read_text()
          old = '    use golam_core::memory_storage::MemoryVaultScope;\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one MemoryVaultScope test import, found {text.count(old)}')
          text = text.replace(old, '    #[cfg(unix)]\n    use golam_core::memory_storage::MemoryVaultScope;\n', 1)
          path.write_text(text)
          PY
      - name: Reconcile lockfile and qualify boundary
        run: |
          cargo +1.98.0 check -p golamd --all-targets
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golam-kernel --lib unprivileged_workspace_crates_do_not_link_the_ledger_directly
          cargo +1.98.0 test --locked -p golamd --bin golamd memory_commit::tests::
      - name: Guard exact mutation and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -ge 1
          test "${#changed[@]}" -le 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'crates/golamd/src/memory_commit.rs'
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.lock|crates/golamd/src/memory_commit.rs) ;;
              *) echo "unexpected mutation: $path"; exit 1 ;;
            esac
          done
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/memory_commit.rs Cargo.lock
          git commit -m "fix(005): restore daemon privilege boundary"
          git push origin HEAD:impl/005-local-tools-context-memory
