name: ci

on:
  push:
    branches:
      - 'impl/005-local-tools-context-memory'

permissions:
  contents: write

jobs:
  format-memory-operational-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format with pinned toolchain
        run: cargo +1.98.0 fmt --all
      - name: Guard exact mutation and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -eq 0 ]; then
            exit 0
          fi
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/golam-ledger/src/memory_operational_store.rs"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golam-ledger/src/memory_operational_store.rs
          git commit -m "style(005): format managed memory operational store"
          git push origin HEAD:impl/005-local-tools-context-memory
