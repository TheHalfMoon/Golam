name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repair-git-reader-fixtures:
    name: repair-git-reader-fixtures-ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Bind fixture helpers to the exact qualified platforms
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/golamd/src/git_read.rs')
          text = path.read_text()
          old = '''    use golam_core::tool_request::ResourceClassId;\n    use std::fs;\n    use std::path::PathBuf;\n    use std::sync::atomic::{AtomicU64, Ordering};\n\n    static NEXT_TEMP: AtomicU64 = AtomicU64::new(1);\n'''
          new = '''    #[cfg(any(\n        target_os = "linux",\n        target_os = "android",\n        target_os = "macos",\n        target_os = "ios",\n        target_os = "freebsd"\n    ))]\n    use {\n        golam_core::tool_request::ResourceClassId,\n        std::fs,\n        std::path::PathBuf,\n        std::sync::atomic::{AtomicU64, Ordering},\n    };\n\n    #[cfg(any(\n        target_os = "linux",\n        target_os = "android",\n        target_os = "macos",\n        target_os = "ios",\n        target_os = "freebsd"\n    ))]\n    static NEXT_TEMP: AtomicU64 = AtomicU64::new(1);\n'''
          fixture = '    fn fixture_root() -> PathBuf {'
          fixture_new = '''    #[cfg(any(\n        target_os = "linux",\n        target_os = "android",\n        target_os = "macos",\n        target_os = "ios",\n        target_os = "freebsd"\n    ))]\n    fn fixture_root() -> PathBuf {'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one fixture import/static block')
          if text.count(fixture) != 1:
              raise SystemExit('expected exactly one fixture_root function')
          path.write_text(text.replace(old, new, 1).replace(fixture, fixture_new, 1))
          PY
          cargo +1.98.0 fmt --all
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "crates/golamd/src/git_read.rs" ]; then
            printf 'unexpected fixture repair mutation set:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/git_read.rs
          git commit -m "fix(005): gate Git reader fixtures by platform"
          git push origin HEAD:impl/005-local-tools-context-memory
