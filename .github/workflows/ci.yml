name: ci

on:
  push:
    branches:
      - 'impl/005-local-tools-context-memory'

permissions:
  contents: write

jobs:
  repair-git-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Apply bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/qualification/repair-t005-040-git-observation.py')
          text = path.read_text()
          old = '''replace_once(
              pack,
              ''' + "'''" + '''                let body = apply_delta(&base.bytes, &delta, bounds.max_object_bytes)?;\n                (base.kind, body)\n''' + "'''" + ''',
              ''' + "'''" + '''                let body = deadline\n                    .run_step(|| apply_delta(&base.bytes, &delta, bounds.max_object_bytes))??;\n                (base.kind, body)\n''' + "'''" + ''',
          )
          # The REF_DELTA branch has the same body after the first replacement; patch the remaining copy.
          replace_once(
              pack,
              ''' + "'''" + '''                let body = apply_delta(&base.bytes, &delta, bounds.max_object_bytes)?;\n                (base.kind, body)\n''' + "'''" + ''',
              ''' + "'''" + '''                let body = deadline\n                    .run_step(|| apply_delta(&base.bytes, &delta, bounds.max_object_bytes))??;\n                (base.kind, body)\n''' + "'''" + ''',
          )'''
          new = '''text = pack.read_text()
          old = ''' + "'''" + '''                let body = apply_delta(&base.bytes, &delta, bounds.max_object_bytes)?;\n                (base.kind, body)\n''' + "'''" + '''
          if text.count(old) != 2:
              raise SystemExit(f"{pack}: expected two delta apply bodies, found {text.count(old)}")
          text = text.replace(old, ''' + "'''" + '''                let body = deadline\n                    .run_step(|| apply_delta(&base.bytes, &delta, bounds.max_object_bytes))??;\n                (base.kind, body)\n''' + "'''" + ''')
          pack.write_text(text)'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one script repair block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python scripts/qualification/repair-t005-040-git-observation.py
      - name: Format
        run: cargo +1.98.0 fmt --all
      - name: Clippy
        run: cargo +1.98.0 clippy --locked -p golamd --all-targets -- -D warnings
      - name: Focused tests
        run: |
          cargo +1.98.0 test --locked -p golamd --bin golamd local_dir::tests::
          cargo +1.98.0 test --locked -p golamd --bin golamd git_read_budget::tests::
          cargo +1.98.0 test --locked -p golamd --bin golamd git_pack::tests::
          cargo +1.98.0 test --locked -p golamd --bin golamd git_observe::tests::
      - name: Guard mutation set and push
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/qualification/repair-t005-040-git-observation.py
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            crates/golamd/src/git_observe.rs
            crates/golamd/src/git_pack.rs
            crates/golamd/src/git_read.rs
            crates/golamd/src/local_dir.rs
            crates/golamd/src/main.rs
            scripts/qualification/repair-t005-040-git-observation.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!changed[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/main.rs crates/golamd/src/local_dir.rs crates/golamd/src/git_read.rs crates/golamd/src/git_pack.rs crates/golamd/src/git_observe.rs
          git commit -m "fix(005): close Git observation deadline and directory races"
          git push origin HEAD:impl/005-local-tools-context-memory
