name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repair-git-pack-clippy:
    name: repair-git-pack-clippy-ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Apply exact Clippy repairs, qualify, and push
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/golamd/src/git_pack.rs')
          text = path.read_text()
          replacements = [
              ('.zip(crcs.into_iter())', '.zip(crcs)'),
              ('.zip(raw_offsets.into_iter())', '.zip(raw_offsets)'),
              ('remaining.min(DECOMPRESSION_OUTPUT_QUANTUM_BYTES).max(1)', 'remaining.clamp(1, DECOMPRESSION_OUTPUT_QUANTUM_BYTES)'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golamd --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golamd --bin golamd git_pack::tests::
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "crates/golamd/src/git_pack.rs" ]; then
            printf 'unexpected repair mutation set:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/git_pack.rs
          git commit -m "fix(005): satisfy pinned Clippy for Git pack primitive"
          git push origin HEAD:impl/005-local-tools-context-memory
