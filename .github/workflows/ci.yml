name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repair-index-clippy:
    name: repair-index-clippy-ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Apply exact test-only Clippy repairs and qualify
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/golamd/src/git_index.rs')
          text = path.read_text()
          replacements = {
              '''        let mut bounds = GitIndexBounds::default();\n        bounds.max_path_bytes = 2;\n''': '''        let bounds = GitIndexBounds {\n            max_path_bytes: 2,\n            ..GitIndexBounds::default()\n        };\n''',
              '''        let mut bounds = GitIndexBounds::default();\n        bounds.max_extensions = 1;\n''': '''        let bounds = GitIndexBounds {\n            max_extensions: 1,\n            ..GitIndexBounds::default()\n        };\n''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one Clippy repair target: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 clippy --locked -p golamd --bin golamd --tests -- -D warnings
          cargo +1.98.0 test --locked -p golamd --bin golamd git_index::tests::
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "crates/golamd/src/git_index.rs" ]; then
            printf 'unexpected repair mutation set:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/git_index.rs
          git commit -m "fix(005): satisfy pinned Clippy for Git index tests"
          git push origin HEAD:impl/005-local-tools-context-memory
