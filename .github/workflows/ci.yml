name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repair-git-status:
    name: repair-git-status-ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Normalize, qualify, and push exact status slice
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("crates/golamd/src/git_status.rs"); s=p.read_text(); old="                ObservedFileKind::Directory => {\n                    if !tracked.iter().any(|tracked_path| {\n                        *tracked_path == path || tracked_path.starts_with(&(path.clone() + \"/\"))\n                    }) {\n                        pending.push_back((path, identity, depth + 1));\n                    } else {\n                        pending.push_back((path, identity, depth + 1));\n                    }\n                }\n"; new="                ObservedFileKind::Directory => {\n                    pending.push_back((path, identity, depth + 1));\n                }\n"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golamd --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golamd --bin golamd git_status::tests::
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "crates/golamd/src/git_status.rs" ]; then
            printf 'unexpected repair mutation set:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/git_status.rs
          git commit -m "fix(005): qualify bounded Git status observation"
          git push origin HEAD:impl/005-local-tools-context-memory
