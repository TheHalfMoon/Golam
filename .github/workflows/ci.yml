name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format-apply:
    name: format-apply-ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply exact bounded formatting mutation
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "crates/golamd/src/git_read.rs" ]; then
            printf 'unexpected rustfmt mutation set:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/git_read.rs
          git commit -m "style(005): apply pinned rustfmt to Git reader"
          git push origin HEAD:impl/005-local-tools-context-memory
