name: ci

on:
  push:
    branches:
      - 'impl/005-local-tools-context-memory'

permissions:
  contents: write

jobs:
  repair-memory-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Apply exact schema repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          storage = Path('crates/golam-core/src/memory_storage.rs')
          text = storage.read_text()
          old = 'pub const MEMORY_OPERATIONAL_SCHEMA_VERSION: u16 = 1;'
          if text.count(old) != 1:
              raise SystemExit('memory schema version anchor mismatch')
          storage.write_text(text.replace(old, 'pub const MEMORY_OPERATIONAL_SCHEMA_VERSION: u16 = 2;', 1))

          operational = Path('crates/golam-ledger/src/memory_operational_store.rs')
          text = operational.read_text()
          table_anchor = '    "memory_reconciliation_state",\n    "memory_derivative_generations",\n'
          if text.count(table_anchor) != 1:
              raise SystemExit('required-table anchor mismatch')
          text = text.replace(
              table_anchor,
              '    "memory_reconciliation_state",\n    "memory_promotion_state",\n    "memory_derivative_generations",\n',
              1,
          )
          sql_anchor = '''        CREATE TABLE IF NOT EXISTS memory_derivative_generations (\n'''
          if text.count(sql_anchor) != 1:
              raise SystemExit('promotion schema insertion anchor mismatch')
          promotion_sql = '''        CREATE TABLE IF NOT EXISTS memory_promotion_state (\n            evidence_id BLOB PRIMARY KEY NOT NULL CHECK (length(evidence_id) = 32),\n            store_ref BLOB NOT NULL CHECK (length(store_ref) = 32),\n            schema_ref BLOB NOT NULL CHECK (length(schema_ref) = 32),\n            candidate_id BLOB NOT NULL CHECK (length(candidate_id) = 32),\n            promotion_authority_ref BLOB NOT NULL CHECK (length(promotion_authority_ref) = 32),\n            approving_principal TEXT,\n            verifier_policy_ref BLOB CHECK (verifier_policy_ref IS NULL OR length(verifier_policy_ref) = 32),\n            authority_evidence_ref BLOB NOT NULL CHECK (length(authority_evidence_ref) = 32),\n            recorded_at_unix_ms INTEGER NOT NULL,\n            integrity_hash BLOB NOT NULL CHECK (length(integrity_hash) = 32),\n            CHECK ((approving_principal IS NULL) != (verifier_policy_ref IS NULL))\n        );\n'''
          operational.write_text(text.replace(sql_anchor, promotion_sql + sql_anchor, 1))

          promotion = Path('crates/golam-ledger/src/memory_promotion_operational.rs')
          text = promotion.read_text()
          start = text.find('        connection.execute_batch(\n            r#"\n            CREATE TABLE IF NOT EXISTS memory_promotion_state (')
          if start < 0:
              raise SystemExit('side-created promotion table block start missing')
          end_marker = '        )?;\n        Ok(Self {'
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('side-created promotion table block end missing')
          replacement = '''        let table_exists = connection\n            .query_row(\n                "SELECT 1 FROM sqlite_schema WHERE type = 'table' AND name = 'memory_promotion_state' LIMIT 1",\n                [],\n                |row| row.get::<_, i64>(0),\n            )\n            .optional()?\n            .is_some();\n        if !table_exists {\n            return Err(MemoryPromotionOperationalError::InvalidRecord(\n                "memory promotion operational table is missing from the bound schema",\n            ));\n        }\n'''
          promotion.write_text(text[:start] + replacement + text[end + len('        )?;\n'):])
          PY
      - name: Format
        run: cargo +1.98.0 fmt --all
      - name: Clippy
        run: |
          cargo +1.98.0 clippy --locked -p golam-core --all-targets -- -D warnings
          cargo +1.98.0 clippy --locked -p golam-ledger --all-targets -- -D warnings
      - name: Focused memory schema tests
        run: |
          cargo +1.98.0 test --locked -p golam-core memory_storage::tests::
          cargo +1.98.0 test --locked -p golam-ledger --lib memory_operational::tests::
          cargo +1.98.0 test --locked -p golam-ledger --lib memory_promotion_operational::tests::
      - name: Guard exact mutation and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            crates/golam-core/src/memory_storage.rs
            crates/golam-ledger/src/memory_operational_store.rs
            crates/golam-ledger/src/memory_promotion_operational.rs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!changed[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golam-core/src/memory_storage.rs crates/golam-ledger/src/memory_operational_store.rs crates/golam-ledger/src/memory_promotion_operational.rs
          git commit -m "fix(005): bind promotion table into managed memory schema"
          git push origin HEAD:impl/005-local-tools-context-memory
