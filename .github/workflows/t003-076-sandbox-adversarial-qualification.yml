name: t003-076-sandbox-adversarial-qualification
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned qualification dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Apply T003-076 bounded repairs and tests
        run: python3 scripts/qualification/prepare-t003-076.py
      - name: Apply pinned formatting
        run: cargo +1.98.0 fmt --all
      - name: Run focused sandbox adversarial qualification
        run: |
          cargo +1.98.0 test -p golam-ledger sandbox_enforcement::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger sandbox_executor::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger sandbox_native_qualification:: -- --nocapture
          cargo +1.98.0 clippy -p golam-ledger --all-targets -- -D warnings
      - name: Re-run bounded native OS containment harness
        run: bash scripts/qualification/t003-074-native-executor.sh
      - name: Commit clean T003-076 implementation candidate
        run: |
          git rm .github/workflows/t003-076-sandbox-adversarial-qualification.yml
          git rm scripts/qualification/prepare-t003-076.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/sandbox_executor.rs
          git add crates/golam-ledger/src/sandbox_enforcement.rs
          git commit -m 'test: harden sandbox deny-all capability enforcement'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
