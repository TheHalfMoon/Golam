name: t003-057-record-qualification
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Record T003-057 qualification and activate Phase G
        shell: python
        run: |
          from pathlib import Path

          qualified_head = '3621b502854fd46d7b45b28f7e8d0ca071b08b68'
          qualified_tree = 'b56a05588c6c66fb21315b4c2b40dd87ec177ef9'
          ci_number = '495'
          ci_run = '33195054055'

          evidence = f'''# T003-057 Secret Fault Qualification

**Status**: PASS  
**Qualified implementation head**: `{qualified_head}`  
**Qualified tree**: `{qualified_tree}`  
**Official qualification**: CI #{ci_number} / run `{ci_run}` — SUCCESS on Windows, macOS, and Ubuntu.

## Qualified boundary

T003-057 exercises the existing secret mutation transaction path rather than introducing a parallel mutation implementation.

The qualified tests prove:

- test-only pre-commit pause injection is attached to the real create, rotate, and revoke transaction sequence immediately before SQLite commit;
- OS process termination before rotation commit leaves the prior version current, unretired, and uniquely durable after restart;
- OS process termination before revocation commit leaves the secret active after restart;
- failed or killed transitions do not consume the associated one-shot approval and do not acknowledge success;
- bounded SQLite storage using `PRAGMA max_page_count` forces `SQLITE_FULL` during rotation and revocation mutation paths and rolls back every coupled protected mutation;
- disk-full rotation preserves the previous current version, retirement state, version count, and approval authority;
- disk-full revocation rolls back secret status/revocation metadata, authenticated authority-security snapshot work, and approval consumption;
- `integrity` and `authority-security-v2` verification succeed after the injected failures;
- fresh committed rotation/revocation transitions are the only paths that change durable current/revoked authority.

## Focused execution evidence

The original T003-057 staging workflow at `2dcfad4397b9e9df8b787a64c7fbcc437a9d9422` was not valid qualification evidence: run `33169758223` failed before jobs were created because the temporary YAML was malformed.

A repaired recovery path executed the intended focused `golam-ledger` secret-mutation suite successfully and self-deleted its temporary workflows. A subsequent bounded revocation disk-full qualification run `33194883344` also completed successfully and self-deleted its helper workflow. These runs are implementation evidence only; neither is used as the task PASS authority.

The normal user-authored clean head `{qualified_head}` contains no T003-057 helper workflow. Official `ci.yml` run `{ci_run}` then completed successfully on all three supported CI platforms at that exact head.

## Security dispositions

- No real secret values were used.
- Deterministic test values remain test-only.
- No plaintext secret read API or alternate mutation path was introduced.
- No force-push, rebase, destructive history rewrite, or governance bypass was used.

```text
T003_057=PASS
T003_057_QUALIFIED_HEAD={qualified_head}
T003_057_CI_RUN={ci_run}
PHASE_F_COMPLETE=YES
NEXT_TASK=T003-060
REAL_SECRETS_USED=NO
```
'''
          evidence_path = Path('specs/003-identity-policy-secrets-sandbox/implementation/secret-fault-qualification.md')
          if evidence_path.exists():
              raise SystemExit('T003-057 evidence path already exists')
          evidence_path.write_text(evidence)

          tasks_path = Path('specs/003-identity-policy-secrets-sandbox/tasks.md')
          tasks = tasks_path.read_text()
          replacements = {
              '**Status**: IMPLEMENTATION_ACTIVE — PHASE_B_COMPLETE — PHASE_C_COMPLETE — PHASE_D_COMPLETE — PHASE_E_COMPLETE — PHASE_F_ACTIVE': '**Status**: IMPLEMENTATION_ACTIVE — PHASE_B_COMPLETE — PHASE_C_COMPLETE — PHASE_D_COMPLETE — PHASE_E_COMPLETE — PHASE_F_COMPLETE — PHASE_G_ACTIVE',
              '- [ ] **T003-057** ACTIVE — Add crash/disk-full/rotation/revocation tests and prove no acknowledged half-transition exposes stale secret authority.': '- [x] **T003-057** Add crash/disk-full/rotation/revocation tests and prove no acknowledged half-transition exposes stale secret authority. Exact-head qualification: CI #495 (`33195054055`) SUCCESS at `3621b502854fd46d7b45b28f7e8d0ca071b08b68` on Windows/macOS/Ubuntu. Evidence: `implementation/secret-fault-qualification.md`.',
              'PHASE_F_ACTIVE=YES': 'PHASE_F_COMPLETE=YES\nPHASE_G_ACTIVE=YES',
              'T003_057=ACTIVE': 'T003_057=PASS\nT003_057_QUALIFIED_HEAD=3621b502854fd46d7b45b28f7e8d0ca071b08b68\nT003_057_CI_RUN=33195054055',
              'NEXT_TASK=T003-057': 'NEXT_TASK=T003-060',
          }
          for old, new in replacements.items():
              count = tasks.count(old)
              if count != 1:
                  raise SystemExit(f'tasks replacement count for {old!r}: {count}')
              tasks = tasks.replace(old, new, 1)
          tasks_path.write_text(tasks)

          plan_path = Path('specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md')
          plan = plan_path.read_text()
          replacements = {
              '**Status**: IMPLEMENTATION_ACTIVE — PHASE_F_ACTIVE': '**Status**: IMPLEMENTATION_ACTIVE — PHASE_F_COMPLETE — PHASE_G_ACTIVE',
              '**Current task**: `T003-057`': '**Current task**: `T003-060`',
              '## Phase F — Secret vault and broker\n\n`ACTIVE`': '## Phase F — Secret vault and broker\n\n`COMPLETE`',
              '### T003-057 — ACTIVE\n\nAdd crash/disk-full/rotation/revocation qualification and prove no acknowledged half-transition exposes stale secret authority.': '### T003-057 — COMPLETE\n\nQualified at exact implementation head `3621b502854fd46d7b45b28f7e8d0ca071b08b68` by CI #495 / run `33195054055`, SUCCESS on Windows/macOS/Ubuntu.\n\nEvidence: `implementation/secret-fault-qualification.md`.\n\nThe qualified suite uses the real secret mutation transaction path with test-only pre-commit pause injection, OS process termination before rotation/revocation commit, bounded SQLite `SQLITE_FULL` rotation/revocation faults, approval-consumption rollback checks, restart verification, and successful-commit controls. Only fully committed transitions change durable secret authority.',
              'After exact-head T003-057 qualification, close Phase F and continue directly to T003-060.': 'Phase F is closed at the task-qualified head above. Phase G is active at T003-060.',
              'PHASE_F_ACTIVE=YES': 'PHASE_F_COMPLETE=YES\nPHASE_G_ACTIVE=YES',
              'T003_057=ACTIVE': 'T003_057=PASS\nT003_057_QUALIFIED_HEAD=3621b502854fd46d7b45b28f7e8d0ca071b08b68\nT003_057_CI_RUN=33195054055',
              'NEXT_TASK=T003-057': 'NEXT_TASK=T003-060',
          }
          for old, new in replacements.items():
              count = plan.count(old)
              if count != 1:
                  raise SystemExit(f'plan replacement count for {old!r}: {count}')
              plan = plan.replace(old, new, 1)
          plan_path.write_text(plan)
      - name: Commit qualification record
        run: |
          git rm .github/workflows/t003-057-record-qualification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/003-identity-policy-secrets-sandbox/tasks.md
          git add specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md
          git add specs/003-identity-policy-secrets-sandbox/implementation/secret-fault-qualification.md
          git commit -m 'docs: record T003-057 qualification'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
