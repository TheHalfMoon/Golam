name: spec005-h-mcp-protocol-relay

on:
  push:
    branches:
      - impl/005-local-tools-context-memory
    paths:
      - .github/workflows/spec005-h-mcp-protocol-relay.yml

permissions:
  contents: write

jobs:
  qualify-and-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Snapshot exact external dependency closure
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 metadata --locked --format-version 1 > /tmp/spec005-cargo-metadata-before.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('/tmp/spec005-cargo-metadata-before.json').read_text())
          external = sorted(
              [p['name'], p['version'], p.get('source'), p.get('checksum')]
              for p in metadata['packages']
              if p.get('source') is not None
          )
          Path('/tmp/spec005-external-lock.json').write_text(json.dumps(external, separators=(',', ':')))
          PY
      - name: Apply and qualify bounded MCP normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qualification/spec005_h_mcp_protocol_repair.py
          cargo +1.98.0 check -p golamd
          cargo +1.98.0 metadata --locked --format-version 1 > /tmp/spec005-cargo-metadata-after.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/spec005-external-lock.json').read_text())
          metadata = json.loads(Path('/tmp/spec005-cargo-metadata-after.json').read_text())
          after = sorted(
              [p['name'], p['version'], p.get('source'), p.get('checksum')]
              for p in metadata['packages']
              if p.get('source') is not None
          )
          if before != after:
              raise SystemExit('external Cargo package/version/source/checksum closure changed')
          matches = [p for p in metadata['packages'] if p['name'] == 'serde_json' and p['version'] == '1.0.151']
          if len(matches) != 1:
              raise SystemExit('expected exact serde_json 1.0.151 metadata package')
          serde_json = matches[0]
          if serde_json.get('checksum') != 'c841b55ecdae098c80dcae9cf767f6f8a0c2cdb3416bbef72181df4d0fe73f14':
              raise SystemExit('serde_json checksum drift')
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked -p golam-core -p golamd --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p golam-core skills_protocol::
          cargo +1.98.0 test --locked -p golamd mcp_protocol::
          cargo +1.98.0 test --locked -p golamd --lib
      - name: Commit exact qualified T005-089 unit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin impl/005-local-tools-context-memory
          test "$(git rev-parse origin/impl/005-local-tools-context-memory)" = "$GITHUB_SHA"
          git rm .github/workflows/spec005-h-mcp-protocol-relay.yml scripts/qualification/spec005_h_mcp_protocol_repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock crates/golamd/Cargo.toml crates/golamd/src/lib.rs crates/golamd/src/mcp_protocol.rs
          git commit -m 'feat(005): normalize reviewed MCP advertisements'
          git push origin HEAD:impl/005-local-tools-context-memory
