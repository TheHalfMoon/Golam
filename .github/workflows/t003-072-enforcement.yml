name: t003-072-enforcement
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Wire T003-072 module
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/golam-ledger/src/lib.rs')
          text = path.read_text()
          old = 'pub mod run_preauthorization;\npub mod sandbox_plan;'
          new = 'pub mod run_preauthorization;\npub mod sandbox_enforcement;\npub mod sandbox_plan;'
          if text.count(old) != 1:
              raise SystemExit(f'module anchor count {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Focused T003-072 qualification
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p golam-ledger sandbox_enforcement::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger sandbox_plan::tests:: -- --nocapture
          cargo +1.98.0 test -p golam-ledger sandbox_profile::tests:: -- --nocapture
          cargo +1.98.0 clippy -p golam-ledger --all-targets -- -D warnings
      - name: Commit clean T003-072 implementation
        run: |
          git rm .github/workflows/t003-072-enforcement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/lib.rs
          git add crates/golam-ledger/src/sandbox_enforcement.rs
          git commit -m 'feat: enforce bounded sandbox launch rights'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
