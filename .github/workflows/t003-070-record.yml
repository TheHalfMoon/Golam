name: t003-070-record
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Record T003-070 and activate T003-071
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: replacement count {count} for {old!r}')
              path.write_text(text.replace(old, new, 1))

          tasks = Path('specs/003-identity-policy-secrets-sandbox/tasks.md')
          replace_once(
              tasks,
              '- [ ] **T003-070** Implement protected SandboxProfile records and deterministic profile validation.',
              '- [x] **T003-070** Implement protected SandboxProfile records and deterministic profile validation. Exact-head qualification: CI #545 (`33235986709`) SUCCESS at `9704318742c7622cb5304fa24f22b1c5bb35e22e` on Windows/macOS/Ubuntu. Evidence: `implementation/sandbox-profile-qualification.md`.',
          )
          replace_once(tasks, 'NEXT_TASK=T003-070', 'T003_070=PASS\nT003_070_QUALIFIED_HEAD=9704318742c7622cb5304fa24f22b1c5bb35e22e\nT003_070_CI_RUN=33235986709\nNEXT_TASK=T003-071')

          plan = Path('specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md')
          replace_once(plan, '**Current task**: `T003-070`', '**Current task**: `T003-071`')
          replace_once(
              plan,
              '### T003-070 — ACTIVE\n\nImplement protected `SandboxProfile` records and deterministic profile validation.',
              '### T003-070 — COMPLETE\n\nQualified at exact implementation head `9704318742c7622cb5304fa24f22b1c5bb35e22e` by CI #545 / run `33235986709`, SUCCESS on Windows/macOS/Ubuntu.\n\nEvidence: `implementation/sandbox-profile-qualification.md`.\n\nThe qualified boundary establishes deterministic bounded SandboxProfile validation and protected immutable profile-version registration under exact current decision/effect/ONCE-approval authority with atomic authority-security evidence. No admission plan or executor is claimed.\n\n### T003-071 — ACTIVE\n\nCompile protected profiles to bounded launch/admission plans intersected with active lease, policy, and optional egress authority without launching a process.',
          )
          replace_once(plan, 'NEXT_TASK=T003-070', 'T003_070=PASS\nT003_070_QUALIFIED_HEAD=9704318742c7622cb5304fa24f22b1c5bb35e22e\nT003_070_CI_RUN=33235986709\nNEXT_TASK=T003-071')
      - name: Verify record
        run: |
          grep -F 'T003_070=PASS' specs/003-identity-policy-secrets-sandbox/tasks.md
          grep -F 'NEXT_TASK=T003-071' specs/003-identity-policy-secrets-sandbox/tasks.md
          grep -F '### T003-071 — ACTIVE' specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md
      - name: Commit record
        run: |
          git rm .github/workflows/t003-070-record.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/003-identity-policy-secrets-sandbox/tasks.md
          git add specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md
          git commit -m 'docs: record T003-070 qualification'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
