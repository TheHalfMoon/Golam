name: spec006-native-adapter-source-foundry

on:
  push:
    branches: [impl/006-desktop-computer-control]
    paths:
      - .github/workflows/spec006-native-adapter-source-foundry.yml
      - specs/006-desktop-computer-control/implementation/native-adapter-source-foundry-candidate.md

permissions:
  contents: read

jobs:
  qualify:
    name: qualify-${{ matrix.platform }}-native-adapter-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native qualification prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev \
            libclang-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxtst-dev \
            pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build isolated exact candidate manifest
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/golam-spec006-native-${PLATFORM}"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/src"
          cat >"$ROOT/Cargo.toml" <<'EOF'
          [package]
          name = "golam-spec006-native-source-foundry"
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.98"
          publish = false
          EOF

          case "$PLATFORM" in
            windows)
              cat >>"$ROOT/Cargo.toml" <<'EOF'

          [dependencies]
          xa11y-core = { version = "=0.13.0", default-features = false }
          xa11y-windows = { version = "=0.13.0", default-features = false }
          wgc = { version = "=1.0.7", default-features = false }
          enigo = { version = "=0.6.1", default-features = false }
          arboard = { version = "=3.6.1", default-features = false }
          EOF
              cat >"$ROOT/src/main.rs" <<'EOF'
          #![forbid(unsafe_code)]
          use xa11y_windows::WindowsProvider;

          fn main() {
              let _ = core::mem::size_of::<WindowsProvider>();
          }
          EOF
              ;;
            macos)
              cat >>"$ROOT/Cargo.toml" <<'EOF'

          [dependencies]
          axuielement = { version = "=0.9.1", default-features = false }
          screencapturekit = { version = "=10.0.3", default-features = false }
          enigo = { version = "=0.6.1", default-features = false }
          arboard = { version = "=3.6.1", default-features = false }
          EOF
              printf '#![forbid(unsafe_code)]\nfn main() {}\n' >"$ROOT/src/main.rs"
              ;;
            linux)
              cat >>"$ROOT/Cargo.toml" <<'EOF'

          [dependencies]
          atspi = { version = "=0.30.0", default-features = false, features = ["proxies", "connection", "tokio"] }
          ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
          pipewire = { version = "=0.9.2" }
          enigo = { version = "=0.6.1", default-features = false, features = ["x11rb"] }
          arboard = { version = "=3.6.1", default-features = false }
          EOF
              printf '#![forbid(unsafe_code)]\nfn main() {}\n' >"$ROOT/src/main.rs"
              ;;
            *)
              echo "unsupported platform: $PLATFORM" >&2
              exit 1
              ;;
          esac

          cd "$ROOT"
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 fetch --locked
          HOST_TRIPLE="$(rustc +1.98.0 -vV | sed -n 's/^host: //p')"
          test -n "$HOST_TRIPLE"
          cargo +1.98.0 metadata --locked --filter-platform "$HOST_TRIPLE" --format-version 1 >metadata.json
          cargo +1.98.0 tree --locked --target "$HOST_TRIPLE" --edges normal,build >tree.txt
          cargo +1.98.0 tree --locked --target "$HOST_TRIPLE" --edges normal,build,features >features.txt
          cargo +1.98.0 check --locked

          echo "=== PLATFORM ==="
          echo "$PLATFORM"
          echo "=== HOST_TRIPLE ==="
          echo "$HOST_TRIPLE"
          echo "=== LOCK_SHA256 ==="
          if command -v sha256sum >/dev/null 2>&1; then sha256sum Cargo.lock; else shasum -a 256 Cargo.lock; fi
          echo "=== DIRECT_TREE ==="
          cat tree.txt
          echo "=== FEATURE_TREE ==="
          cat features.txt

      - name: Enforce feature and capability denylist
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/golam-spec006-native-${PLATFORM}"
          cd "$ROOT"

          deny_feature() {
            local package="$1"
            local feature="$2"
            if grep -F "${package} feature \"${feature}\"" features.txt >/dev/null; then
              echo "DENIED_FEATURE_PRESENT=${package}/${feature}" >&2
              exit 1
            fi
          }
          require_feature() {
            local package="$1"
            local feature="$2"
            if ! grep -F "${package} feature \"${feature}\"" features.txt >/dev/null; then
              echo "REQUIRED_FEATURE_MISSING=${package}/${feature}" >&2
              exit 1
            fi
          }

          case "$PLATFORM" in
            windows)
              python3 - <<'PY'
          import json
          import pathlib
          import sys

          metadata = json.load(open('metadata.json', encoding='utf-8'))
          packages = [p for p in metadata['packages'] if p['name'] == 'xa11y-windows' and p['version'] == '0.13.0']
          if len(packages) != 1:
              sys.exit(f'XA11Y_WINDOWS_PACKAGE_COUNT={len(packages)}')
          manifest = pathlib.Path(packages[0]['manifest_path'])
          source_root = manifest.parent
          lib_rs = source_root / 'src' / 'lib.rs'
          text = lib_rs.read_text(encoding='utf-8')
          if 'WindowsProvider' not in text:
              sys.exit('XA11Y_WINDOWS_PROVIDER_SURFACE_MISSING')
          print('XA11Y_WINDOWS_PROVIDER_SURFACE=OBSERVED')
          print('XA11Y_WINDOWS_CALLER_SAFE_RUST_PROBE=PASS')
          print('XA11Y_WINDOWS_INPUT_AND_SCREENSHOT_TYPES=EXPLICITLY_NOT_ADMITTED_BY_SEMANTIC_ROLE')
          PY
              deny_feature wgc tracing
              for f in x11rb wayland libei_smol libei_tokio xdo platform_specific serde tokio; do deny_feature enigo "$f"; done
              for f in image-data image core-graphics windows-sys wayland-data-control wl-clipboard-rs; do deny_feature arboard "$f"; done
              ;;
            macos)
              for f in raw-ffi async; do deny_feature axuielement "$f"; done
              for f in async macos_13_0 macos_14_0 macos_14_2 macos_14_4 macos_15_0 macos_15_2 macos_26_0; do deny_feature screencapturekit "$f"; done
              for f in x11rb wayland libei_smol libei_tokio xdo platform_specific serde tokio; do deny_feature enigo "$f"; done
              for f in image-data image core-graphics windows-sys wayland-data-control wl-clipboard-rs; do deny_feature arboard "$f"; done
              ;;
            linux)
              require_feature atspi proxies
              require_feature atspi connection
              require_feature atspi tokio
              require_feature ashpd tokio
              require_feature ashpd remote_desktop
              require_feature ashpd screencast
              for f in frontend backend background camera clipboard input_capture location network_monitor notification open_uri print proxy_resolver screenshot secret usb wallpaper wayland raw_handle; do deny_feature ashpd "$f"; done
              require_feature enigo x11rb
              for f in wayland libei_smol libei_tokio xdo platform_specific serde tokio; do deny_feature enigo "$f"; done
              for f in image-data image core-graphics windows-sys wayland-data-control wl-clipboard-rs; do deny_feature arboard "$f"; done
              if grep -F 'wl-clipboard-rs ' tree.txt >/dev/null || grep -F 'arboard feature "wayland-data-control"' features.txt >/dev/null; then
                echo 'LINUX_DIRECT_WAYLAND_CLIPBOARD_CLOSURE=REJECTED_PRESENT' >&2
                exit 1
              fi
              echo 'LINUX_CLIPBOARD_CANDIDATE=X11_ONLY'
              echo 'LINUX_PURE_WAYLAND_CLIPBOARD=NOT_SUPPORTED_PENDING_SEPARATE_SESSION_BOUND_ADMISSION'
              ;;
          esac

          echo "FEATURE_DENYLIST=PASS"

      - name: Inventory checksum-bound package archives, licenses, builds, native links, and network closure
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/golam-spec006-native-${PLATFORM}"
          cd "$ROOT"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import tarfile
          import tomllib
          from pathlib import Path, PurePosixPath

          metadata = json.load(open('metadata.json', encoding='utf-8'))
          with open('Cargo.lock', 'rb') as fh:
              cargo_lock = tomllib.load(fh)

          allowed = {
              '0BSD', 'Apache-2.0', 'Apache-2.0 WITH LLVM-exception',
              'BSD-2-Clause', 'BSD-3-Clause', 'BSL-1.0', 'CC0-1.0',
              'ISC', 'MIT', 'MIT-0', 'MPL-2.0', 'Unicode-3.0',
              'Unicode-DFS-2016', 'Unlicense', 'Zlib', 'Zlib-acknowledgement',
          }
          network_clients = {
              'reqwest', 'hyper', 'hyper-util', 'ureq', 'curl', 'curl-sys',
              'isahc', 'surf', 'attohttpc', 'awc'
          }
          license_name = re.compile(r'^(LICENSE|LICENCE|COPYING)(?:[-._].*)?$', re.I)
          notice_name = re.compile(r'^(NOTICE|COPYRIGHT)(?:[-._].*)?$', re.I)

          def strip_outer(expr):
              expr = expr.strip()
              while expr.startswith('(') and expr.endswith(')'):
                  depth = 0
                  wraps = True
                  for i, ch in enumerate(expr):
                      if ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0 and i != len(expr) - 1:
                              wraps = False
                              break
                  if not wraps:
                      break
                  expr = expr[1:-1].strip()
              return expr

          def split_top(expr, operator):
              parts = []
              depth = 0
              start = 0
              marker = f' {operator} '
              i = 0
              while i <= len(expr) - len(marker):
                  ch = expr[i]
                  if ch == '(':
                      depth += 1
                      i += 1
                      continue
                  if ch == ')':
                      depth -= 1
                      i += 1
                      continue
                  if depth == 0 and expr.startswith(marker, i):
                      parts.append(expr[start:i].strip())
                      i += len(marker)
                      start = i
                      continue
                  i += 1
              if parts:
                  parts.append(expr[start:].strip())
              return parts

          def select_allowed_path(expr):
              expr = strip_outer(expr.replace('/', ' OR '))
              ors = split_top(expr, 'OR')
              if ors:
                  for part in ors:
                      selected = select_allowed_path(part)
                      if selected is not None:
                          return selected
                  return None
              ands = split_top(expr, 'AND')
              if ands:
                  selected = []
                  for part in ands:
                      branch = select_allowed_path(part)
                      if branch is None:
                          return None
                      selected.extend(branch)
                  return selected
              return [expr] if expr in allowed else None

          def distribution_obligation(selected, notice_files):
              obligations = []
              for license_id in selected:
                  if license_id == 'MPL-2.0':
                      obligations.append('FILE_LEVEL_SOURCE_AVAILABILITY_AND_LICENSE_NOTICE_REQUIRED')
                  elif license_id.startswith('Apache-2.0'):
                      obligations.append('LICENSE_AND_COPYRIGHT_NOTICE_REQUIRED')
                  else:
                      obligations.append('LICENSE_OR_COPYRIGHT_NOTICE_REQUIRED')
              if notice_files:
                  obligations.append('PRESERVE_OBSERVED_UPSTREAM_NOTICE_FILES')
              return '+'.join(dict.fromkeys(obligations))

          lock_packages = cargo_lock.get('package', [])
          packages = {p['id']: p for p in metadata['packages']}
          nodes = {n['id']: n for n in metadata['resolve']['nodes']}
          reachable = set()
          stack = [metadata['resolve']['root']]
          while stack:
              pid = stack.pop()
              if pid in reachable:
                  continue
              reachable.add(pid)
              node = nodes.get(pid)
              if node:
                  stack.extend(dep['pkg'] for dep in node.get('deps', []))

          external = [packages[pid] for pid in reachable if packages[pid].get('source')]
          blocked = []
          network = []
          custom_build = []
          native_links = []
          cargo_home = Path(os.environ.get('CARGO_HOME') or (Path.home() / '.cargo'))
          cache_root = cargo_home / 'registry' / 'cache'

          print(f'ACTIVE_EXTERNAL_PACKAGE_COUNT={len(external)}')
          print('=== ARCHIVE_BOUND_LICENSE_NOTICE_INVENTORY ===')
          for p in sorted(external, key=lambda x: (x['name'], x['version'], x.get('source') or '')):
              name = p['name']
              version = p['version']
              source = p.get('source') or ''
              expr = (p.get('license') or '').strip()
              selected = select_allowed_path(expr) if expr else None

              lock_rows = [row for row in lock_packages if row.get('name') == name and str(row.get('version')) == version]
              exact_rows = [row for row in lock_rows if (row.get('source') or '') == source]
              lock_row = exact_rows[0] if len(exact_rows) == 1 else (lock_rows[0] if len(lock_rows) == 1 else None)
              lock_checksum = (lock_row or {}).get('checksum') or ''

              archive_candidates = list(cache_root.glob(f'*/{name}-{version}.crate')) if cache_root.exists() else []
              verified_archives = []
              for archive in archive_candidates:
                  digest = hashlib.sha256(archive.read_bytes()).hexdigest()
                  if lock_checksum and digest == lock_checksum:
                      verified_archives.append((archive, digest))
              archive = verified_archives[0][0] if len(verified_archives) == 1 else None
              archive_sha = verified_archives[0][1] if len(verified_archives) == 1 else ''

              license_files = []
              notice_files = []
              if archive is not None:
                  with tarfile.open(archive, mode='r:*') as tf:
                      for member in tf.getmembers():
                          if not member.isfile():
                              continue
                          parts = PurePosixPath(member.name).parts
                          if len(parts) < 2:
                              continue
                          rel = PurePosixPath(*parts[1:])
                          if len(rel.parts) != 1:
                              continue
                          base = rel.name
                          if license_name.match(base):
                              license_files.append(base)
                          if notice_name.match(base):
                              notice_files.append(base)
              license_files = sorted(set(license_files))
              notice_files = sorted(set(notice_files))

              problems = []
              if not source.startswith('registry+'):
                  problems.append('NON_REGISTRY_SOURCE_REQUIRES_SEPARATE_SOURCE_IDENTITY_REVIEW')
              if lock_row is None:
                  problems.append('LOCK_IDENTITY_AMBIGUOUS_OR_MISSING')
              if not lock_checksum:
                  problems.append('LOCK_CHECKSUM_MISSING')
              if archive is None:
                  problems.append('CHECKSUM_BOUND_CRATE_ARCHIVE_NOT_UNIQUELY_RESOLVED')
              if selected is None:
                  problems.append('NO_ALLOWED_SPDX_PATH')
              if not license_files:
                  problems.append('TOP_LEVEL_LICENSE_FILE_NOT_OBSERVED_IN_ARCHIVE')

              obligation = distribution_obligation(selected or [], notice_files) if selected else 'UNRESOLVED'
              disposition = 'ACCEPT_ARCHIVE_BOUND_LICENSE_EVIDENCE' if not problems else 'REVIEW_REQUIRED:' + ','.join(problems)
              if problems:
                  blocked.append((name, version, disposition))

              kinds = sorted({kind for target in p.get('targets', []) for kind in target.get('kind', [])})
              has_build = 'custom-build' in kinds
              if has_build:
                  custom_build.append((name, version))
              if p.get('links'):
                  native_links.append((name, version, p['links']))
              if name in network_clients:
                  network.append((name, version))

              print('|'.join([
                  name,
                  version,
                  source,
                  lock_checksum or 'NO_LOCK_CHECKSUM',
                  archive_sha or 'NO_VERIFIED_ARCHIVE_SHA256',
                  expr or 'NO_SPDX_EXPRESSION',
                  ' AND '.join(selected) if selected else 'NO_SELECTED_ALLOWED_PATH',
                  ','.join(license_files) if license_files else 'NO_TOP_LEVEL_LICENSE_FILE',
                  ','.join(notice_files) if notice_files else 'NO_TOP_LEVEL_NOTICE_FILE',
                  obligation,
                  disposition,
                  'CUSTOM_BUILD' if has_build else 'NO_CUSTOM_BUILD',
                  p.get('links') or 'NO_NATIVE_LINKS',
                  p.get('repository') or ''
              ]))

          print('=== CUSTOM_BUILD_PACKAGES ===')
          print(f'count={len(custom_build)}')
          for row in custom_build: print('|'.join(row))
          print('=== NATIVE_LINK_PACKAGES ===')
          print(f'count={len(native_links)}')
          for row in native_links: print('|'.join(row))
          print('=== NETWORK_CLIENT_PACKAGES ===')
          print(f'count={len(network)}')
          for row in network: print('|'.join(row))
          print('=== BLOCKED_ARCHIVE_OR_LICENSE_EVIDENCE ===')
          print(f'count={len(blocked)}')
          for row in blocked: print('|'.join(row))

          if network:
              sys.exit('network-capable HTTP client package entered the active candidate closure')
          if blocked:
              sys.exit('checksum-bound package archive/license evidence requires reconciliation before admission')
          PY

      - name: Prove product manifests remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            Cargo.toml \
            Cargo.lock \
            apps/golam-desktop/src-tauri/Cargo.toml \
            apps/golam-desktop/package.json \
            apps/golam-desktop/package-lock.json
          cat <<'EOF'
          PRODUCT_MANIFEST_MUTATION=NO
          PRODUCT_NATIVE_ADAPTER_CODE_ADMISSION=NO
          PRODUCT_RUNTIME_NETWORK_AUTHORITY=NO
          CAMERA_ADMISSION=NO
          MICROPHONE_ADMISSION=NO
          AUDIO_CAPTURE_ADMISSION=NO
          OCR_ADMISSION=NO
          LINUX_DIRECT_WAYLAND_CLIPBOARD_ADMISSION=NO
          WAYLAND_BYPASS_ADMISSION=NO
          SOURCE_FOUNDRY_CANDIDATE_QUALIFICATION=PASS_PENDING_INDEPENDENT_REVIEW
          EOF
