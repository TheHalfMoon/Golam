name: spec006-native-adapter-source-foundry

on:
  push:
    branches: [impl/006-desktop-computer-control]
    paths:
      - .github/workflows/spec006-native-adapter-source-foundry.yml
      - specs/006-desktop-computer-control/implementation/native-adapter-source-foundry-candidate.md

permissions:
  contents: read

jobs:
  qualify:
    name: qualify-${{ matrix.platform }}-native-adapter-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native qualification prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev \
            libclang-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxtst-dev \
            pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build isolated exact candidate manifest
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/golam-spec006-native-${PLATFORM}"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/src"
          cat >"$ROOT/Cargo.toml" <<'EOF'
          [package]
          name = "golam-spec006-native-source-foundry"
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.98"
          publish = false
          EOF

          case "$PLATFORM" in
            windows)
              cat >>"$ROOT/Cargo.toml" <<'EOF'

          [dependencies]
          uiautomation = { version = "=0.25.0", default-features = false, features = ["control"] }
          wgc = { version = "=1.0.7", default-features = false }
          enigo = { version = "=0.6.1", default-features = false }
          arboard = { version = "=3.6.1", default-features = false }
          EOF
              ;;
            macos)
              cat >>"$ROOT/Cargo.toml" <<'EOF'

          [dependencies]
          axuielement = { version = "=0.9.1", default-features = false }
          screencapturekit = { version = "=10.0.3", default-features = false }
          enigo = { version = "=0.6.1", default-features = false }
          arboard = { version = "=3.6.1", default-features = false }
          EOF
              ;;
            linux)
              cat >>"$ROOT/Cargo.toml" <<'EOF'

          [dependencies]
          atspi = { version = "=0.30.0", default-features = false, features = ["proxies", "connection", "tokio"] }
          ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
          pipewire = { version = "=0.9.2" }
          enigo = { version = "=0.6.1", default-features = false, features = ["x11rb"] }
          arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
          EOF
              ;;
            *)
              echo "unsupported platform: $PLATFORM" >&2
              exit 1
              ;;
          esac

          printf '#![forbid(unsafe_code)]\nfn main() {}\n' >"$ROOT/src/main.rs"
          cd "$ROOT"
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 fetch --locked
          cargo +1.98.0 metadata --locked --format-version 1 >metadata.json
          cargo +1.98.0 tree --locked --edges normal,build >tree.txt
          cargo +1.98.0 tree --locked --edges normal,build,features >features.txt
          cargo +1.98.0 check --locked

          echo "=== PLATFORM ==="
          echo "$PLATFORM"
          echo "=== LOCK_SHA256 ==="
          if command -v sha256sum >/dev/null 2>&1; then sha256sum Cargo.lock; else shasum -a 256 Cargo.lock; fi
          echo "=== DIRECT_TREE ==="
          cat tree.txt
          echo "=== FEATURE_TREE ==="
          cat features.txt

      - name: Enforce feature and capability denylist
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/golam-spec006-native-${PLATFORM}"
          cd "$ROOT"

          deny_feature() {
            local package="$1"
            local feature="$2"
            if grep -F "${package} feature \"${feature}\"" features.txt >/dev/null; then
              echo "DENIED_FEATURE_PRESENT=${package}/${feature}" >&2
              exit 1
            fi
          }
          require_feature() {
            local package="$1"
            local feature="$2"
            if ! grep -F "${package} feature \"${feature}\"" features.txt >/dev/null; then
              echo "REQUIRED_FEATURE_MISSING=${package}/${feature}" >&2
              exit 1
            fi
          }

          case "$PLATFORM" in
            windows)
              require_feature uiautomation control
              for f in input clipboard screenshot process dialog event log all; do deny_feature uiautomation "$f"; done
              deny_feature wgc tracing
              for f in x11rb wayland libei_smol libei_tokio xdo platform_specific serde tokio; do deny_feature enigo "$f"; done
              for f in image-data image core-graphics windows-sys wayland-data-control wl-clipboard-rs; do deny_feature arboard "$f"; done
              ;;
            macos)
              for f in raw-ffi async; do deny_feature axuielement "$f"; done
              for f in async macos_13_0 macos_14_0 macos_14_2 macos_14_4 macos_15_0 macos_15_2 macos_26_0; do deny_feature screencapturekit "$f"; done
              for f in x11rb wayland libei_smol libei_tokio xdo platform_specific serde tokio; do deny_feature enigo "$f"; done
              for f in image-data image core-graphics windows-sys wayland-data-control wl-clipboard-rs; do deny_feature arboard "$f"; done
              ;;
            linux)
              require_feature atspi proxies
              require_feature atspi connection
              require_feature atspi tokio
              require_feature ashpd tokio
              require_feature ashpd remote_desktop
              require_feature ashpd screencast
              for f in frontend backend background camera clipboard input_capture location network_monitor notification open_uri print proxy_resolver screenshot secret usb wallpaper wayland raw_handle; do deny_feature ashpd "$f"; done
              require_feature enigo x11rb
              for f in wayland libei_smol libei_tokio xdo platform_specific serde tokio; do deny_feature enigo "$f"; done
              require_feature arboard wayland-data-control
              for f in image-data image core-graphics windows-sys; do deny_feature arboard "$f"; done
              ;;
          esac

          echo "FEATURE_DENYLIST=PASS"

      - name: Inventory license, build, native-link, and network closure
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/golam-spec006-native-${PLATFORM}"
          cd "$ROOT"
          python3 - <<'PY'
          import json
          import re
          import sys

          metadata = json.load(open('metadata.json', encoding='utf-8'))
          allowed = {
              '0BSD', 'Apache-2.0', 'Apache-2.0 WITH LLVM-exception',
              'BSD-2-Clause', 'BSD-3-Clause', 'BSL-1.0', 'CC0-1.0',
              'ISC', 'MIT', 'MIT-0', 'MPL-2.0', 'Unicode-3.0',
              'Unicode-DFS-2016', 'Unlicense', 'Zlib', 'Zlib-acknowledgement',
          }
          forbidden_markers = (
              'AGPL', 'GPL-1', 'GPL-2', 'GPL-3', 'LGPL', 'SSPL', 'BUSL',
              'Commons-Clause', 'EUPL', 'OSL', 'CDDL', 'EPL'
          )
          network_clients = {
              'reqwest', 'hyper', 'hyper-util', 'ureq', 'curl', 'curl-sys',
              'isahc', 'surf', 'attohttpc', 'awc'
          }

          def leaves(expr):
              return [
                  p.strip()
                  for p in re.split(r'\s+(?:OR|AND)\s+|\s*/\s*', expr.replace('(', ' ').replace(')', ' '))
                  if p.strip()
              ]

          blocked = []
          network = []
          custom_build = []
          native_links = []
          external = [p for p in metadata['packages'] if p.get('source')]
          print(f'EXTERNAL_PACKAGE_COUNT={len(external)}')
          for p in sorted(external, key=lambda x: (x['name'], x['version'])):
              expr = (p.get('license') or '').strip()
              license_file = p.get('license_file') or ''
              package_leaves = leaves(expr) if expr else []
              if any(marker.lower() in expr.lower() for marker in forbidden_markers):
                  disposition = 'REJECT_FORBIDDEN_LICENSE'
                  blocked.append((p['name'], p['version'], disposition, expr))
              elif expr and package_leaves and all(x in allowed for x in package_leaves):
                  disposition = 'ACCEPT_PERMISSIVE_OR_MPL_EXPRESSION'
              elif not expr and license_file:
                  disposition = 'REVIEW_LICENSE_FILE_REQUIRED'
              else:
                  disposition = 'REJECT_UNKNOWN_OR_MISSING_LICENSE'
                  blocked.append((p['name'], p['version'], disposition, expr or 'MISSING'))

              kinds = sorted({kind for target in p.get('targets', []) for kind in target.get('kind', [])})
              has_build = 'custom-build' in kinds
              if has_build:
                  custom_build.append((p['name'], p['version']))
              if p.get('links'):
                  native_links.append((p['name'], p['version'], p['links']))
              if p['name'] in network_clients:
                  network.append((p['name'], p['version']))

              print('|'.join([
                  p['name'], p['version'], expr or 'NO_SPDX_EXPRESSION',
                  license_file or 'NO_LICENSE_FILE_METADATA', disposition,
                  'CUSTOM_BUILD' if has_build else 'NO_CUSTOM_BUILD',
                  p.get('links') or 'NO_NATIVE_LINKS', p.get('repository') or ''
              ]))

          print('=== CUSTOM_BUILD_PACKAGES ===')
          print(f'count={len(custom_build)}')
          for row in custom_build: print('|'.join(row))
          print('=== NATIVE_LINK_PACKAGES ===')
          print(f'count={len(native_links)}')
          for row in native_links: print('|'.join(row))
          print('=== NETWORK_CLIENT_PACKAGES ===')
          print(f'count={len(network)}')
          for row in network: print('|'.join(row))
          print('=== BLOCKED_LICENSES ===')
          print(f'count={len(blocked)}')
          for row in blocked: print('|'.join(row))

          if network:
              sys.exit('network-capable HTTP client package entered the candidate closure')
          if blocked:
              sys.exit('license disposition requires reconciliation before admission')
          PY

      - name: Prove product manifests remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            Cargo.toml \
            Cargo.lock \
            apps/golam-desktop/src-tauri/Cargo.toml \
            apps/golam-desktop/package.json \
            apps/golam-desktop/package-lock.json
          cat <<'EOF'
          PRODUCT_MANIFEST_MUTATION=NO
          PRODUCT_NATIVE_ADAPTER_CODE_ADMISSION=NO
          PRODUCT_RUNTIME_NETWORK_AUTHORITY=NO
          CAMERA_ADMISSION=NO
          MICROPHONE_ADMISSION=NO
          OCR_ADMISSION=NO
          WAYLAND_BYPASS_ADMISSION=NO
          SOURCE_FOUNDRY_CANDIDATE_QUALIFICATION=PASS_PENDING_INDEPENDENT_REVIEW
          EOF
