name: t003-054-link-fallback

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/t003-054-link-fallback.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'impl/003-identity-policy-secrets-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Integrate bounded fallback and callback-only vault access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/golam-ledger/src/lib.rs')
          s = lib.read_text()
          anchor = '#[allow(dead_code)]\npub(crate) mod secret_broker;\n'
          addition = anchor + '#[allow(dead_code)]\npub(crate) mod secret_fallback;\n'
          if 'pub(crate) mod secret_fallback;' not in s:
              if anchor not in s:
                  raise SystemExit('secret broker module anchor missing')
              s = s.replace(anchor, addition, 1)
          lib.write_text(s)

          vault = Path('crates/golam-ledger/src/secret_vault.rs')
          s = vault.read_text()
          trait_anchor = '''pub(crate) trait KeyProtector: Send + Sync {\n    fn load_master_key(&self) -> Result<Zeroizing<Vec<u8>>, KeyProtectionError>;\n    fn store_master_key(&self, key: &[u8]) -> Result<(), KeyProtectionError>;\n}\n'''
          borrowed_impl = '''\nimpl<T: KeyProtector + ?Sized> KeyProtector for &T {\n    fn load_master_key(&self) -> Result<Zeroizing<Vec<u8>>, KeyProtectionError> {\n        (**self).load_master_key()\n    }\n\n    fn store_master_key(&self, key: &[u8]) -> Result<(), KeyProtectionError> {\n        (**self).store_master_key(key)\n    }\n}\n'''
          if 'impl<T: KeyProtector + ?Sized> KeyProtector for &T' not in s:
              if trait_anchor not in s:
                  raise SystemExit('KeyProtector trait anchor missing')
              s = s.replace(trait_anchor, trait_anchor + borrowed_impl, 1)

          open_anchor = '''    fn open(\n        &self,\n        binding: &VaultBinding,\n        encrypted: &EncryptedSecretValue,\n    ) -> Result<Zeroizing<Vec<u8>>, VaultError> {\n'''
          callback = '''    pub(crate) fn with_persisted_plaintext<R>(\n        &self,\n        binding: &VaultBinding,\n        ciphertext: &[u8],\n        algorithm_metadata: &[u8],\n        associated_data_hash: [u8; 32],\n        callback: impl FnOnce(&[u8]) -> R,\n    ) -> Result<R, VaultError> {\n        let encrypted = EncryptedSecretValue {\n            ciphertext: ciphertext.to_vec(),\n            algorithm_metadata: algorithm_metadata.to_vec(),\n            associated_data_hash,\n        };\n        let plaintext = self.open(binding, &encrypted)?;\n        Ok(callback(plaintext.as_slice()))\n    }\n\n'''
          if 'pub(crate) fn with_persisted_plaintext<R>' not in s:
              if open_anchor not in s:
                  raise SystemExit('private vault open anchor missing')
              s = s.replace(open_anchor, callback + open_anchor, 1)
          vault.write_text(s)

          fallback = Path('crates/golam-ledger/src/secret_fallback.rs')
          s = fallback.read_text()
          old_sig = '''    fn base_request<'a>(fixture: &'a Fixture, args: &'a [String]) -> FallbackSecretUseRequest<'a> {\n'''
          new_sig = '''    fn base_request<'a>(\n        fixture: &'a Fixture,\n        args: &'a [String],\n        environment: &'a [(String, String)],\n    ) -> FallbackSecretUseRequest<'a> {\n'''
          if old_sig in s:
              s = s.replace(old_sig, new_sig, 1)
          s = s.replace(
              '            explicit_environment: &[("GOLAM_TEST_MODE".to_owned(), "1".to_owned())],\n        }\n    }\n\n    fn seed_fixture',
              '            explicit_environment: environment,\n        }\n    }\n\n    fn seed_fixture',
              1,
          )
          seed_old = '''        let empty_args: Vec<String> = Vec::new();\n        let request = FallbackSecretUseRequest {\n'''
          seed_new = '''        let empty_args: Vec<String> = Vec::new();\n        let environment = vec![("GOLAM_TEST_MODE".to_owned(), "1".to_owned())];\n        let request = FallbackSecretUseRequest {\n'''
          if seed_old not in s:
              raise SystemExit('seed fixture environment anchor missing')
          s = s.replace(seed_old, seed_new, 1)
          s = s.replace(
              '            explicit_environment: &[("GOLAM_TEST_MODE".to_owned(), "1".to_owned())],\n        };\n        let plan = build_launch_plan',
              '            explicit_environment: &environment,\n        };\n        let plan = build_launch_plan',
              1,
          )

          # Add one owned environment per test and pass it to base_request.
          s = s.replace(
              '        let args: Vec<String> = Vec::new();\n        let mut injector = RecordingInjector::qualified();\n        let output = store\n            .execute_with_injector(base_request(&fixture, &args), &mut injector)',
              '        let args: Vec<String> = Vec::new();\n        let environment = vec![("GOLAM_TEST_MODE".to_owned(), "1".to_owned())];\n        let mut injector = RecordingInjector::qualified();\n        let output = store\n            .execute_with_injector(base_request(&fixture, &args, &environment), &mut injector)',
              1,
          )
          s = s.replace(
              '            store.execute_with_injector(base_request(&fixture, &args), &mut injector),',
              '            store.execute_with_injector(base_request(&fixture, &args, &environment), &mut injector),',
              1,
          )
          s = s.replace(
              '        let args = vec![String::from_utf8(CANARY.to_vec()).unwrap()];\n        let mut injector = RecordingInjector::qualified();\n        assert!(matches!(\n            store.execute_with_injector(base_request(&fixture, &args), &mut injector),',
              '        let args = vec![String::from_utf8(CANARY.to_vec()).unwrap()];\n        let environment = vec![("GOLAM_TEST_MODE".to_owned(), "1".to_owned())];\n        let mut injector = RecordingInjector::qualified();\n        assert!(matches!(\n            store.execute_with_injector(base_request(&fixture, &args, &environment), &mut injector),',
              1,
          )
          s = s.replace(
              '        let args: Vec<String> = Vec::new();\n        let mut weak = RecordingInjector::qualified();',
              '        let args: Vec<String> = Vec::new();\n        let environment = vec![("GOLAM_TEST_MODE".to_owned(), "1".to_owned())];\n        let mut weak = RecordingInjector::qualified();',
              1,
          )
          s = s.replace(
              '            store.execute_with_injector(base_request(&fixture, &args), &mut weak),',
              '            store.execute_with_injector(base_request(&fixture, &args, &environment), &mut weak),',
              1,
          )
          s = s.replace(
              '            store.execute_with_injector(base_request(&fixture, &args), &mut injector),',
              '            store.execute_with_injector(base_request(&fixture, &args, &environment), &mut injector),',
              1,
          )
          s = s.replace(
              '        let changed_args = vec!["--different".to_owned()];\n        let request = base_request(&fixture, &changed_args);',
              '        let changed_args = vec!["--different".to_owned()];\n        let environment = vec![("GOLAM_TEST_MODE".to_owned(), "1".to_owned())];\n        let request = base_request(&fixture, &changed_args, &environment);',
              1,
          )
          fallback.write_text(s)
          PY
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
          git rm .github/workflows/t003-054-link-fallback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/lib.rs crates/golam-ledger/src/secret_vault.rs crates/golam-ledger/src/secret_fallback.rs
          git commit -m 'impl: link bounded secret fallback boundary'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox