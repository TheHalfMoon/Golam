name: t003-060-hard-guard
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Add strict-local downstream-dominance regression
        shell: python
        run: |
          import base64
          from pathlib import Path

          path = Path('crates/golam-kernel/src/authorization.rs')
          source = path.read_text()
          anchor = '    #[test]\n    fn normalized_non_hard_request_reaches_policy() {'
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one insertion anchor, found {source.count(anchor)}')
          insertion = base64.b64decode('').decode()
          path.write_text(source.replace(anchor, insertion + anchor, 1))
      - name: Format and run focused regression
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p golam-kernel strict_local_egress_dominates_downstream_permit_policy_evaluation -- --nocapture
          cargo +1.98.0 test -p golam-kernel authorization::tests:: -- --nocapture
      - name: Commit clean implementation delta
        run: |
          git rm .github/workflows/t003-060-hard-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-kernel/src/authorization.rs
          git commit -m 'test: lock strict-local egress hard-guard dominance'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
