name: t003-054-clippy-repair
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Repair admission input boundary
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/golam-ledger/src/secret_fallback.rs')
          s = p.read_text()
          old_call = '''        let admission = verify_admission(\n            &transaction,\n            request.admission_id,\n            request.principal,\n            request.destination_or_process,\n            plan.plan_hash,\n            injector.executor_id(),\n            &resource,\n            request.observed_at,\n        )?;'''
          new_call = '''        let admission = verify_admission(\n            &transaction,\n            AdmissionRequest {\n                admission_id: request.admission_id,\n                principal: request.principal,\n                destination: request.destination_or_process,\n                plan_hash: plan.plan_hash,\n                executor_id: injector.executor_id(),\n                resource: &resource,\n                observed_at: request.observed_at,\n            },\n        )?;'''
          old_sig = '''fn verify_admission(\n    transaction: &Transaction<'_>,\n    admission_id: [u8; 16],\n    principal: &str,\n    destination: &str,\n    plan_hash: [u8; 32],\n    executor_id: &str,\n    resource: &str,\n    observed_at: &str,\n) -> Result<AdmissionEvidence, SecretFallbackError> {'''
          new_sig = '''struct AdmissionRequest<'a> {\n    admission_id: [u8; 16],\n    principal: &'a str,\n    destination: &'a str,\n    plan_hash: [u8; 32],\n    executor_id: &'a str,\n    resource: &'a str,\n    observed_at: &'a str,\n}\n\nfn verify_admission(\n    transaction: &Transaction<'_>,\n    request: AdmissionRequest<'_>,\n) -> Result<AdmissionEvidence, SecretFallbackError> {\n    let AdmissionRequest {\n        admission_id,\n        principal,\n        destination,\n        plan_hash,\n        executor_id,\n        resource,\n        observed_at,\n    } = request;'''
          if old_call not in s or old_sig not in s:
              raise SystemExit('expected T003-054 repair anchors not found')
          s = s.replace(old_call, new_call, 1).replace(old_sig, new_sig, 1)
          p.write_text(s)
      - name: Format and commit
        run: |
          cargo +1.98.0 fmt --all
          git rm .github/workflows/t003-054-clippy-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/secret_fallback.rs
          git commit -m 'refactor: bound fallback admission verification input'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
