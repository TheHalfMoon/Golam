name: t003-057-recovery
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  recover:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Recover intended T003-057 patch
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/t003-057-fault-tests.yml').read_text()
          step = workflow.index('      - name: Add exact mutation crash and disk-full tests')
          run_marker = '        run: |\n'
          start = workflow.index(run_marker, step) + len(run_marker)
          end = workflow.index('\n      - name:', start)
          body = workflow[start:end]

          script_lines = []
          in_raw_rust = False
          for line in body.splitlines():
              if in_raw_rust:
                  script_lines.append(line)
                  if line.endswith("}'''"):
                      in_raw_rust = False
                  continue
              if line == '':
                  script_lines.append('')
                  continue
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected Python indentation before raw Rust block: {line!r}')
              logical = line[10:]
              script_lines.append(logical)
              if logical.rstrip().endswith("+ r'''"):
                  in_raw_rust = True

          if in_raw_rust:
              raise SystemExit('unterminated embedded Rust raw string')
          script = '\n'.join(script_lines) + '\n'
          compile(script, 't003-057-recovered-patch.py', 'exec')
          exec(script, {'__name__': '__main__'})
      - name: Format and run focused qualification tests
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p golam-ledger secret_mutation::tests:: -- --nocapture
      - name: Commit clean implementation delta
        run: |
          git rm .github/workflows/t003-057-fault-tests.yml
          git rm .github/workflows/t003-057-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/secret_mutation.rs
          git commit -m 'test: qualify secret mutation crash and disk-full safety'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
