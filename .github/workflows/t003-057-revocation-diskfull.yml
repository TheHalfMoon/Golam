name: t003-057-revocation-diskfull
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Add revocation disk-full rollback qualification
        shell: python
        run: |
          import base64
          from pathlib import Path

          path = Path('crates/golam-ledger/src/secret_mutation.rs')
          source = path.read_text()
          anchor = '''    #[test]\n    fn process_kill_before_rotation_commit_preserves_old_current_authority() {'''
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one insertion anchor, found {source.count(anchor)}')
          insertion = base64.b64decode('').decode()
          path.write_text(source.replace(anchor, insertion + anchor, 1))
      - name: Format and run focused qualification tests
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p golam-ledger disk_full_revocation_rolls_back_status_snapshot_and_approval -- --nocapture
          cargo +1.98.0 test -p golam-ledger secret_mutation::tests:: -- --nocapture
      - name: Commit clean implementation delta
        run: |
          git rm .github/workflows/t003-057-revocation-diskfull.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/golam-ledger/src/secret_mutation.rs
          git commit -m 'test: cover revocation disk-full rollback'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
