name: spec005-cross-platform-process-bin-patch

on:
  push:
    branches:
      - impl/005-local-tools-context-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Repair Linux-only qualification bins and prove macOS Clippy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          linux_cfg = '#[cfg(all(target_os = "linux", target_arch = "x86_64"))]'

          helper = Path('crates/golamd/src/bin/golam-native-exec-helper-v2.rs')
          text = helper.read_text()
          old = '''#[allow(dead_code)]
#[path = "../native_containment_v2.rs"]
mod native_containment_v2;
#[allow(dead_code)]
#[path = "../static_elf_v2.rs"]
mod static_elf_v2;
'''
          new = f'''{linux_cfg}
#[allow(dead_code)]
#[path = "../native_containment_v2.rs"]
mod native_containment_v2;
{linux_cfg}
#[allow(dead_code)]
#[path = "../static_elf_v2.rs"]
mod static_elf_v2;
'''
          if text.count(old) != 1:
              raise SystemExit('expected helper module gate pattern exactly once')
          helper.write_text(text.replace(old, new, 1))

          carrier = Path('crates/golamd/src/bin/golam-process-stage-v2-qualification.rs')
          text = carrier.read_text()
          if text.count('#[cfg(unix)]') != 3:
              raise SystemExit('expected exactly three Unix carrier gates')
          carrier.write_text(text.replace('#[cfg(unix)]', linux_cfg))
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          rm .github/workflows/spec005-cross-platform-process-bin-patch.yml
          git diff --check
      - name: Commit only lint-clean cross-platform repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/src/bin/golam-native-exec-helper-v2.rs crates/golamd/src/bin/golam-process-stage-v2-qualification.rs .github/workflows/spec005-cross-platform-process-bin-patch.yml
          git commit -m "fix(005): gate Linux process qualification bins"
          git push origin HEAD:impl/005-local-tools-context-memory
