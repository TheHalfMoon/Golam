name: t003-052-bind-secret-mutations

on:
  pull_request:

permissions:
  contents: write

jobs:
  bind:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'impl/003-identity-policy-secrets-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Bind T003-052 production secret mutation path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          authority_path = Path('crates/golam-ledger/src/authority_security_write.rs')
          authority = authority_path.read_text()

          replacements = [
              (
                  '    #[cfg(test)]\n    SecretRecord,\n    #[cfg(test)]\n    SecretVersion,\n    #[cfg(test)]\n    SecretHandle,',
                  '    SecretRecord,\n    SecretVersion,\n    #[cfg(test)]\n    SecretHandle,',
              ),
              (
                  '            #[cfg(test)]\n            Self::SecretRecord => "secret_record",\n            #[cfg(test)]\n            Self::SecretVersion => "secret_version",\n            #[cfg(test)]\n            Self::SecretHandle => "secret_handle",',
                  '            Self::SecretRecord => "secret_record",\n            Self::SecretVersion => "secret_version",\n            #[cfg(test)]\n            Self::SecretHandle => "secret_handle",',
              ),
              (
                  '#[cfg(test)]\npub(crate) fn append_secret_record_snapshot(',
                  'pub(crate) fn append_secret_record_snapshot(',
              ),
              (
                  '#[cfg(test)]\npub(crate) fn append_secret_version_snapshot(',
                  'pub(crate) fn append_secret_version_snapshot(',
              ),
          ]
          for old, new in replacements:
              count = authority.count(old)
              if count != 1:
                  raise SystemExit(f'authority replacement expected exactly once, found {count}: {old[:80]!r}')
              authority = authority.replace(old, new, 1)
          authority_path.write_text(authority)

          lib_path = Path('crates/golam-ledger/src/lib.rs')
          lib = lib_path.read_text()
          old = '#[allow(dead_code)]\nmod secret_vault;\npub mod secrets;'
          new = '#[allow(dead_code)]\nmod secret_vault;\n#[allow(dead_code)]\npub(crate) mod secret_mutation;\npub mod secrets;'
          count = lib.count(old)
          if count != 1:
              raise SystemExit(f'lib replacement expected exactly once, found {count}')
          lib_path.write_text(lib.replace(old, new, 1))
          PY
          git rm .github/workflows/t003-052-bind-secret-mutations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golam-ledger/src/authority_security_write.rs crates/golam-ledger/src/lib.rs
          git commit -m "feat: bind protected secret mutations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
