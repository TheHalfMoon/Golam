name: t003-054-advance-ledger
on:
  push:
    branches:
      - impl/003-identity-policy-secrets-sandbox
permissions:
  contents: write
jobs:
  advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/003-identity-policy-secrets-sandbox
          fetch-depth: 0
      - name: Record T003-054 and activate T003-055
        shell: python
        run: |
          from pathlib import Path

          tasks = Path('specs/003-identity-policy-secrets-sandbox/tasks.md')
          s = tasks.read_text()
          old = "- [ ] **T003-054** ACTIVE — Implement bounded unbrokerable fallback: no argv, cleared environment, exact injection scope, no ambient child inheritance, minimized lifetime and redaction.\n- [ ] **T003-055** Implement an explicit user-designated secret-entry boundary that treats the entire submitted value as secret independent of format detection; before any model-visible canonical append persist only an opaque handle, tombstone/redaction marker and non-secret metadata. Keep recognized-format detection only as defense in depth for ordinary free text."
          new = "- [x] **T003-054** Implement bounded unbrokerable fallback: no argv, cleared environment, exact injection scope, no ambient child inheritance, minimized lifetime and redaction. Exact-head qualification: CI #464 (`33166659638`) SUCCESS at `f2cef061f4a6847a2eedf7b867b8b94e4ccadd8f` on Windows/macOS/Ubuntu. Evidence: `implementation/secret-fallback-qualification.md`.\n- [ ] **T003-055** ACTIVE — Implement an explicit user-designated secret-entry boundary that treats the entire submitted value as secret independent of format detection; before any model-visible canonical append persist only an opaque handle, tombstone/redaction marker and non-secret metadata. Keep recognized-format detection only as defense in depth for ordinary free text."
          gate_old = "T003_054=ACTIVE\nCEDAR_POLICY_ADMITTED_EXACT=4.12.0"
          gate_new = "T003_054=PASS\nT003_054_QUALIFIED_HEAD=f2cef061f4a6847a2eedf7b867b8b94e4ccadd8f\nT003_054_CI_RUN=33166659638\nT003_055=ACTIVE\nCEDAR_POLICY_ADMITTED_EXACT=4.12.0"
          next_old = "NEXT_TASK=T003-054"
          next_new = "NEXT_TASK=T003-055"
          for needle in (old, gate_old, next_old):
              if needle not in s:
                  raise SystemExit(f'tasks anchor missing: {needle[:80]!r}')
          s = s.replace(old, new, 1).replace(gate_old, gate_new, 1).replace(next_old, next_new, 1)
          tasks.write_text(s)

          plan = Path('specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md')
          p = plan.read_text()
          p = p.replace('**Current task**: `T003-054`', '**Current task**: `T003-055`', 1)
          old_section = '''### T003-054 — ACTIVE\n\nImplement the bounded unbrokerable fallback only when brokered credential application is impossible.\n\nRequired boundaries:\n\n- require explicit bounded approval and an already-authenticated sandbox/process admission authorizing the exact injection channel;\n- never inject secret material into argv;\n- construct execution from a cleared ambient environment and add only the exact authorized injection value plus explicitly admitted non-secret variables;\n- prevent implicit child/grandchild secret inheritance;\n- minimize plaintext lifetime and keep any decrypted bytes inside the trusted fallback boundary;\n- apply value-aware redaction to captured stdout/stderr/log/error surfaces before they can reach model-visible or durable ordinary paths;\n- use deterministic canaries only; no real credentials;\n- fail closed when admission, approval, channel, process inheritance control, redaction, key protection or locality state is unavailable/ambiguous;\n- do not create sandbox admission or egress authority in this task; those remain owned by their later lifecycle tasks.\n\nAfter exact-head T003-054 qualification, continue directly to T003-055.\n'''
          new_section = '''### T003-054 — COMPLETE\n\nQualified at exact implementation head `f2cef061f4a6847a2eedf7b867b8b94e4ccadd8f` by CI #464 / run `33166659638`, SUCCESS on Windows/macOS/Ubuntu.\n\nEvidence: `implementation/secret-fallback-qualification.md`.\n\nThe qualified boundary provides a bounded trusted stdin-only fallback consuming exact pre-existing admission/policy/lease/effect/ONCE-approval authority, with a cleared environment, no secret argv/environment, no ambient descendant inheritance, callback-only vault plaintext exposure and exact-value output/error redaction. It creates no sandbox or egress authority and uses deterministic canaries only.\n\n### T003-055 — ACTIVE\n\nImplement the explicit user-designated secret-entry boundary.\n\nRequired boundaries:\n\n- treat the complete submitted value as secret independent of syntax or detector recognition;\n- raw submitted bytes may enter only the qualified protected vault mutation path and must never become canonical/model-visible plaintext;\n- before any model-visible canonical append, persist only an opaque handle, tombstone/redaction marker and bounded non-secret metadata;\n- recognized-format/free-text detection remains defense in depth and is not the source of the explicit-entry guarantee;\n- keep generic plaintext/ciphertext reads unavailable and preserve exact protected-mutation authority requirements;\n- use deterministic canaries only in tests.\n\nAfter exact-head T003-055 qualification, continue directly to T003-056.\n'''
          gate_old2 = "T003_054=ACTIVE\nNEXT_TASK=T003-054"
          gate_new2 = "T003_054=PASS\nT003_054_QUALIFIED_HEAD=f2cef061f4a6847a2eedf7b867b8b94e4ccadd8f\nT003_054_CI_RUN=33166659638\nT003_055=ACTIVE\nNEXT_TASK=T003-055"
          for needle in (old_section, gate_old2):
              if needle not in p:
                  raise SystemExit(f'plan anchor missing: {needle[:80]!r}')
          p = p.replace(old_section, new_section, 1).replace(gate_old2, gate_new2, 1)
          plan.write_text(p)
      - name: Commit ledger advance
        run: |
          git rm .github/workflows/t003-054-advance-ledger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/003-identity-policy-secrets-sandbox/tasks.md specs/003-identity-policy-secrets-sandbox/implementation/current-execution-plan.md
          git commit -m 'docs: qualify T003-054 and activate T003-055'
          git push origin HEAD:impl/003-identity-policy-secrets-sandbox
