name: spec005-process-qualification-patch

on:
  push:
    branches:
      - impl/005-local-tools-context-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/005-local-tools-context-memory
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Repair, format and compile qualification harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/golamd/tests/process_v2_qualification.rs')
          text = path.read_text()
          replacements = [
              (
                  '        use golam_kernel::{PrepareToolEffect, ToolReconciliationResolution};\n',
                  '        use golam_core::ToolReconciliationResolution;\n        use golam_kernel::PrepareToolEffect;\n',
              ),
              (
                  '''                ToolReconciliationResolution::ManualReview,\n                Some("process_restart_terminal_state_unproven"),\n                "2026-09-05T19:20:02Z",\n                SCOPE,\n''',
                  '''                ToolReconciliationResolution::UnknownOutcome,\n                Some("process_restart_terminal_state_unproven"),\n                None,\n                "2026-09-05T19:20:02Z",\n                SCOPE,\n''',
              ),
              ('        drop(fixture.kernel);\n\n', ''),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected qualification repair pattern exactly once: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 check --workspace --all-targets
          rm .github/workflows/spec005-process-qualification-patch.yml
          git diff --check
      - name: Commit only compiled forward repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golamd/tests/process_v2_qualification.rs Cargo.lock .github/workflows/spec005-process-qualification-patch.yml
          git commit -m "test(005): qualify process harness compilation"
          git push origin HEAD:impl/005-local-tools-context-memory
