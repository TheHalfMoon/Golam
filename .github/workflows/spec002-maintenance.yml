name: spec002-maintenance

on:
  push:
    branches:
      - impl/002-kernel-durable-session-spine

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/002-kernel-durable-session-spine
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Repair Windows-only test teardown
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/golam-ledger/src/clients.rs')
          s = p.read_text()
          needle = '        fs::remove_dir_all(r.root).unwrap();'
          if s.count(needle) != 2:
              raise SystemExit(f'expected exactly two registry cleanup sites, found {s.count(needle)}')
          s = s.replace(needle, '        drop(reg);\n        fs::remove_dir_all(r.root).unwrap();')
          p.write_text(s)
      - name: Generate lockfile
        run: cargo +1.98.0 generate-lockfile
      - name: Require locked dependency resolution in CI
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          s = s.replace('cargo +1.98.0 clippy --workspace --all-targets -- -D warnings', 'cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings')
          s = s.replace('cargo +1.98.0 test --workspace --all-targets', 'cargo +1.98.0 test --locked --workspace --all-targets')
          if '--locked' not in s:
              raise SystemExit('failed to install locked CI commands')
          p.write_text(s)
      - name: Format Rust changes
        run: rustup component add rustfmt --toolchain 1.98.0 && cargo +1.98.0 fmt --all
      - name: Commit bounded maintenance
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/golam-ledger/src/clients.rs Cargo.lock .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "build: lock Spec 002 dependency graph"
          git push origin HEAD:impl/002-kernel-durable-session-spine
