[workspace]
resolver = "3"
members = [
  "crates/golam-core",
  "crates/golam-ledger",
  "crates/golam-effects",
  "crates/golam-ipc",
  "crates/golam-kernel",
  "crates/golamd",
  "crates/golam",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
blake3 = { version = "=1.8.7", features = ["pure"] }

[workspace.lints.rust]
unsafe_code = "forbid"
