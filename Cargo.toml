[workspace]
resolver = "3"
members = [
  "crates/golam-core",
  "crates/golam-ledger",
  "crates/golam-effects",
  "crates/golam-ipc",
  "crates/golam-kernel",
  "crates/golamd",
  "crates/golam",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
blake3 = { version = "=1.8.7", features = ["pure"] }
cedar-policy = { version = "=4.12.0", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["signature", "zeroize"] }
getrandom = { version = "=0.4.3", features = ["std"] }
interprocess = { version = "=2.4.3", default-features = false }
nix = { version = "=0.31.3", default-features = false, features = ["socket", "user"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
widestring = "=1.2.1"
windows-permissions = "=0.2.4"

[workspace.lints.rust]
unsafe_code = "forbid"
